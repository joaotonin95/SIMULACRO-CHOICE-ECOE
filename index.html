<script type="application/json" id="data">[{"id": "abril-2022", "name": "Abril 2022", "year": 2022, "qs": [{"n": 1, "q": "Hombre de 60 años con un cuadro de dolor abdominal y sangrado digestivo alto, en quien se encuentra una tumoración abdominal relacionada con la pared gástrica. La histología muestra un tumor de células fusiformes con escasas mitosis, positivas para CD 117. El diagnóstico más probable es:", "o": ["Neurofibroma de la pared gástrica.", "Tumor del estroma gastrointestinal.", "Leiomioma.", "Sarcoma granulocítico."]}, {"n": 2, "q": "Mujer de 65 años que hace 3 meses presentó un cuadro de erupción cutánea vesicante sobre el dermatoma D6 derecho, acompañado de un dolor muy intenso. Tras la formación de costras, el cuadro se resolvió, pero persiste dolor moderado que se intensifica al roce y le impide el uso de ropa interior sobre la zona afectada. ¿Qué tratamiento NO sería recomendable?:", "o": ["Gabapentina oral.", "Ibuprofeno oral.", "Capsaicina tópica.", "Lidocaína tópica."]}, {"n": 3, "q": "Hombre de 60 años diagnosticado de esclerodermia hace once años, con fenómeno de Raynaud de larga evolución y sensación de reflujo gastroesofágico. En la exploración física destacan telangiectasias en la cara y esclerodactilia. Anticuerpos antinucleares positivos (títulos de 1/2.560) con patrón de inmunofluorescencia centromérico, anticuerpos anticentrómero positivos. Acude por presentar desde hace tres meses disnea que en las últimas semanas se ha intensificado hasta afectar a su actividad física habitual, sin edemas, ortopnea ni disnea paroxística nocturna. Auscultación cardiaca y respiratoria normales. La analítica muestra hemograma y función hepática y renal normales. Únicamente destaca una elevación del péptido natriurético atrial (pro-BNP). Teniendo en cuenta la información aportada, ¿cuál debería ser su primera sospecha diagnóstica?:", "o": ["Enfermedad pulmonar intersticial incipiente.", "Hipertensión arterial pulmonar.", "Insuficiencia cardiaca.", "Tromboembolismo pulmonar."]}, {"n": 4, "q": "La incontinencia urinaria constituye uno de los principales síndromes geriátricos. ¿Cuál de las siguientes afirmaciones es INCORRECTA?:", "o": ["Su prevalencia es más elevada en pacientes con patología neurológica crónica y/o síndrome de inmovilidad que en los pacientes hospitalizados por una enfermedad aguda.", "El tipo clínico más frecuente de incontinencia urinaria, en la población mayor en general, es la incontinencia de urgencia.", "El tratamiento farmacológico ha demostrado una mayor efectividad clínica en la incontinencia de urgencia / vejiga hiperactiva que en otros tipos de incontinencia.", "El tratamiento de la incontinencia de urgencia con antimuscarínicos está recomendado en pacientes con deterioro cognitivo o demencia en fase grave."]}, {"n": 5, "q": "Hombre de 77 años que acude a urgencias por deterioro del nivel de conciencia. En la anamnesis refiere astenia, anorexia y pérdida de peso en las últimas semanas. A su llegada presenta febrícula de 37,7 °C sin foco definido. Se realiza una TC craneal sin hallazgos y en el LCR obtenido tras punción lumbar se observa un líquido ligeramente xantocrómico, con los siguientes datos: presión de apertura 22 cm de H2O; células 98,100% mononucleares; glucosa 5 mg/dL; proteinas totales 2 g/L. ¿Cuál es la etiología más probable?:", "o": ["Meningitis neoplásica.", "Meningitis bacteriana aguda.", "Síndrome de Guillain-Barré.", "Hemorragia subaracnoidea."]}, {"n": 6, "q": "Hombre de 55 años remitido a la consulta por detectarse en un examen de salud hipertransaminasemia y esteatosis hepática en la ecografía. Es hipotiroideo en tratamiento sustitutivo y diabético bien controlado con metformina. Bebe alcohol muy ocasionalmente. En la exploración física destaca una obesidad tipo I (IMC de 33 kg/m²). La analítica muestra: aspartato aminotransferasa (AST) 87 UI/L, alanina aminotransferasa (ALT) 65 UI/L, fosfatasa alcalina, hormonas tiroideas y ferritina normales. Coagulación normal. La serología de hepatitis vírica (VHA, VHB y VHC) y de autoinmunidad (ANA, AMA, AML, anti LKM) es negativas. Señale la afirmación más apropiada:", "o": ["Tiene una esteatosis hepática sin riesgo de desarrollar cirrosis ni hepatocarcinoma, por lo que es suficiente el control metabólico periódico.", "Está indicado realizar una biopsia hepática por la sospecha de hepatitis autoinmune.", "Es útil realizar una elastografía de transición (FibroScan) para determinar la existencia o no de fibrosis.", "Está indicado sustituir la metformina por pioglitazona que ha demostrado ser más eficaz para mejorar la esteatosis hepática."]}, {"n": 7, "q": "Mujer de 67 años, obesa, que acude a urgencias por dolor abdominal en cuadrante superior derecho del abdomen. fiebre de 39,5 °C y orinas muy oscuras. Ante este cuadro se debería sospechar en primer lugar:", "o": ["Colecistitis aguda alitiásica.", "Coledocolitiasis.", "Colecistitis aguda litiásica.", "Colangitis ascendente."]}, {"n": 8, "q": "Cuál es el momento más apropiado para la administración de la profilaxis antibiótica en la cirugía abdominal?:", "o": ["Desde 48 horas antes de la intervención quirúrgica.", "En los 30 minutos previos al inicio de la intervención quirúrgica.", "En los 30 minutos siguientes al cierre de la incisión quirúrgica.", "Únicamente debe aplicarse si se observa contaminación del campo quirúrgico durante la intervención."]}, {"n": 9, "q": "Para conocer si el consumo habitual de una dieta de tipo mediterráneo se asocia a menor riesgo de infarto de miocardio no fatal se selecciona un grupo de sujetos, se averigua el grado de adherencia a dicha dieta y se les sigue durante 5 años para identificar los casos nuevos de infarto de miocardio. Señale la respuesta correcta sobre el diseño de este estudio:", "o": ["Es un ensayo clínico porque puede orientar la prevención en la clínica.", "Es un estudio de cohortes. porque se sigue a sujetos clasificados según su exposición para identificar el riesgo de una enfermedad.", "Es un estudio ecológico porque se sigue a un grupo de sujetos.", "Es un estudio transversal porque la adherencia a la dieta mediterránea se valora en un momento concreto en el tiempo (al inicio del seguimiento)."]}, {"n": 10, "q": "Las guías de práctica clínica (GPC):", "o": ["Son de obligado cumplimiento para todos los médicos.", "Todo su contenido ha de estar basado en la evidencia científica.", "Solo deben tener en cuenta los beneficios de salud de los pacientes (por tanto, no debe considerar el oste de las intervenciones clínicas).", "Son recomendaciones que el medico debe adaptar a la situación clínica de cada paciente."]}, {"n": 11, "q": "Respecto a las características de una prueba diagnóstica, indique la respuesta correcta:", "o": ["La especificidad es la capacidad de la prueba de clasificar correctamente, con un resultado negativo, a los enfermos.", "La especificidad es la capacidad de la prueba de clasificar correctamente, con un resultado positivo, a los enfermos.", "La sensibilidad es la capacidad de la prueba de clasificar correctamente, con un resultado positivo, a los enfermos.", "La sensibilidad es la capacidad de la prueba de clasificar correctamente, con un resultado negativo, a los sanos."]}, {"n": 12, "q": "La capacidad de un fármaco de producir el efecto deseado en condiciones ideales de uso en un ensayo de laboratorio es lo que llamamos:", "o": ["Efectividad.", "Eficacia.", "Potencia farmacológica.", "Actividad intrínseca."]}, {"n": 13, "q": "Varón de 58 años, obeso, asintomático, bebedor moderado. Que presenta una primera glucemia basal de 153 mg/d con glucosuria negativa. En las semanas siguientes ha tenido otras dos cifras de glucemias basales de 118 y 136 mg/dl. ¿Cuál de las siguientes es la actitud más apropiada para confirmar el diagnóstico de diabetes mellitus?:", "o": ["Solicitar una PTOG con 75 g de glucosa.", "Confirmar diagnóstico de diabetes mellitus.", "Solicitar una determinación de insulinemia basal o péptido C.", "Solicitar una determinación de hemoglobina glicosilada para confirmar el diagnostico."]}, {"n": 14, "q": "¿Cuál de las siguientes es la complicación metabólica más frecuente en el cancer?:", "o": ["Hiponatremia.", "Hiperuricemia.", "Hiperfosfatemia.", "Hipercalcemia."]}, {"n": 15, "q": "Una mujer de 20 años. G1. cursando embarazo de 33 semanas. concurre a guardia por pérdida de líquido claro por genitales de 2 horas de evolución. Al examen físico presenta temperatura de 36,4 ºC. y se constata por especuloscopía salida de líquido claro por OCE. Se realiza tacto vaginal: cuello blando, 2 cm de trayecto, 1 cm de dilatación, membranas rotas y cefálica móvil. Se solicita ecografía obstétrica y se constata biometría fetal acorde para edad gestacional e índice de líquido amniótico en percentilo 2. El Monitoreo fetal es reactivo, el laboratorio normal y no hay signos de infección ovular. ¿Cuál es la conducta más adecuada?", "o": ["Indicar maduración pulmonar fetal y ampicilina 500mg cada 6hs, con conducta expectante.", "Indicar maduración pulmonar fetal, penicilina 5.000.000 UI EV e inducción al trabajo de parto.", "Indicar maduración pulmonar fetal y ampicilina 500mg cada 6hs, e inducción al trabajo de parto.", "Indicar maduración pulmonar fetal, ampicilina 500mg cada 6hs y realizar cesárea abdominal."]}, {"n": 16, "q": "Un paciente presenta arritmia intensa que cesa en forma brusca al aplicar maniobras vagales. Señale cuál de las siguientes es la más probable de las arritmias que presentaba ese paciente:", "o": ["Taquicardia sinusal", "Taquicardia paroxística supraventricular", "Flutter auricular", "Taquicardia ventricular"]}, {"n": 17, "q": "Ante un paciente con sospecha clínica de hipotiroidismo, usted recibe el siguiente laboratorio: TSH aumentada, T3 y T4 disminuidas. Usted considera que se trata de:", "o": ["Hipotiroidismo secundario", "Hipotiroidismo primario", "Hipertiroidismo primario", "Hipertiroidismo secundario"]}, {"n": 18, "q": "Un paciente de 50 años con diagnóstico reciente de síndrome ascítico edematoso secundario a cirrosis alcohólica acude al consultorio para control. Se encuentra en tratamiento con restricción hídrica, dieta con 2g de sodio por día, espironolactona 200 mg/día, lactulosa 20 mg/día, complejo vitamínico B y asistencia para abandono del alcohol. En las últimas 2 semanas bajó 1 kg a pesar de cumplir correctamente las indicaciones. Trae un laboratorio que informa: Urea 42 mg/dl Cr 0.88 mg/dl Na 131 mEq/L K 6.1 mEq/L. ¿Cuál es la conducta más adecuada?", "o": ["Agregar furosemida 40 mg/dia.", "Aumentar dosis de espironolactona a 300mg/dia.", "Suspender espironolactona e indicar furosemida 120 mg/dia.", "Restringir consumo de sodio a 1g por día."]}, {"n": 19, "q": "Al Servicio de Urgencias traen un paciente politraumatizado inconsciente por un accidente de tráfico. Su cara esta aplastada y su boca y nariz llenas de sangre. Presenta obvia deformidad y crepitación de dos extremidades y sangra pulsátil y abundantemente por la cara medial del brazo. El orden de las primeras actuaciones debe ser:", "o": ["Diagnóstico de lesiones intracraneales seguido de control del sangrado arterial.", "Asegurar vía aérea permeable seguido de diagnóstico de lesiones intracraneales.", "Control del sangrado arterial seguido de inmovilización de las extremidades.", "Asegurar vía aérea permeable seguido de control del sangrado arterial."]}, {"n": 20, "q": "A un paciente asmático moderado se le realiza una espirometría. ¿Qué hallazgos espirométricos espera encontrar?", "o": ["CVF > 80% y VEF1 > 80%", "CVF > 80% y VEF1 < 80%", "CVF < 80% y VEF1 > 80%", "CVF < 80% y VEF1 < 80%"]}, {"n": 21, "q": "Una paciente de 65 años es traída a la guardia por encontrarse confusa. Tiene antecedentes de HTA en tratamiento con hidroclorotiazida y ha sufrido caídas frecuentes en la última semana. Al examen físico se encuentra desorientada. con las mucosas secas, TA: 140-83 mmHg y en el examen neurológico tiene aumentado los reflejos osteotendinosos y temblores. El laboratorio informa: Na plasmático 112 mEq/L, Na urinario de 12 mEq/L. ¿Cuál es la conducta más adecuada?", "o": ["Indicar infusión de solución salina al 3% y desmopresina.", "Discontinuar el uso de diuréticos e iniciar infusión de solución salina al 0.9%.", "Indicar solución salina al 3% y furosemida.", "Discontinuar diuréticos e iniciar infusión de solución salina al 3%."]}, {"n": 22, "q": "Anginosas con pequeños esfuerzos. En la exploración destaca presión arterial de 110/80 mmHg, frecuencia cardiaca de 85 lpm y auscultación con un soplo sistólico áspero en segundo espacio intercostal derecho y crepitantes en ambas bases pulmonares. ¿Cuál de los siguientes es el diagnóstico más probable?:", "o": ["Insuficiencia mitral.", "Estenosis aórtica.", "Insuficiencia aórtica.", "Miocardiopatia dilatada de origen isquémico."]}, {"n": 23, "q": "Varón de 23 años diagnosticado con síndrome de Wolff-Parkinson-White que acude a urgencias por palpitaciones. El ECG muestra una taquicardia irregular de QRS ancho, con una frecuencia cardiaca de 205 lpm, compatible con fibrilación auricular preexcitada. ¿Cuál de los siguientes fármacos considera adecuado administrar para detener la taquicardia?:", "o": ["Verapamilo.", "Digoxina.", "Adenosina.", "Procainamida"]}, {"n": 24, "q": "Ud se encuentra en el monte chaqueño y atiende a un hombre que habita en el lugar, de 52 años, que fue mordido por una víbora conocida on el lugar como \"Vibora de la Cruz”. ¿De cuánto tiempo máximo dispone para la aplicación del suero especifico, con el objetivo de disminuir las secuelas de esta?", "o": ["6hs", "12hs", "24hs", "48hs"]}, {"n": 25, "q": "Un paciente masculino de 36 años lo consulta porque quiere dejar de fumar y tiene decidido hacerlo cuando nazca su primera hija en aproximadamente 1 mes. Según los criterios de Prochaska, ¿en que estadio se encuentra este paciente?", "o": ["Contemplativo", "Acción", "Preparación", "Pre contemplativo"]}, {"n": 26, "q": "Cuál es el tratamiento farmacológico que e  latum?", "o": ["Cerdo", "Cordero", "Pescado", "Aves"]}, {"n": 35, "q": "¿Cuál de los siguientes fármacos, en sus formulaciones orales, ha sido retirado recientemente del mercado (diciembre de 2020)?", "o": ["Celecoxib", "Nitrofurantoina", "Cisapride", "Ranitidina"]}, {"n": 36, "q": "¿Cuál es el diagnóstico nutricional de un niño que presenta una relación Talla/edad debajo en percentilo 3 y una relación peso/talla en el percentilo 25?", "o": ["Desnutrido agudo", "Eutrófico", "Desnutrido Crônico Compensado", "Desnutrido Crónico Descompensado"]}, {"n": 37, "q": "Cuántos ml de suspensión de Cefalexina 500 mg/5 ml debe indicar administrar a la madre de un niño de 20 kg de peso que presenta un impétigo generalizado, si la dosis indicada es de 50 mg/kg/d?", "o": ["2,5 ml cada 6 hs", "5 ml cada 6 hs", "7.5 ml cada 6 hs", "10 ml cada 6 hs"]}, {"n": 38, "q": "Cuál es el rango etario en el que el exantema súbito es más frecuente?", "o": ["Niños menores de 6 meses.", "Niños de 6 meses a 2 años.", "Niños de 2 años a 6 años.", "Niños mayores de 2 años."]}, {"n": 39, "q": "La presencia de signo de Nikolski positivo en un niño es indicativo de:", "o": ["Escabiosis", "Megaloeritema o eritema anular", "Necrólisis Epidérmica Tóxica (Sme de Lyell)", "Enfermedad Pie-Mano-Boca"]}, {"n": 40, "q": "¿Cuál de los siguientes NO es un factor de riesgo relacionado a la displasia congénita de cadera?", "o": ["Sexo femenino", "Presentación pelviana", "Polihidramnios", "Desproporción feto pélvica"]}, {"n": 41, "q": "Niña de 3 años que es traída a la consulta luego de un tirón brusco del miembro superior derecho mientras caminaba con su madre. Desde entonces presenta dolor y evita movilizar el brazo, manteniéndolo cercano al cuerpo, presentando una leve flexión en codo derecho con pronación del antebrazo. No presenta inflamación ni puntos dolorosos. Señale cuál de los siguientes es el mejor tratamiento para esta niña:", "o": ["Reducción con presión de la cabeza del radio", "Colocación de una férul s A, VNC 13 y antigripal", "Triple viral, hepatitis A y VNC 13"]}, {"n": 49, "q": "Qué situación produce una anemia regenerativa?", "o": ["Hemólisis", "Deficiencia de ácido fólico y de vitamina B12.", "Invasión medular por leucemia.", "Deficiencia de eritropoyetina."]}, {"n": 50, "q": "¿Cuál es la conducta más adecuada con un señor de 34 años, tabaquista de 10 cigarrillos diarios, que consulta por acidez y dolor epigástrico de un mes de evolución, que en ocasiones cede con la ingesta y que empeoró en los últimos días? No tiene antecedentes patológicos y está preocupado por problemas económicos familiares.", "o": ["Promover la cesación tabáquica y solicitar video endoscopía digestiva alta", "Indicar tratamiento con antiácidos y procinéticos durante un mes y evaluar nuevamente", "Promover la cesación tabáquica, solicitar serología para Helicobacter pylori.", "Promover la cesación tabáquica e indicar antiácidos durante un mes y evaluar nuevamente."]}, {"n": 51, "q": "Quién o quiénes están facultados para tomar decisiones sobre alta de internación, o permisos de salida de una persona que cursa una internación psiquiátrica según el capítulo Vll de la Ley Nacional de Salud Mental (26.657)?", "o": ["El equipo de salud, sin requerir autorización del juez.", "El equipo de salud, con autorización del juez.", "El juez.", "Únicamente el psiquiatra, con autorización del juez."]}, {"n": 52, "q": "Usted recibe en su consultorio a Paula de 25 años, secundigesta nulípara, cursando un embarazo de 16 semanas. Al examen físico constata una TA de 140/90 mmHg. La cita al día siguiente para un nuevo control de tensión arterial, que resulta ser de 140/90 mmHg. La paciente refiere no tener ningún antecedente patológico. ¿Cuál es el diagnóstico de la paciente?", "o": ["Hipertensión gestacional", "Normotensa para su edad gestacional", "Preeclampsia", "Hipertensión crónica"]}, {"n": 53, "q": "Cuales la complicación digestiva más frecuente en un Recien Nacido pretérmino de bajo peso al nacer, ¿que presenta letargia y manifestaciones de acidosis metabólica?", "o": ["Atrofia vellositaria", "Enterocolitis necrotizante", "Reflujo gastroesofágico", "Vólvulo intestinal"]}, {"n": 54, "q": "Una paciente de 10 meses es traída a la guardia por presentar irritabilidad de comienzo súbito. Refieren los padres que presento un vómito y dos deposiciones desligadas de escaso volumen, por momentos llora intensamente, flexionando los miembros inferiores, y luego parece dormirse. Al examen físico, se encuentra afebril, sudorosa y pálida. El abdomen resulta difícil de evaluar debido a la irritabilidad. ¿Cuál es el diagnóstico presuntivo?", "o": ["Cólicos de lactante", "Invaginación intestinal", "Apendicitis aguda", "Alergia a las proteinas de la leche de la vaca"]}, {"n": 55, "q": "¿Cuál es la causa más frecuente de aumento moderado de la temperatura axilar en el puerperio inmediato?", "o": ["Endometritis", "Mastitis", "Ingurgitación láctea", "Infección de la episiorrafia"]}, {"n": 56, "q": "Una mujer de 55 años consulta porque trabaja 10 horas diarias como cuidadora de un adulto mayor a quien le han diagnosticado tuberculosis pulmonar bacilífera. Refiere vacunación BCG en la infancia, no tiene antecedentes patológicos y se encuentra asintomática. ¿Cuál es la conducta más adecuada?", "o": ["Realizar prueba tuberculínica y baciloscopía de esputo.", "Realizar radiografía de tórax y baciloscopía de esputo.", "Realizar prueba tuberculínica y radiografía de tórax.", "Realizar prueba tuberculínica, radiografía de tórax e indicar vacunación BCG."]}, {"n": 57, "q": "Para el análisis de las defunciones maternas se utiliza una clasificación de acuerdo al grupo de las causas. Dentro de las principales causas de mortalidad materna en Argentina se encuentra las muertes por Eclampsia (Hipertensión durante tercer trimestre del embarazo). Esta causa se clasifica como:", "o": ["Muerte materna directa", "Muerte obstétrica precoz", "Muerte obstétrica indirecta", "Muerte materna no reducible"]}, {"n": 58, "q": "Paciente de sexo femenino de 33 años presenta lesiones eritematoescamosas ubicadas predominantemente en codos, rodillas y cuero cabelludo. Se toma biopsia. Histológicamente se observa acantosis regular de las crestas interpapilares, paraqueratosis y pequeños acúmulos de neutrófilos intracórneos. En la dermis papilar existe edema, vasodilatación e infiltración linfocítica perivascular. ¿Cuál es para usted el diagnóstico histopatológico?", "o": ["Erisipela", "Psoriasis", "Eccema", "Liquen plano"]}, {"n": 59, "q": "¿Durante un auxilio médico en una situación de incendio, qué conducta adoptaría para asistir a una persona que es retirada en llamas del lugar?", "o": ["Hacerlo rodar por el piso y quitarle la ropa.", "Aplacar las llamas con un matafuego.", "Irrigar con agua y aplicar arena.", "Hacerlo rodar por el piso y aplicar mantas húmedas."]}, {"n": 60, "q": "Ingresa a la guardia un varón de 5 años con diagnóstico de deshidratación moderada, con las mucosas secas y oligúrico. Se encuentra afebril, despierto, lucido, ubicado en tiempo y espacio. Usted realiza un estado acido base que informa acidosis metabólica por lo que realiza corrección con bicarbonato. Al rato lo nota irritable, muy sediento, febril. Realiza un nuevo laboratorio que informa acidosis metabólica, sodio 150 mEq/L, potasio 2.3 mEq/L, glucemia 65 mg/dl, calcemia 7,5 mg/dl. ¿A que trastorno del medio interno atribuye los síntomas del paciente?", "o": ["Hipopotasemia", "Hipocalcemia", "Hipoglucemia", "Hipernatremia"]}, {"n": 61, "q": "¿Cómo se clasifica la muerte de una mujer embarazada a causa de un linfoma que había sido diagnosticado previamente al embarazo y se agravó a causa de este?", "o": ["Muerte materna indirecta", "Muerte materna no reducible", "Muerte materna directa", "Muerte materna precoz"]}, {"n": 62, "q": "¿Cuál sería la conducta más adecuada para una paciente de 52 años, menopaúsica? que consultó por metrorragia de 3 meses de evolución? Se le realizó histeroscopia y en el estudio citológico se informa hiperplasia con atipia.", "o": ["Adenectomía bilateral", "Histerectomia total", "Indicar 40 mg/dia de acetato de medroxiprogesterona", "Control con histeroscopia en 3 a 6 meses"]}, {"n": 63, "q": "¿Qué tratamiento antibiótico empírico elegiría para un paciente con uretritis?", "o": ["Ceftriaxona 250mg intramuscular + 200 mg de Doxiciclina via oral única dosis.", "Ciprofloxacina 500 mg cada 12 horas por 7 dias.", "Ciprofloxacina 500 mg cada 12 horas por 7 dias +1 gr de azitromicina via oral única dosis.", "Ceftriaxona 250mg intramuscular +1 gr de azitromicina via oral única dosis."]}, {"n": 64, "q": "Llega a la guardia un niño de 2 años con fiebre de 40 ºC cada 6 hs de 72 horas de evolución, rinorrea, tos y conjuntivitis. Al examen físico, además de lo descripto se observa un exantema maculo papular en región retroauricular, rostro y torso. Se auscultan rales subcrepitantes y el niño luce enfermo. El niño ha recibido solo la BCG en la maternidad. ¿Cuál considera usted el diagnóstico más probable?", "o": ["Rubéola.", "Varicela.", "Escarlatina", "Sarampión"]}, {"n": 65, "q": "Paciente de 31 años con implantes mamarios retroglandulares que presenta induración generalizada de la mama derecha. Leve eritema y ganglios axilares derechos palpables. ¿Cuál es el método de elección para valorar la indemnidad de las prótesis?", "o": ["Resonancia magnética.", "Punción con aguja fina para detectar silicona libre.", "Mamografía digital con tomosíntesis.", "Tomografía computarizada de tórax."]}, {"n": 66, "q": "Dos médicos. un camillero y un secretario de administración contable del hospital comentan en el ascensor el diagnóstico y tratamiento de Ana López que se encuentra internada en clínica médica. ¿Cuál de los principios de la Ley Nacional 26.529 no se cumplen?", "o": ["Autonomía", "Confidencialidad", "Asistencia", "Trato digno y respetuoso"]}, {"n": 67, "q": "Una paciente de 14 meses es traída a la guardia por fiebre de 38,5 ℃ de 24 horas de evolución. Se trata de una niña previamente sana, con vacunas completas. que tuvo un episodio de otitis media aguda (OMA) a los 10 meses por lo que recibió 10 días de amoxicilina como tratamiento. Recibe una dieta variada, pecho y toma un biberón en la vacuna a la noche para dormir. Tiene tres hermanos sanos de 3.5 y 7 años. ¿Qué factores de riesgo tiene esta paciente para padecer una OMA?", "o": ["Haber recibido antibioticoterapia previa", "Tomar mamadera acostado y tener 3 hermanos pequeños", "La edad y el haber padecido el primer episodio antes del año de vida", "La edad y tomar mamadera acostado"]}, {"n": 68, "q": "Un hombre de 69 años consulta a guardia por tos mucopurulenta de 3 dias de evolución. No refiere antecedentes respiratorios de relevancia. Al examen físico se encuentra normotenso, con T.Ax. 37,8 ºC. FR de 18/min, FC 88/min. Al examen físico del tórax no presenta semiología de condensación. De acuerdo al Consenso Intersociedades para el Manejo de Infecciones Respiratorias, Bronquitis Aguda y EPOC. que conducta debe adoptarse?", "o": ["Indicar tratamiento sintomático para bronquitis aguda y pautas de alarma para consulta posterior.", "Iniciar tratamiento con macrólidos y control ambulatorio en 48 hs.", "Indicar internación e iniciar tratamiento con amoxicilina/clavulánico.", "Solicitar Rx de Tórax para definir tratamiento de acuerdo al resultado."]}, {"n": 69, "q": "Un niño de 2 años es traído a la guardia por presentar fiebre de 39.5 ºC. Al examen físico se observa conjuntivitis purulenta bilateral asociada a otitis media aguda. ¿Cuál es el agente etiológico que con mayor frecuencia se asocia a este cuadro?", "o": ["Coronavírus", "Streptococcus pneumoniae", "Rinovírus", "Haemophilus Influenzae"]}, {"n": 70, "q": "¿Cuál de los siguientes hallazgos están presentes en el síndrome de ovario poliquistico?", "o": ["Disminución de la testosterona.", "Hiperplasia suprarrenal", "Hipertensión arterial", "Hirsutismo."]}, {"n": 71, "q": "Cuál de las siguientes modalidades de tratamiento preventivo con aerosoles con budesonide es la más adecuada para un niño de 2 años con broncopatía obstructiva recidivante (BOR). que estuvo internado en una oportunidad?", "o": ["Inhalador de polvo seco", "Inhalador de polvo seco más aerocamara", "Inhalador de dosis medida (IDM) más espaciador bucal", "Inhalador de dosis medida (IDM) más aerocámara"]}, {"n": 72, "q": "Un paciente concurre a consulta por guardia luego de realizar una práctica deportiva refiriendo dolor en la región de la pantorrilla. Lo describe como una patada o puntapié. Sospecha lesión de:", "o": ["Tendón de Aquiles", "Tendón Rotuliano", "Músculo gastrocnemio", "Nervio tibial posterior"]}, {"n": 73, "q": "¿Cuál es la conducta más adecuada con un niño de 3 años, previamente sano que cursa catarro de vías aéreas superiores, desgano y con registros febriles de 38 °C en las últimas 24 horas? Es llevado al control en el Centro de Salud y al realizar otoscopia se observa membrana timpánica izquierda eritematosa, abombada y por transparencia se ve contenido blanco amarillento.", "o": ["Ceftriaxona IM 50 mg/kg/día y antihistamínicos.", "Cefalexina 100 mg/k/día y analgésicos.", "Amoxicilina 80 mg/kg/día y analgésicos.", "Derivación a otorrinolaringólogo."]}, {"n": 74, "q": "¿Cuál de los siguientes marcadores tumorales puede ser útil para el seguimiento del cancer de páncreas?:", "o": ["Alfafetoproteína", "CA 125", "CA 15.3", "CA 19.9"]}, {"n": 75, "q": "¿Cuál es la conducta más adecuada en el seguimiento de un niño de 3 años y 3 meses que durante el control periódico de salud se le registra una tensión arterial (TA) por debajo del percentilo 90 para la edad según peso e índice de masa corporal?", "o": ["Continuar con el control de TA anualmente", "Es un hallazgo no significativo ya que no es necesario el control de TA", "Controlar la TA cada seis meses", "Indicar dieta hiposódica y control de la TA cada dos años"]}, {"n": 76, "q": "Llega a la guardia Andrés de 65 años consultando por dolor precordial opresivo de 4 horas de evolución que se irradia a la espalda, acompañado de mareos y sudoración. No hace referencia a ningún episodio similar a este, aunque refiero hipertensión arterial sin control. No presento disnea, ortopnea y disnea paroxística nocturna. Al momento de la consulta se encuentra ansioso e inquieto, tensión arterial 100/60 mmHg, frecuencia cardiaca 60 latidos por minuto y saturación de oxígeno del 96%. La auscultación pulmonar es normal. El electrocardiograma (ECG) presenta ritmo sinusal a 100 l/min, PR 188 mseg. supradesnivel del segmento ST en las derivaciones DI, AVL y de V1 a V6 de hasta 5 mm. ¿Cuál es el tratamiento de inicio más adecuado?", "o": ["Nitroglicerina, aspirina, clopidogrel y estatinas.", "Metoprolol, aspirina y enoxaparina.", "Fibrinólisis", "Angioplastia coronaria percutanea primario"]}, {"n": 77, "q": "Un varón de 57 años con antecedentes de hipertensión arterial y diabetes tipo ll diagnosticada hace 2 anos. concurre a control a su consultorio. La TA es de 125/80 mmHg y trae un laboratorio de hace 2 meses con los siguientes resultados: hemoglobina glicosilada 7.5%, creatinina 0.8 mg/ dL. Usted desea evaluar compromiso renal en etapa precoz de la enfermedad diabética. ¿Qué estudio solicitaría en orina?", "o": ["Indice proteinuria/creatinina", "Indice albumina/creatinina.", "Detección de proteinas en tiras reactivas.", "Valores de creatinina en urinaria."]}, {"n": 78, "q": "Un varón de 45 años lo consulta porque se le realizó diagnóstico de TBC pulmonar recientemente. Usted decide iniciar tratamiento con RifampicinaIsoniazida·Pirazinamida y Etambutol (R-H-Z-E). Luego de cumplir correctamente la terapéutica durante 10 semanas, el paciente no concurre a control. A los 6 meses lo consulta nuevamente por presentar tos, fiebre y pérdida de peso refiriendo que abandonó el tratamiento hace 3 meses. Usted solicita una nueva baciloscopía que confirma el diagnóstico de TBC. Según la Gula de Tuberculosis para el Equipo de Salud (2014), ¿cuál es la conducta más adecuada?", "o": ["Continuar tratamiento de mantenimiento con R e H", "Realizar cultivo y antibiograma e Iniciar inmediatamente tratamiento con 4 drogas distintas a las que recibió anteriormente.", "Obtener resultados de cultivo y antibiograma antes de iniciar tratamiento con RH-Z-E", "Solicitar cultivo y antibiograma e iniciar tratamiento empírico con R-H-Z-E"]}, {"n": 79, "q": "¿Cuál de los siguientes es uno de los componentes de la atención médica primaria?", "o": ["Actitud permanente hacia la educación y prevención.", "Comprensión del contexto", "Especialización en el paciente", "Atención centrada exclusivamente en la enfermedad"]}, {"n": 80, "q": "Un paciente de 28 años concurre a la consulta para control de salud. No presenta antecedentes personales ni familiares de importancia. Trae los siguientes estudios: Rx de tórax, electrocardiograma(ECG), hemograma. glucemia, perfil lipídico y test rápido para Virus de la Inmunodeficiencia Humana (VIH).La TA es de 123/78 mm Hg, la talla de 174 cm y pesa 69 Kg. De las prácticas preventivas efectuadas, ¿cuáles están recomendadas en este caso?", "o": ["Rx de tórax, hemograma, glucemia, perfil lipídico, toma de TA, medición de altura y peso.", "Perfil lipídico, test rápido de VIH, toma de TA, medición de altura y peso.", "ECG, perfil lipídico, test rápido de VIH, toma de TA, medición de altura y peso.", "Rx de tórax, ECG, hemograma, glucemia, toma de TA, medición de altura y peso."]}, {"n": 81, "q": "Una mujer con infección por VIH en tratamiento antirretroviral, cursa embarazo a término y presenta contracciones desde hace 2 horas. En el examen físico se constatan movimientos fetales positivos, frecuencia cardiaca fetal de 150 latidos por minuto, tono uterino normal, dinámica uterina de tres contracciones cada 10 minutos y duración de 40 segundos. En el tacto vaginal presenta cuello borrado en 75%, con 5 em de dilatación y bolsa integra. Tiene presentación fetal cefálica. La última carga viral (en la semana 36) fue de menos de 50 copias por ml. ¿Cuál es la conducta más adecuada?", "o": ["Realizar cesárea y zidovudina (AZT) endovenosa intraparto hasta nacimiento.", "Realizar parto vaginal y tratamiento con zidovudina (AZT)al lactante luego del nacimiento.", "Realizar cesárea y tratamiento con zidovudina (AZT)al lactante luego del nacimiento.", "Realizar parto vaginal y zidovudina(AZT)endovenosa intraparto hasta el nacimiento."]}, {"n": 82, "q": "Lo consulta la madre de Juan de 5 días de vida porque le parece que Juan duerme mucho. ¿Cuántas horas de sueño diario (en 24 horas) son esperables a esta edad?", "o": ["Entre 10 y 12 horas en total.", "Entre 13 y 15 horas en total.", "Entre B y 10 horas en total.", "Entre 16 y 20 horas en total."]}, {"n": 83, "q": "La madre de un niño de 6 años concurre a la guardia por presentar rubicundez en ambas mejillas y glúteos y una erupción maculopapular simétrica, similar a un encaje, de 3 días de evolución. Se encuentra afebril y con buen estado general. La madre refiere que dicho exantema a veces desaparece, y recidiva con el calor y la luz solar. De acuerdo a su sospecha diagnóstica, ¿cuándo el paciente se puede reintegrar a la escuela?", "o": ["Cuando desaparezca el exantema", "Puede concurrir ese mismo día", "A los 7 días de iniciado el exantema", "A los 5 días de iniciado el exantema"]}, {"n": 84, "q": "Un varón de 48 años concurre a control de salud. Niega antecedentes patológicos. Trae laboratorio que informa: glucemia 105 mg/dl, triglicéridos: 190 mg/dl, colesterol total 210 mg/dl, col-HDL: 42 mg/dl, col-LDL-150 mg/dl y creatinina 0.60 mg/dl. En el examen físico se constata: IMC 25 kg/m2, diámetro de cintura 88 cm y TA 150-90 mmHg. ¿Cuál es la conducta más adecuada?", "o": ["Citar a nuevo control de salud con resultados de PTOG", "Indicar hidroclorotiazida y dieta hiposódica", "Indicar cambios en el estilo de vida y dieta hiposódica", "Citar a nuevo control de salud para medición de TA"]}, {"n": 85, "q": "La biopsia por aspiración con aguja fina(PAAF) transtorácica guiada por imágenes (ecografía o tomografía) diagnóstica con precisión del 95% lesiones malignas de pulmón. ¿En qué caso usted utilizaría este procedimiento?", "o": ["Para el diagnostico de lesiones pulmonares centrales que no poseen contacto con el árbol bronquial.", "Para el diagnostico de lesiones pulmonares intraparenquimatosas centrales.", "Para el diagnostico de lesiones pulmonares centrales que poseen contacto con el árbol bronquial.", "Para el diagnostico de lesiones pulmonares periféricas, que se encuentran en contacto con la pared torácica"]}, {"n": 86, "q": "Usted está realizando control de salud a un niño que logra sentarse solo rola, se para con apoyo, es capaz de tomar objetos entre el pulgar y otro dedo y responde al sonido de su nombre. En cuanto al área del lenguaje y la comunicación. ¿Cuál es el hito madurativo esperado?", "o": ["Sigue orden de un paso con gesto.", "Balbuceo monosilábico.", "Pronuncia 4 a 6 palabras.", "Dice \"mama” o \"papa\"."]}, {"n": 87, "q": "Un paciente de 24 años con antecedentes de migraña y consumo de AINEs en los últimos 30 días consulta a guardia. Presenta creatininemia de 3,4 mg%, Uremia 102 mg% y Excreción Fraccionada de Sodio(FeNa) de 1.6. El examen de orina muestra abundantes cilindros epiteliales y granulosos. ¿Cuál es el diagnóstico más probable?", "o": ["Glomerulonefritis aguda", "Necrosis tubular aguda", "Fracaso renal agudo obstructivo", "Nefritis membranosa"]}, {"n": 88, "q": "Ud. atiende en su consultorio a Pedro de 2 años quien presenta un cuadro de catarro de vías aéreas y fiebre de 12 hs de evolución. Al momento del examen físico presenta una convulsión tónico clónico generalizado. ¿Cuál es el tratamiento más indicado para este paciente?", "o": ["Diazepam 0.3 mg/Kg. Intrarectal", "Diazepam 5 mg/Kg. Intramuscular", "Lorazepam 0.1 mg/Kg. Intramuscular", "Fenitoína 18 mg/Kg. Endovenoso"]}, {"n": 89, "q": "La apertura de las válvulas sigmoideas señala:", "o": ["Inicio del llenado ventricular.", "Comienzo de la contracción isovolumétrica sistólica.", "Final de la sístole.", "Final de la fase isovolumétrica sistólica."]}, {"n": 90, "q": "Paciente mujer de 30 años consulta por dolor abdominal de iniciación brusca, en hemiabdomen inferior, fiebre y dos episodios de vómitos alimentarios. Es la primera vez que presenta este cuadro. ¿Qué hallazgo del examen físico le hace sospechar un abdomen agudo quirúrgico?", "o": ["Signo de rebote o Bloomberg.", "Disminución de los ruidos hidroaéreos.", "Puno percusión positiva.", "Signo de Cullen o cabeza de medusa"]}, {"n": 91, "q": "Ante un varón de 26 años, portador de Hepatitis C, que consulta por placas blanquecinas de trama reticulada en la parte posterior de la mucosa yugal, asintomáticas, que no se desprenden al raspado, usted piensa en:", "o": ["Leucoplasia", "Traumatismo por mordedura", "Muguet oral", "Liquen plano"]}, {"n": 92, "q": "¿Cuál de los siguientes es un criterio absoluto de insulinización de un paciente con DM2?", "o": ["HbA1c > 10%", "Baja adherencia al tratamiento", "Glucemia al azar > 200 mg%", "Glucosuria"]}, {"n": 93, "q": "¿Cuál de los siguientes es un hallazgo de laboratorio característico del Dengue?", "o": ["Trombofilia", "Trombocitopenia", "Eosinofilia", "Anisocitosis"]}, {"n": 94, "q": "¿Cuál es el diagnóstico más probable de un niño de 3 años, sin carnet de vacunación, que consulta por fiebre, regular estado general y tos con estridor laríngeo acompañada de vómitos?", "o": ["Enfermedad por Reflujo Gastroesofágico (ERGE)", "Bronquiolitis por adenovirus", "Coqueluche", "Neumonia por Haemophilus influenzae"]}, {"n": 95, "q": "¿Cuál de las siguientes es un criterio de elegibilidad 4 para el uso de DIU?", "o": ["Anemia ferropénica", "HTA", "ITS en el último mes", "Cancer de mama"]}, {"n": 96, "q": "¿Cuál de los siguientes tratamientos es más efectivo ante una crisis hemorroidal?", "o": ["AINEs", "Diosmina + hesperidina", "Simeticona + Trimebutina", "Heparina"]}, {"n": 97, "q": "¿Cuál de los siguientes es un criterio mayor de diagnóstico de Anorexia nerviosa?", "o": ["Amenorrea", "Conductas purgativas", "Conductas restrictivas", "Depresión"]}, {"n": 98, "q": "Una paciente de 26 años consulta por mastalgia moderada que aumenta en cada menstruación. No refiere antecedentes personales ni familiares de importancia. Al examen físico se palpan pequeños nódulos indurados en ambas mamas. El diagnóstico más probable y conducta más apropiada es:", "o": ["Displasia mamaria, solicita mamografía bilateral con proyección axilar.", "Displasia mamaria, solicita ecografía mamaria bilateral.", "Tumor Phyllodes, solicita punción y biopsia.", "Tumor Phyllodes, solicita ecografía y marcadores tumorales."]}, {"n": 99, "q": "¿Cuál de las siguientes NO es causa probable de vértigo?", "o": ["Laberintitis", "Enfermedad de Méniere", "Rectificación cervical", "Vértigo posicional benigno"]}, {"n": 100, "q": "En un hemograma, el aumento del RDW o ADE, indica:", "o": ["Macrocitosis", "Anisocitosis", "Hipocromía", "Poiquilocitosis"]}]}, {"id": "diciembre-2022", "name": "Diciembre 2022", "year": 2022, "qs": [{"n": 1, "q": "Una mujer de 46 años consulta a control de salud trayendo resultados de un laboratorio que le pidieron en un preocupacional, donde se constata glucemia: 115 mg/dl. Como antecedentes familiares refiere que su padre falleció de un “ataque cerebral” y que su madre es obesa. Tuvo dos embarazos, ambos sin controles: un parto normal y una cesárea por mala progresión del parto por macrosomía fetal (RN peso 4600 g). En la consulta presenta TA 120/70 mmHg, peso 76 kg y talla 1,59 m, con un índice de masa corporal (IMC) de 30,06 kg/m². Según la “Guía de práctica clínica nacional para la prevención, diagnóstico y tratamiento de la diabetes mellitus tipo 2”, ¿cuál es la conducta más adecuada?", "o": ["Diagnosticar diabetes tipo II e indicar tratamiento.", "Solicitar una prueba de tolerancia oral a la glucosa.", "Solicitar nueva glucemia en ayunas.", "Solicitar perfil lipídico, TSH, T3 y T4."]}, {"n": 2, "q": "Bautista, de 2 años, es traído por su madre a control de salud. Presenta episodios intermitentes de dolor abdominal tipo cólico y diarrea en los últimos meses. En el examen físico se constata mal progreso pondoestatural desde el control previo. De acuerdo con su sospecha diagnóstica, ¿qué estudios solicitaría?", "o": ["Test del sudor", "Coprocultivo", "Parasitológico de materia fecal", "Leucocitos en materia fecal"]}, {"n": 3, "q": "Pedro, de 5 años y 11 meses, es traído al centro de salud para control. La madre refiere que le robaron el carnet de vacunación y no tiene forma de constatar las vacunas aplicadas. No se observa cicatriz de BCG. ¿Qué vacunas debe indicar?", "o": ["BCG, pentavalente, hepatitis A, triple viral y Sabin.", "DPTa, hepatitis A, triple viral, Sabin y neumococo.", "DPT, hepatitis A, triple viral y Sabin.", "BCG, DPT, hepatitis A, triple viral y Sabin."]}, {"n": 4, "q": "Un varón de 18 años es traído a la consulta por tumefacción y dolor escrotal de tres horas de evolución, luego de jugar a la pelota. Se constata leve eritema y edema escrotal derecho, con dolor a la palpación que no se modifica con el ascenso testicular y reflejo cremastérico ausente. ¿Cuál es la conducta más adecuada?", "o": ["Indicar cirugía de forma inmediata.", "Solicitar orina completa, ecografía Doppler testicular y aguardar resultados para decidir conducta.", "Indicar reposo, hielo y antiinflamatorios con control ecográfico en 12 horas.", "Solicitar ecografía testicular y, según resultados, realizar interconsulta con urología."]}, {"n": 5, "q": "¿Cómo interpreta que la recomendación de simvastatina en pacientes con enf. coronaria e hipercolesterolemia se considera de tipo A con evidencia grado 1?", "o": ["Indica que existe evidencia científica para adoptar la práctica obtenida de al menos un ensayo clínico randomizado, controlado y bien diseñado.", "Indica que es una recomendación basada en experiencias clínicas suficientes, estudios descriptivos y opinión de expertos.", "Indica que existe cierta evidencia científica para adoptar la práctica proveniente de estudios de casos y controles.", "Indica que existe evidencia científica para adoptar la práctica obtenida a partir de estudios de cohortes prospectivos y retrospectivos."]}, {"n": 6, "q": "¿Cuál es el modo de transmisión que origina con mayor frecuencia brotes de leptospirosis en humanos?", "o": ["Contacto con sangre de animales infectados.", "Ingestión de agua o alimentos contaminados con heces de animales infectados.", "Contacto con agua o vegetación contaminadas con orina de animales infectados.", "Transmisión interhumana."]}, {"n": 7, "q": "Paciente con radiografía de tórax que evidencia ensanchamiento mediastinal. Se solicita una TC de tórax en la que se observan imágenes con densidad de partes blandas con calcificaciones en “capas de cebolla” a nivel subcarinal y retrocava-pretraqueal. Su diagnóstico presuntivo es:", "o": ["Sarcoidosis", "Osteosarcoma de Ewing"]}, {"n": 8, "q": "Pablo, de 51 años, padece diabetes mellitus tipo 2. Concurre a la consulta manifestando su preocupación por presentar disfunción eréctil. Usted decide indicarle tadalafilo, por lo que previamente se asegura de que el paciente no esté medicado ni consuma: ………………. (Opciones tomadas de la misma pregunta en Febrero 2024, porque faltan en el PDF.)", "o": ["Nitratos.", "Losartán.", "Antidepresivos tricíclicos.", "Betabloqueantes."]}, {"n": 9, "q": "Un hombre de 32 años con antecedente de colitis ulcerosa de 3 meses de evolución, tratado con prednisona (40 mg/día) y mesalazina (4 mg/día), acude al servicio de urgencias por empeoramiento de su estado general acompañado de aumento en el número de deposiciones (hasta 10 diarias, todas con sangre) y dolor abdominal cólico. Es ingresado e inicia tratamiento con esteroides por vía intravenosa (1 mg/kg/día) y sueroterapia. A las 36 horas presenta incremento del dolor abdominal, distensión importante y ausencia de deposiciones. Presenta temperatura de 38,7 °C, FC 124 lpm, abdomen distendido, doloroso y timpánico, con signos de irritación peritoneal. El hemograma muestra leucocitosis de 17.000/mm³. Estudios radiológicos muestran colon transverso dilatado de 8 cm sin aire libre. ¿Qué tratamiento es más adecuado?", "o": ["Infliximab", "Colectomía subtotal de urgencia", "Azatioprina", "Ciclosporina intravenosa", "Salazopirina a dosis altas por vía oral"]}, {"n": 10, "q": "Los padres traen a la consulta a su hijo para el control de salud. La madre lo coloca con suavidad sobre la camilla y el lactante ríe a carcajadas, silabea, se sienta y lo mira fijamente. Cuando usted se acerca al niño, éste grita y tiende los brazos hacia el padre. ¿En cuál de las siguientes edades es más típico observar estos hitos del desarrollo?", "o": ["Entre 5 y 6 meses", "Entre 7 y 8 meses"]}, {"n": 11, "q": "Un niño de 11 meses presenta constipación, hipotonía, debilidad generalizada con trastornos de la succión y llanto débil de 12 horas de evolución. La madre refiere que la noche anterior, en el patio de comidas de un shopping, el hermano de 6 años compartió con él una hamburguesa y copos de maíz con miel. ¿Cuál es el diagnóstico más probable?", "o": ["SUH", "Salmonelosis", "Botulismo", "Sepsis", "Meningitis por meningococo"]}, {"n": 12, "q": "Un niño de 4 años previamente sano, aunque no inmunizado, presenta inicio súbito de fiebre alta, estridor inspiratorio y rechazo a tomar agua. ¿Cuál de las siguientes causas de estridor inspiratorio se ajusta a este cuadro clínico?", "o": ["Crup vírico", "Epiglotitis", "Laringitis"]}, {"n": 13, "q": "Con respecto a la Ley 26.130 de anticoncepción quirúrgica, señale lo correcto:", "o": ["Anticoncepción Quirúrgica garantiza el acceso a la ligadura tubaria y a la vasectomía como un derecho de todas las personas.", "Garantiza el acceso universal a la cirugía de esterilización."]}, {"n": 14, "q": "Con respecto a la anticoncepción hormonal de emergencia, señale lo correcto:", "o": ["No debe ser administrada a menores de 18 años.", "Eficacia mayor al 75%.", "Se debe administrar después de las 48-72 horas.", "Tiene una efectividad del 75%."]}, {"n": 15, "q": "Consulta una paciente de 62 años que fuma desde hace 15 años y no presenta otros antecedentes. ¿Qué estudios están recomendados en su control periódico de salud?", "o": ["Ecografía mamaria, mamografía, densitometría ósea, radiografía de tórax, Videocolonoscopía y Papanicolaou.", "Mamografía, densitometría ósea, radiografía de tórax, Videocolonoscopía y Papanicolaou.", "Mamografía, densitometría ósea, espirometría, Videocolonoscopía y Papanicolaou.", "Mamografía, densitometría ósea, Videocolonoscopía y electrocardiograma."]}, {"n": 16, "q": "Una joven de 16 años consulta para control de salud y manifiesta que quiere cuidarse porque está en pareja. No tiene antecedentes y no utiliza método anticonceptivo. ¿Cuál es la conducta adecuada para el abordaje de su salud sexual y reproductiva?", "o": ["Se le sugiere que concurra con un nuevo turno acompañada por un adulto para abordar el tema, debido a que es menor de edad.", "Se le informa sobre el preservativo y los métodos anticonceptivos hormonales disponibles. Se le informa que no puede utilizar DIU debido a que es nulípara.", "Se le informa sobre todos los métodos anticonceptivos disponibles en Argentina, para que decida cual utilizar, y se le ofrece rastreo de VIH y Sífilis.", "Se le sugiere uso de preservativo hasta que realice un control ginecológico con PAP, para evaluar si puede utilizar anticonceptivos hormonales."]}, {"n": 17, "q": "Una paciente de 43 años concurre al control adjuntando una mamografía que informa: parénquima mamario fibroglandular con leve transformación adiposa, calcificaciones vasculares dispersas y nódulo de bordes netos en cuadrante inferointerno izquierdo, compatible con ganglio intramamario. ¿A qué categoría de la clasificación BIRADS corresponden estas imágenes?", "o": ["BIRADS 0", "BIRADS 1", "BIRADS 2", "BIRADS 3"]}, {"n": 18, "q": "Un paciente de 25 años consulta por un cuadro de fiebre con dolor abdominal a predominio de flanco y fosa iliaca derecha y diarrea sanguinolenta de 15 días de evolución. Refiere debilidad generalizada y artralgias en ambas muñecas en los últimos días. Al examen físico presenta TA 110/70 mm Hg, FC: 110 / min, Fr 16/min, T 37 °C. El abdomen se presenta doloroso a la palpación profunda en fosa iliaca derecha. El laboratorio revela: Hto 28 %, Rto Gb 15.000/mm3, Rto Plaq 355.000/mm3 y PCR 4 mg/L. ¿Cuál es el procedimiento inicial para orientar el diagnóstico?", "o": ["Cultivo de materia fecal", "TC de abdomen y pelvis con y sin contraste", "Laparotomía exploradora", "Videocolonoscopía"]}, {"n": 19, "q": "Un varón de 17 años, sin antecedentes personales relevantes, consulta por presentar disfagia y odinofagia de 7 días de evolución y registros febriles. Recibió tratamiento con amoxicilina, sin mejoría. En la exploración se observa hipertrofia amigdalina con exudado blanquecino, abombamiento del pilar anterior con desplazamiento hacia la izquierda de la úvula y adenomegalias laterocervicales de aspecto inflamatorio. ¿Cuál es el procedimiento más adecuado en esta instancia?", "o": ["Biopsia de amígdala", "Cultivo del exudado amigdalino", "TC cuello con cortes axiales y coronales con contraste endovenoso", "Punción aspiración del pilar amigdalino"]}, {"n": 20, "q": "Un varón de 70 años consulta por presentar disfagia para sólidos, ligera regurgitación y reflujo gastroesofágico de 1 año de evolución que se ha acentuado en los últimos meses, presentando episodios previos de atragantamiento. El examen físico y el laboratorio son normales. Se solicita un tránsito esofágico que informa: esófago marcadamente dilatado con una estenosis filiforme inferior (“cola de ratón”). Ante este cuadro, ¿cuál es el tratamiento más eficaz?", "o": ["Antagonistas del calcio (Nifedipino o Verapamilo) por vía sublingual.", "Esofagocardiotomía de
