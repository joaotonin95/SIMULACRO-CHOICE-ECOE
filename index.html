ilcisteína"]}, {"n": 57, "q": "¿Cuál de los siguientes signos es característico de la intoxicación por salicilatos?", "o": ["Acidosis metabólica aislada", "Alcalosis respiratoria inicial", "Hipoglucemia severa persistente", "Bradicardia marcada"]}, {"n": 58, "q": "En un paciente con insuficiencia cardiaca, ¿cuál de los siguientes medicamentos se considera un inhibidor de la neprilisina?", "o": ["Digoxina", "Sacubitrilo", "Enalapril", "Furosemida"]}, {"n": 59, "q": "En la intoxicación por antidepresivos tricíclicos, ¿qué hallazgo electrocardiográfico es más característico?", "o": ["QRS prolongado", "PR acortado", "QT acortado", "Elevación difusa del ST"]}, {"n": 60, "q": "¿Cuál de los siguientes venenos es conocido por causar \"síndrome de la muerte de las células endoteliales?", "o": ["Amanita phalloides", "Paracetamol", "Monóxido de carbono", "Metanol"]}, {"n": 61, "q": "En el contexto de una intoxicación por plomo, ¿cuál de las siguientes manifestaciones clínicas es más característica en niños?", "o": ["Hipertensión arterial severa aguda", "Déficit cognitivo y alteraciones del neurodesarrollo", "Ictericia y coluria", "Exantema vesicular generalizado"]}, {"n": 62, "q": "Paciente de 28 años, G1 PO, de 32 semanas de gestación, acude a consulta por presentar flujo vaginal abundante, claro e inodoro. La paciente niega dolor o prurito vaginal. En la exploración se realiza la prueba de Nitrazina, que da un resultado positivo. El monitoreo fetal muestra un perfil biofísico de 8/8, sin actividad uterina. ¿Cuál es la conducta más adecuada para esta paciente?", "o": ["Vigilancia ambulatoria con control ecográfico semanal y antibióticos orales", "Inducción inmediata del parto", "Cesárea de urgencia", "Conducta expectante hospitalaria con maduración pulmonar fetal y vigilancia"]}, {"n": 63, "q": "Mujer de 40 años, G3P2, que se encuentra en la semana 39 de gestación acude a consulta refiriendo disminución de movimientos fetales en las últimas 24 horas. La ecografía muestra oligohidramnios severo y el registro cardiotocográfico revela un patrón de desaceleraciones variables profundas y recurrentes. ¿Cuál es el siguiente paso más apropiado?", "o": ["Realizar cesárea de urgencia debido a compromiso fetal", "Conducta expectante con control en 24 horas", "Inducción con prostaglandinas y vigilancia ambulatoria", "Alta con control en consultorio"]}, {"n": 64, "q": "Una paciente de 32 años consulta por dolor pélvico crónico que se intensifica durante la menstruación. Tras realizar estudios se confirma el diagnóstico de endometriosis ¿Cuál es el tratamiento médico de elección para esta paciente?", "o": ["Análogos agonistas de GnRH", "Antibióticos de amplio espectro", "Corticoides sistémicos", "Diuréticos"]}, {"n": 65, "q": "Una mujer presenta hemorragia intensa inmediatamente después del parto ¿Cuál es la causa más común de este tipo de hemorragia postparto?", "o": ["Atonía uterina (falla de contracción del útero)", "Coagulopatía congénita", "Retención de restos placentarios como causa más frecuente", "Inversión uterina"]}, {"n": 66, "q": "Una embarazada de 16 semanas de edad gestacional se presenta la consulta de control prenatal con un urocultivo positivo para Escherichia coli. Al interrogatorio la paciente no manifiesta síntomas compatibles con infección urinaria. ¿Cuál es su conducta?", "o": ["Indica tratamiento con norfloxacina 500 mg cada 12 horas por 3 días y seguimiento con urocultivo mensual.", "Indica tratamiento con cefalexina 500 mg cate horas por días y repite-urocultivo postratamiento.", "Repite el urocultivo caso de positividad indica tratamiento con nitrofurantoina 100 mg cada 6 horas por 7 días.", "Tranquiliza la paciente y no indica tratamiento por no presentar sintomatología"]}, {"n": 67, "q": "Una paciente de 34 años, G3P2, cursa embarazo de 37 semanas. Consulta a a la guardia por pérdida de líquido por genitales externos de 2 horas de evolución. Al examen, lucida, TA 110/60 m, FC 84 por minuto, temperatura axilar 36,4 °C, dinámica uterina aislada, tono uterino normal, movimientos fetales positivos, FCF 140 por minuto. Tacto vaginal: cuello posterior, formado, permeable al dedo, presentación pelviana, líquido amniótico claro. ¿Cuál es la conducta más adecuada?", "o": ["Conducta expectante durante 24 horas e inducción al trabajo de parto", "Conducta expectante durante 48 horas e inducción al trabajo de parto", "Cesárea abdominal", "Conducta expectante durante 72 horas e inducción al trabajo de parto"]}, {"n": 68, "q": "Concurre al Centro de salud a paciente de 20 años porque 12 horas refiere la rotura del preservativo durante la relación sexual con su pareja. Como antecedente de relevancia es tabaquista de 15 cigarrillos por día y sufre de migrañas realizando tratamiento preventivo con propranolol. No utiliza otro método anticonceptivo. No tiene deseos de maternidad por el momento. Una amiga le recomendó que tomara la \"píldora del día después. ¿Cuál es la conducta más adecuada en este momento?", "o": ["Indicar levonorgestrel 1,5 mg en una dosis única", "Contraindicar anticoncepción hormonal de emergencia", "Indicar levonorgestrel 0,75 mg en una dosis única", "Solicitar laboratorio previo a la anticoncepción hormonal de emergencia"]}, {"n": 69, "q": "Usted recibe en su consultorio a Noah de 15 días de vida, hijo de Marina y Lucas ambos sanos. Noah Nació de 39 semanas con 3580 gr y tuvo un peso mínimo al 3er dia de vida de 3400 gr. Se alimenta con lactancia materna exclusiva y actualmente tiene peso de 3900 gr. El embarazo fue controlado, sin complicaciones y comparte grupo y factor sanguíneo con la madre. Examen físico presenta ictericia generalizada de piel y mucosas. ¿Cuál sería su conducta prioritaria?", "o": ["Solicita prueba de Coombs", "No realizar estudios y aconseja continuar con alimentación materna", "Solicita ecografía abdominal", "Solicita dosaje de Bilirrubina total y fraccionada"]}, {"n": 70, "q": "Usted se encuentra en la guardia de pediatría de Hospital de Buenos Aires cuando recibe a Santino de 3 años en brazos de su madre quien le cuenta lo siguiente: \"Hola doctor, lo traigo a Santino porque hace 2 días empezó con vómitos y desde ayer esta con mucha diarrea. Le duele la panza, no come nada y solo toma agua. En mi casa estamos igual, pero él está muy decaído\". ¿Cuál sería su conducta inicial?", "o": ["Solicitar cultivo de materia fecal", "Tomar muestra de ionograma, urea y creatinina plasmática", "Solicitar una ecografía abdominal", "Evaluar el estado de hidratación"]}, {"n": 71, "q": "Usted se encuentra consultorio, cuando recibe a Zoe de 18 meses que es traída por su madre con el siguiente relato: “Hola Dr., la traigo a Zoe porque hace 2 días esta con fiebre y hoy le salieron estas manchitas”. Usted la revisa y nota que presenta lesiones vesiculares en las palmas y plantas. En función de su hipótesis diagnostica ¿Cuál sería su conducta?", "o": ["Solicitar serologías virales", "Solicitar hisopado de fauces", "Indicar tratamiento antibiótico infecciones de piel y partes blandas", "Indicar tratamiento sintomático y dar pautas de alarma"]}, {"n": 72, "q": "Padre, un hermano de 9 años y su tío a quien le diagnosticaran recientemente tuberculosis. Dado que usted es su pediatra de cabecera, la madre lo trae para consultarte los pasos a seguir. Benicio presenta examen físico normal y no presenta ningún síntoma. De acuerdo con la información obtenida¿ Que le recomendación haría a la madre?", "o": ["Realizar radiografía de tórax y Prueba tuberculínica (PPD)", "Iniciar tratamiento preventivo con isoniacida", "Tomar conducta expectante hasta inicio de síntomas", "Solicitar cultivo de esputo"]}, {"n": 73, "q": "Usted se encuentra atendiendo en la guardia de pediatría de un Hospital y recibe a Malena de 8 años que es traída por su padre quien le cuenta lo siguiente: \"Hola, la traigo porque esta con mucha dificultad pare respirar, empezó ayer con tos, pero hoy está peor. Ya le había pasado esto en otras ocasiones y mejoraba con los puff de salbutamol. Pero hoy la noto peor que otras veces. Por suerte no tuvo fiebre. Al examen física usted nota que Malena es una niña eutrófica, se encuentra afebril, con tiraje subcostal y taquipnea. Ausculta sibilancias en ambos campos pulmonares. De acuerdo con la presentación clínica y prevalencia de enfermedad ¿Cuál considera como diagnóstico más probable?", "o": ["Exacerbación Asmática", "Fibrosis quística del páncreas", "Tuberculosis pulmonar", "Bronquiolitis aguda"]}, {"n": 74, "q": "Ana Clara de 2 años es traída al sector de emergencias en brazos de su madre “¡Hola doctor, rápido! No sé qué le paso a Ana Clara, estaba jugando y de repente se quejó y empezó a sacudirse toda, no podía parar. Yo la llamaba y no me respondía, estaba con los ojitos para atrás. Es la primera vez que le pasa. Por suerte vivimos cerca y mientras mientras veníamos dejo de moverse, ahora ya se está despertando”. Ana Clara es una niña sana y al examen físico, usted rescata la siguiente información : T. 39 ºC, FC 125 lpm, FR 18 rpm ,TA normal. Se encuentra despierta y reactivas a estímulos, moviliza 4 miembros y las pupilas se encuentran isocóricas y reactivas, ¿Cuál es su conducta inicial?", "o": ["Indicar Punción Lumbar", "Indicar Electroencefalograma", "Indicar antipiréticos y monitoreo clínico", "Indicar tomografía cerebral"]}, {"n": 75, "q": "Marina, de 15 días de vida, es traída por su madre, para realizar el primer control en salud. El embarazo fue controlado, sin complicaciones. Nació de 39 semanas con un peso de 3400 gr. Alta conjunta a les 48 horas y se alimenta con lactancia materna en forma exclusiva. Al examen físico usted obtiene la siguiente información: T. 36 °C, FC 145 lpm, FR 50 rpm. Observa tiraje subcostal y escucha buena entrada de aire bilateral con un soplo sistólico y pulsos periférico presentes. SatO2 FIO2 0.21 96% en 4 miembros. Ante su consulta le refieren los siguiente: “cuando toma el pecho se cansa y transpira un poco, pero no tose. Me parece que es por el calor\". El peso actual es del 3200 gr ante este escenario clínico. ¿Cuál es su diagnóstico más probable y conducta prioritaria¿", "o": ["Insuficiencia Cardiaca. Solicitar evaluación por guardia y eventual internación", "Hipogalactia. Complementar la alimentación con leche de formula", "Bronquiolitis. Indicar salbutamol cada 4 hs y control en 24 hs", "Falle en la técnica alimentaria. Pautas de puericultura y continuar con lactancia exclusiva"]}, {"n": 76, "q": "Usted atiende a Jonás de 5 años, quien es traído a la consulta de guardia por padres quienes le cuenta lo siguiente: \"Lo traemos a Jonás porque hace 2 días que se queja de dolor cuando camina y hoy ya no quiere caminar\". Ante su consulta le refieren: \"Es un chico sano, pero hace unas semanas tuvo fiebre y mocos, pero de eso ya se curó”. Al examen físico usted nota lo siguiente: T 36.5 °C FC 86 lpm, FR 20 rpm. Fuerza muscular en miembros inferiores conservada, limitación en la rotación externa y abducción de cadera derecha. ¿Cuál es su diagnóstico probable¿", "o": ["Síndrome de Guillain Barré", "Enfermedad de Perthes", "Sinovitis transitoria de cadera", "Artritis de cadera"]}, {"n": 77, "q": "Un recién nacido es evaluado con el Test de Apgar para determinar su adaptación a la vida extrauterina. ¿Qué parámetros se consideran en esta prueba?", "o": ["Saturación de oxígeno, pulso, presión arterial, reflejos primitivos y coloración del cordón umbilical.", "Frecuencia cardiaca, frecuencia respiratoria, tono muscular, respuesta refleja y coloración de la piel.", "Temperatura, tono muscular, coloración de la piel, presión arterial y coloración del cordón umbilical.", "Edad gestacional, frecuencia respiratoria, tono muscular, coloración de extremidades y tamaño de las pupilas."]}, {"n": 78, "q": "Una paciente de 36 años, G2P1 que cursa embarazo de 10 semanas, concurre a su primer control obstétrico. Se solicita laboratorio constatándose glucemia en ayunas de 105 mg/dl. Al interrogatorio no presenta antecedentes de diabetes personal ni familiar. ¿Cuál es la conducta inicial más adecuada?", "o": ["Diagnosticar diabetes gestacional y comenzar tratamiento", "Solicitar curva de tolerancia oral a la glucosa (P75) en forma inmediata", "Solicitar curva de tolerancia oral a la glucosa (P75) entre las 24-28 semanas", "Repetir glucemia en ayunas"]}, {"n": 79, "q": "Se presenta a la consulta Luciano de 3 años junto su madre quien le cuenta lo siguiente: \"Luciano esta con diarrea hace como 2 meses, al principio me dijeron que era una gastroenteritis y que se le iba pasar. Pero la verdad que sigue con diarrea a veces hace 3 o 4 veces por día y las deposiciones son bastante flojas. Yo lo veo muy flaquito. Creo que necesita vitaminas\" Usted nota que Luciano presenta distensión abdominal leve, dolor difuso a la palpación y descenso de peso respecto del último control ¿Cuál de las siguientes conductas no sería una prioridad para usted?", "o": ["Solicitar estudio coproparasitológico", "Solicitar virológico en materia fecal", "Solicitar anticuerpos anti péptido de aminado de la gliadina y anti transglutaminasa", "Solicitar cuerpos reductores en materia fecal"]}, {"n": 80, "q": "En el control de salud, previo al ingreso al jardín, usted evalúa a Lionel de 3 años quien es un niño con vacunas completas. De la entrevista surge siguiente: “ no habla mucho, pero se hace entender bien. Algunas palabras conozco y se lo que quiere. Aparte señala todo lo que necesito. Me parece que es porque nació la hermanita hace poco\". ¿Frente a esto que recomendaciones le haría a la madre?", "o": ["Que no inicie Jardin hasta que no adquiera un mejor lenguaje", "Control de salud habitual en 1 año", "Reevaluar en 6 meses, dado que el nacimiento del hermano pudo haber sido un evento traumático", "Realizar evaluación de la audición y lenguaje."]}, {"n": 81, "q": "Usted trabaja en el área de internación de pediatría de un hospital público y asiste a Jazmin de 12 años quien se encuentra internada por edemas generalizados. Usted 5 Fl. De acuerdo con el grupo etario y prevalencia de enfermedad, ¿Cuál es su diagnóstico más probable?", "o": ["Valores normales para la edad", "Anemia hemolítica", "Anemia aplásica", "Anemia Ferropénica"]}, {"n": 85, "q": "José de 35 años se realiza cheques para practicar deporte. Le realizan un ecocardiograma Doppler. El medico dijo que la función del ventrículo izquierdo era normal ¿Cuál sería el valor normal de la fracción de eyección del ventrículo izquierdo en adultos?", "o": ["70-90%", "50-70%", "35-45%", "25-35%"]}, {"n": 86, "q": "¿Cuál de los siguientes marcadores serológicos es más específico para el diagnóstico de Lupus eritematoso sistémico (LES)?", "o": ["Anticuerpos antifosfolípidos", "Anticuerpos antinucleares (ANA)", "Anticuerpos anti-RNA de doble hebra", "Anticuerpos anti-Smith"]}, {"n": 87, "q": "En un paciente con enfermedad pulmonar obstructiva crónica (EPOC) ¿Qué hallazgos en la gasometría arterial indicaría una exacerbación grave?", "o": ["Alcalosis respiratoria", "Hipocapnia", "Acidosis metabólica", "Hipoxemia"]}, {"n": 88, "q": "Un hombre de 37 años consulta debido a una fiebre inexplicada, sensación de calor y episodios de sudoración nocturna. En su historial, no se identifican infecciones ni enfermedades autoinmunes. Su temperatura es difícil de controlar y los estudios de laboratorio no revelan infecciones activas. ¿Cuál es la estructura cerebral principal involucrada en la regulación de la temperatura corporal de este paciente?", "o": ["Corteza Cerebral", "Tálamo", "Amígdala", "Hipotálamo"]}, {"n": 89, "q": "Una mujer de 24 años con diabetes tipo 1 es llevada a emergencias con signos de cetoacidosis diabética. Sus niveles de glucosa son altos, presenta deshidratación severa y una respiración profunda y rápida. ¿Cuál sería la primera medida terapéutica para estabilizar a esta paciente?", "o": ["Dieta baja en carbohidratos", "Líquidos intravenosos e insulina regular.", "Glucosa intravenosa", "Insulina de acción prolongada"]}, {"n": 90, "q": "Un hombre de 52 años con fiebre, dolor torácico pleurítico y tos productiva con expectoración amarillenta, acude a urgencias. En la exploración se escuchan estertores crepitantes en el hemitórax derecho. ¿Cuál es el agente etiológico más común en neumonia adquirida en la comunidad que debería considerarse en ese caso?", "o": ["Mycoplasma pneumoniae", "Haemophilus influenzae", "Staphylococcus aureus", "Streptococcus pneumoniae"]}, {"n": 91, "q": "Una mujer de 65 años presenta dolor e hinchazón en la pierna derecha. La ecografía confirma trombosis venosa profunda. El equipo de salud planifica el inicio de tratamiento para reducir el riesgo de embolia pulmonar. ¿Cuál sería la intervención INICIAL más indicada en esta paciente?", "o": ["Heparina de bajo peso molecular", "Anticoagulantes orales acción prolongada", "Diuréticos", "Antiagregación plaquetaria"]}, {"n": 92, "q": "Un hombre de 47 años acude por fatiga, palidez y dificultad cara concentrarse. Los exámenes de laboratorio muestran un índice de reticulocitos bajo y hematies macrocíticos. Sin otros hallazgos evidentes, ¿qué tipo de anemia debe considerarse en primer lugar para este paciente¿", "o": ["Anemia megaloblástica", "Anemia hemofílica", "Anemia aplásica", "Anemia ferropénica"]}, {"n": 93, "q": "¿Qué antídoto se utiliza en caso de sobredosis de benzodiazepinas?", "o": ["N-acetilcisteína", "Flumazenilo", "Naloxona", "Atropina"]}, {"n": 94, "q": "¿Cuál es el principal efecto tóxico del metanol?", "o": ["Neutropenia", "Hepatotoxicidad", "Acidosis metabólica", "Miocardiopatía"]}, {"n": 95, "q": "Un paciente adulto ha sido sometido a una esplenectomía. ¿Cuál es el esquema de vacunación recomendado para protegerlo contra infecciones graves?", "o": ["Vacuna antigripal (1 dosis anual), vacuna dTpa/dT (triple/doble bacteriana), vacuna neumococica polisacarida 23-valente y vacuna meningocica conjugada (1 dosis).", "Vacuna contra la hepatitis B (3 dosis), vacuna neumococica polisacarida 23valente y vacuna antigripal (1 dosis).", "Vacuna antigripal (1 dosis), vacuna dTpa/dT (triple/doble bacteriana), vacuna neumococica conjugada 13-valente y vacuna meningocócica conjugada (1 dosis)", "Vacuna dTpa/dT (triple/doble bacteriana), vacuna contra el herpes zoster (virus vivo atenuado), vacuna neumococica conjugada 13 valente y vacuna meningocócica conjugada (1 dosis)"]}, {"n": 96, "q": "Ana Maria, de 42 años, antecedentes de asma de difícil control, acude a urgencias por una exacerbación asmática grave. Refiere disnea intensa, opresión torácica y dificultad para hablar en oraciones completas. En el examen físico, se observa frecuencia respiratoria de 32 respiraciones por minuto, saturación de oxígeno de 88% en aire ambiente, y sibilancias difusas en ambos campos pulmonares. La paciente también informa episodios previos de hospitalización por asma severa en los últimos años y tratamiento actual con corticoides inhalados y broncodilatadores de acción prolongada. ¿Cuál sería la PRIMERA MEDIDA DE RESCATE para estabilizar a esta paciente en guardia?", "o": ["Administrar magnesio intravenoso en combinación con terapia de oxígeno y broncodilatadores de acción larga.", "Administrar broncodilatadores inhalados de acción corta a altas dosis y añadir anticolinérgicos nebulizados", "Iniciar oxigenoterapia y administrar corticoides intravenosos", "Realizar intubación endotraqueal y ventilación mecánica"]}, {"n": 97, "q": "Una mujer de 30 años presenta fatiga, debilidad y calambres musculares desde hace semanas. Al examen físico, se observa presión arterial de 90/60 mmHg y pigmentación dizura en las palmar y encías, cos exámenes muestran hiponatremia e hiperkalemia. ¿Cuál es el diagnóstico más probable?", "o": ["Síndrome de Cushing", "Hiperaldosteronismo", "Enfermedad de Addison", "Hipotiroidismo"]}, {"n": 98, "q": "Un paciente de 45 años con antecedentes de diabetes tipo 2 consulta por dolor en la parte inferior de la pierna y dificultad para caminar. Al examen físico se observan úlceras en los pies y piel pálida y fría. ¿Cuál es el diagnóstico más probable?", "o": ["Isquemia arterial periférica", "Neuropata diabética", "Trombosis venosa profunda", "Celulitis"]}, {"n": 99, "q": "Una mujer de 28 años consulta por palpitaciones, pérdida de peso y temblores. En la exploración física presenta exoftalmos y temblor fino de manos, ¿Cuál de los siguientes exámenes de laboratorio sería el más útil para confirmar el diagnóstico?", "o": ["Nivel de glucosa en sangre", "Cortisol y ACTH", "TSH y T4 libre", "Electrocardiograma"]}, {"n": 100, "q": "¿Cuál de las siguientes condiciones causa una acidosis metabólica con unión gap elevado?", "o": ["Alcalosis respiratoria", "Cetoacidosis diabética", "Acidosis tubular renal", "Diarrea prolongada"]}]}, {"id": "febrero-2025", "name": "Febrero 2025", "year": 2025, "qs": [{"n": 1, "q": "Un hombre de 47 años consulta en la guardia por dolor abdominal de inicio súbito, localizado en el hipocondrio derecho, irradiado hacia el hombro derecho. El dolor comenzó tras la ingesta de una comida copiosa y grasosa. Refiere náuseas y vómitos biliosos. A la exploración física se encuentra ictericia leve, signo de Murphy positivo y fiebre de 38.8 °C. En los estudios de laboratorio: leucocitosis (15,000/μL), elevación de bilirrubina total (4 mg/dL con predominio directo) y aumento de fosfatasa alcalina. La ecografía abdominal muestra una vesícula biliar distendida con paredes engrosadas (>4 mm), presencia de múltiples cálculos y líquido peri vesicular. ¿Cuál es el diagnóstico más probable?", "o": ["Apendicitis aguda", "Colecistitis aguda litiásica", "Pancreatitis aguda", "Hepatitis viral"]}, {"n": 2, "q": "Un hombre de 65 años con antecedentes de cirrosis hepática secundaria a hepatitis C y consumo crónico de alcohol, consulta por hematemesis masiva y melena. Está hipotenso (90/60 mmHg), taquicárdico (120 lpm) y presenta signos de encefalopatía hepática leve. En la exploración, se detecta circulación colateral abdominal prominente. ¿Cuál es el siguiente paso en el manejo?", "o": ["Administración de vitamina K", "Realizar ligadura endoscópica de várices esofágicas", "Transfusión de plaquetas", "Administración de antibióticos"]}, {"n": 3, "q": "Un hombre de 40 años sufrió quemaduras extensas tras la explosión de un tanque de gas. Tiene quemaduras de segundo y tercer grado compromiso de la vía aérea superior (estridor, ronquera). Presenta una frecuencia respiratoria de 28 rpm, saturación de oxígeno del 88% y taquicardia. ¿Cuál es la prioridad en el manejo?", "o": ["Administración de oxígeno al 100% con máscara", "Realizar intubación orotraqueal precoz", "Administración de líquidos intravenosos", "Monitoreo cardiaco"]}, {"n": 4, "q": "Un hombre de 72 años con antecedentes de tabaquismo crónico y hipertensión arterial consulta por dolor abdominal súbito, irradiado a la región lumbar asociado a lipotimia. A la exploración, se encuentra hipotenso (80/50 mmHg), taquicárdico (110 lpm) y con abdomen distendido, pulsátil y doloroso. ¿Cuál es la acción inicial más adecuada?", "o": ["Administración de analgésicos", "Reanimación con líquidos y traslado inmediato a quirófano", "Realizar una tomografía abdominal", "Administración de antihipertensivos"]}, {"n": 5, "q": "Un joven de 28 años sufre un accidente en motocicleta, no usa casco. A su llegada está inconsciente, con una puntuación de Glasgow de 8, anisocoria (pupila derecha 6 mm no reactiva) y signos de fractura en la base del cráneo. ¿Cuál es el siguiente paso más adecuado?", "o": ["Realizar una radiografía de cráneo", "Administrar líquidos intravenosos", "Intubación orotraqueal y ventilación mecánica", "Administrar manitol"]}, {"n": 6, "q": "Un hombre de 62 años, con antecedente de infarto de miocardio hace 2 años, consulta por disnea progresiva de esfuerzo, ortopnea y edema en miembros inferiores. En el examen físico, presenta presión arterial de 100/70 mmHg, frecuencia cardiaca de 90 lpm, estertores bibasales, ingurgitación yugular de 8 cm y hepatomegalia dolorosa. El ecocardiograma muestra fracción de eyección del ventrículo izquierdo del 25% y dilatación ventricular severa. ¿Cuál sería la intervención terapéutica más adecuada?", "o": ["Digoxina", "IECA / Espironolactona", "Amiodarona", "Nitroglicerina"]}, {"n": 7, "q": "Una mujer de 50 años con diabetes tipo 2 acude con letargo, poliuria y polidipsia de varios días. En los análisis de laboratorio glucosa 70 mg/dL, osmolaridad sérica 340 mOsm/L, sodio corregido 135 mEq/L, cetonas en orina negativas, bicarbonato 24 mEq/L. ¿Cuál es el diagnóstico más probable?", "o": ["Cetoacidosis diabética", "Estado hiperosmolar hiperglucémico", "Hipoglucemia", "Diabetes insípida"]}, {"n": 8, "q": "Un hombre de 68 años con antecedente de EPOC consulta por disnea progresiva, tos productiva y fiebre. En la exploración, se auscultan sibilancias y crepitantes en ambas bases. Gasometría arterial: pH 7.32, PaCO2 5 mmHg, PaO2 55 mmHg, HCO3 30 mEq/L. ¿Cuál es el diagnóstico más probable?", "o": ["Neumonía", "Exacerbación de EPOC", "Insuficiencia cardíaca congestiva", "Tromboembolismo pulmonar 9. Una mujer de 45 años consulta por fatiga crónica, pérdida de peso, hiperpigmentación en mucosas y mareos ortostáticos. En los análisis: sodio 128 mEq/L. ¿Cuál es el diagnóstico más probable? A. Hipotiroidismo B. Insuficiencia suprarrenal C. Anemia ferropénica D. Síndrome de Cushing"]}, {"n": 10, "q": "La Afasia de Wernicke se caracteriza por:", "o": ["Habla no fluida, comprensión alterada, repetición preservada", "Habla fluida, comprensión preservada, repetición alterada", "Habla preservada, comprensión alterada, repetición alterada", "Habla no fluida, comprensión preservada, repetición preservada"]}, {"n": 11, "q": "Carolina López de 35 años consulta al servicio de emergencias por un cuadro de dolor torácico progresivo de 48 hs de evolución. Recientemente ha tenido una infección respiratoria alta. Tiene como antecedentes familiares padre hipertenso y madre con artritis reumatoide. Al examen físico TA 120/80, FC 95 lpm, FR 18 rpm, T 37,8, auscultación cardíaca: roce pericárdico presente en borde esternal izquierdo, audible en inspiración y posición inclinada hacia adelante. ECG: Depresión del segmento PR, elevación difusa del segmento ST en derivaciones I, II, V3-V6. Laboratorio: leucocitosis 12.000, PCR 15 mg/l, troponina T 12 ng/l. ¿Cuál es la mejor opción terapéutica para una pericarditis moderada?", "o": ["Antibióticos y reposo", "AINEs y reposo", "Corticoides y reposo", "Pericardiocentesis"]}, {"n": 12, "q": "Un joven de 32 años es traído a la emergencia tras un accidente vehicular de alta velocidad. Está consciente, refiere dolor abdominal intenso, especialmente en el cuadrante superior izquierdo. Presenta una frecuencia cardíaca de 130 lpm, presión arterial de 85/55 mmHg, palidez y sudoración profusa. A la exploración, hay sensibilidad y rigidez abdominal generalizada. El ECO FAST muestra líquido libre en el espacio de Morrison y el saco de Douglas. ¿Cuál es el manejo más adecuado en este caso?", "o": ["Observación y analgesia", "Exploración quirúrgica inmediata", "Administración de líquidos y transfusión", "Realización de TAC abdominal"]}, {"n": 13, "q": "Una mujer de 70 años con antecedentes de fibrilación auricular crónica no anticoagulada consulta por dolor abdominal intenso, desproporcionado a los hallazgos físicos. El dolor inició súbitamente hace 6 horas, asociado a náuseas y vómitos. A la exploración física, hay leve distensión abdominal, con ruidos intestinales disminuidos, sin irritación peritoneal evidente. En los estudios de laboratorio: leucocitosis con neutrofilia, acidosis metabólica con lactato elevado. ¿Cuál es el diagnóstico más probable?", "o": ["Obstrucción intestinal", "Isquemia mesentérica aguda", "Diverticulitis", "Colitis ulcerosa"]}, {"n": 14, "q": "Un hombre de 55 años acude con dolor intenso en la región inguinal derecha de 12 horas de evolución. Refiere náuseas y vómitos. En la exploración, hay una masa irreductible, eritematosa y extremadamente dolorosa en la región inguinal. El paciente presenta fiebre (38.5 °C) y signos de sepsis. ¿Cuál es el siguiente paso en el manejo?", "o": ["Reducción manual de la hernia", "Solicitar tomografía computarizada antes de cirugía", "Administración de antibióticos y observación", "Cirugía de emergencia"]}, {"n": 15, "q": "Una mujer de 60 años con antecedente de cirugía abdominal previa consulta por vómitos fecaloides, dolor abdominal difuso y ausencia de evacuaciones desde hace 48 horas. En la exploración, el abdomen está distendido, doloroso a la palpación, con ruidos peristálticos metálicos. ¿Cuál es el manejo inicial más adecuado?", "o": ["Administración de laxantes", "Realizar ecografía de abdomen", "Enema evacuante", "Radiografía de abdomen"]}, {"n": 16, "q": "Una mujer de 50 años con inmovilización prolongada por cirugía ortopédica consulta por edema, eritema y dolor en la pierna derecha. En la exploración, hay aumento de la circunferencia de la pantorrilla, signo de Homans positivo. ¿Cuál es el estudio diagnóstico de elección?", "o": ["Radiografía de pierna", "Ecografía Doppler", "Angiografía por tomografía computarizada", "Resonancia magnética"]}, {"n": 17, "q": "Una mujer de 28 años consulta por fatiga, artralgias, fiebre y una erupción eritematosa en las mejillas que respeta el surco nasogeniano. Tiene antecedentes de abortos recurrentes en el primer trimestre. En los análisis: Hb 10.4 g/dL, leucocitos 3,000/μL, plaquetas 90,000/μL. ANA: 1:320 positivo; anti-dsDNA: positivo; complemento C3 y C4: disminuidos. ¿Qué complicación es más probable en esta paciente?", "o": ["Anemia hemolítica", "Trombocitopenia", "Nefritis lúpica", "Pericarditis"]}, {"n": 18, "q": "Un hombre de 43 años con antecedente de consumo de drogas intravenosas acude con fiebre persistente de 2 semanas. En el examen, presenta soplo holosistólico en el foco tricúspideo, lesiones de Janeway en las palmas y esplenomegalia. Hemocultivos: positivos para Staphylococcus aureus. ¿Cuál es el diagnóstico más probable?", "o": ["Endocarditis infecciosa izquierda", "Endocarditis infecciosa derecha", "Miocarditis", "Pericarditis"]}, {"n": 19, "q": "Un hombre de 56 años con antecedente de carcinoma pulmonar de células pequeñas acude con confusión, debilidad generalizada y náuseas. En los análisis: sodio 118 mEq/L, osmolaridad sérica 20 mOsm/kg, osmolaridad urinaria 500 mOsm/kg. ¿Cuál es el diagnóstico más probable?", "o": ["Metástasis cerebrales", "Síndrome de secreción inadecuada de hormona antidiurética (SIHAD)", "Hipercalcemia", "Síndrome de vena cava superior"]}, {"n": 20, "q": "Un hombre de 38 años consulta por equimosis generalizadas, epistaxis recurrente y hematuria. No tiene antecedentes relevantes. En los análisis: plaquetas 8,000. Hb 13 g/dL, leucocitos 7,500/μL. Frotis de sangre periférica sin esquistocitos. Coagulación: INR 1.0, TTPa normal. ¿Cuál es el diagnóstico más probable?", "o": ["Hemofilia", "Púrpura trombocitopénica idiopática (PTI)", "Leucemia", "Coagulación intravascular diseminada (CID)"]}, {"n": 21, "q": "La dapagliflozina está indicada para las siguientes patologías excepto una:", "o": ["Diabetes mellitus tipo 2", "Insuficiencia cardíaca", "Enfermedad renal crónica", "Diabetes insípida"]}, {"n": 22, "q": "El queratocono es una enfermedad ocular progresiva que adelgaza y deforma la córnea en forma de cono. ¿A cuál de las siguientes patologías se asocia más frecuentemente?", "o": ["Glaucoma", "Síndrome de Sjögren", "Cataratas", "Retinopatia diabética"]}, {"n": 23, "q": "Paciente masculino de 40 años que consulta por lesiones cutáneas de larga data desde la infancia. Refiere que las mismas han cambiado de localización y que ahora afectan cualquier parte de la superficie cutánea, en especial las superficies extensoras. Se acompañan de prurito intenso y descamación severa. En los últimos meses notó la aparición de dolor articular principalmente en ambas manos. Usted piensa en artritis psoriásica. ¿Cuál de los siguientes esquemas terapéuticos es el indicado para iniciar el tratamiento de este paciente?", "o": ["Metotrexato", "Adalimumab", "Prednisona", "Hidroxicloroquina"]}, {"n": 24, "q": "Llega a la guardia Andrés de 65 años consultando por dolor precordial opresivo de 4 horas de evolución que se irradia a la espalda, acompañado de mareos y sudoración. No hace referencia a ningún episodio similar a este, aunque refiere hipertensión arterial sin control. No presentó disnea, ortopnea y disnea paroxística nocturna. Al momento de la consulta se encuentra ansioso e inquieto, tensión arterial 100/cc mmHg, frecuencia cardíaca 60 latidos por minuto y saturación de oxígeno del 96%. La auscultación pulmonar es normal. El electrocardiograma (ECG) presenta ritmo sinusal a 100 l/min, PR 188 mseg, supradesnivel del segmento ST en las derivaciones DI, AVL y de V1 a V6 de hasta 5 mm. ¿Cuál es el tratamiento de inicio más adecuado?", "o": ["Nitroglicerina sublingual", "Angioplastia percutanea primaria", "Trombólisis", "Observación y analgesia"]}, {"n": 25, "q": "Una paciente de 24 años, G1A1, cursando embarazo de S semanas consulta por presentar cefalea y vómitos de 72 h de evolución. Al examen se constata piel y mucosas deshidratadas TA 100/55 mmHg, FC 120 por minuto. Temperatura axilar 36.4 ºC. Tacto vaginal canal cervical permeable, fondo uterino a nivel de línea umbilical, anexos aumentados de tamaño y metrorragia escasa. ¿Cuál es el diagnostico más probable?", "o": ["Hiperémesis gravídica", "Embarazo molar", "Amenaza de aborto", "Embarazo ectópico"]}, {"n": 26, "q": "Una paciente embarazada de 3c semanas de gestación es admitida a la sala de emergencia con un cuadro de shock con una tensión arterial de 80/40, con pulso materno de 120 sin sangrado vaginal y útero con tono aumentado. ¿Cuál es el diagnostico más probable?", "o": ["Rotura uterina", "Desprendimiento de la placenta normoinserta", "Placenta previa", "Embarazo ectópico roto"]}, {"n": 27, "q": "Concurre al Centro de salud una paciente de 20 años porque hace 12 horas refiere la rotura del preservativo durante la relación sexual con su pareja. Como antecedente de relevancia es tabaquista de 15 cigarrillos por día y sufre de migrañas realizando tratamiento preventivo con propanolol. No utiliza otro método anticonceptivo. No tiene deseos de maternidad por el momento. Una amiga le recomendó que tomara la \"píldora del día después. ¿Cuál es la conducta más adecuada en este momento?", "o": ["Indicar anticonceptivos orales combinados", "Indicar levonorgestrel 1.5 mg en única dosis", "Indicar DIU de emergencia", "No indicar nada y tranquilizar a la paciente"]}, {"n": 28, "q": "Una mujer presenta hemorragia intensa inmediatamente después del parto ¿Cuál es la causa más común de este tipo de hemorragia postparto?", "o": ["Desgarro del canal del parto", "Retención de restos placentarios", "Atonía uterina", "Coagulopatías"]}, {"n": 29, "q": "En un paciente con insuficiencia cardiaca, ¿cuál de los siguientes medicamentos se considera un inhibidor de la neprilisina?", "o": ["Enalapril", "Sacubitrilo", "Espironolactona", "Furosemida"]}, {"n": 30, "q": "En un ensayo clínico aleatorizado, controlado y con diseño doble-ciego se han administrado dosis crecientes de 10 mg. 20 mg, 50 mg y 100 mg de un nuevo fármaco en un total de 60 pacientes (15 pacientes por cada grupo de dosis), con el fin de establecer la relación entre eficacia y toxicidad del nuevo fármaco. Además, se ha incluido un grupo control con 15 pacientes. Señale la respuesta correcta:", "o": ["Se trata de un estudio fase I → seguridad y farmacocinética", "Se trata de un estudio fase IIA → empieza evaluar la eficacia para indicación farmacéutica, fase 2ª se centra en establecer dosis y la eficacia preliminar", "Se trata de un estudio fase IIB → establece dosis optima y evalúa la eficacia en población más amplia", "Se trata de un estudio fase III→ evaluar eficacia y seguridad en población aún más grande, comparando a un tto estándar o placebo"]}, {"n": 31, "q": "Una paciente de 4 años concurre a control ginecológico. Como antecedentes heredofamiliares refiere que la madre falleció a los 60 años con diagnóstico de cáncer de mama. Al examen físico, presenta formación nodular en cuadrante superoexterno de mama derecha, de bordes bien definidos, móvil, no adherido a planos profundos ni superficiales, de 2 x 2 cm aproximadamente. Axilas impresionan libres. Aporta una mamografía de hace un mes que informa BIRADS 0. ¿Cuál es la conducta más adecuada?", "o": ["Biopsia excisional", "Ecografía mamaria", "Resonancia magnética mamaria", "Repetir la mamografía"]}, {"n": 32, "q": "Una paciente de 34 años, G3P2, cursa embarazo de 37 semanas. Consulta a la guardia por pérdida de líquido por genitales externos de 2 horas de evolución. Al examen, lúcida, TA 110/60 mmHg, FC 84 por minuto, temperatura axilar 36,4°C. Dinámica uterina aislada, tono uterino normal, movimientos fetales positivos, FCF 140 por minuto. Tacto vaginal: cuello posterior, formado, permeable al dedo, presentación pelviana, líquido amniótico claro. ¿Cuál es la conducta más adecuada?", "o": ["Inducción del trabajo de parto", "Cesárea abdominal", "Observación y maduración pulmonar fetal", "Amniocentesis"]}, {"n": 33, "q": "¿Cuál es la conducta más adecuada con una mujer de 19 años, nulípara, que cursa 33 semanas de gestación, que durante el control gestacional se constata TA 150/100 mmHg, y el valor se repite 30 minutos después? No ha presentado ginecorragia ni rotura de membranas. Durante la evaluación tiene tono uterino normal, dinámica uterina negativa, frecuencia cardiaca fetal 145 latidos por minuto, con movimientos fetales presentes y en el tacto vaginal tiene un cuello cerrado posterior, no acortado. Los exámenes de laboratorio solicitados son normales.", "o": ["Manejo ambulatorio con control en 24 horas", "Internación, alfametildopa vía oral, maduración pulmonar fetal y control", "Interrupción del embarazo", "Administración de nifedipina sublingual"]}, {"n": 34, "q": "Mujer 32 años que presenta sensación de hormigueo en ambos miembros inferiores, entumecimiento y dificultad para caminar de 48hs de evolución. Refiere episodio hace 2 semanas tuvo un episodio de diarrea que se autolimitó. ¿En qué diagnóstico pensaría?", "o": ["Esclerosis múltiple", "Síndrome de Guillain-Barré", "Mielitis transversa", "Neuropatía diabética"]}, {"n": 35, "q": "Usted realiza el seguimiento en salud de Ramiro que tiene 11 años recién cumplidos. En la consulta actual recoge los siguientes datos: Peso: 55 kg (Puntaje Z: 0 DS) Talla: 141 cm (Puntaje Z: +2.56 DS) IMC: 27. cc (Puntaje Z: +2 DS +3 DS) ¿A cuál de las siguientes categorías considera que pertenece el paciente?", "o": ["Sobrepeso", "Obesidad", "Talla alta para la edad", "Riesgo de sobrepeso"]}, {"n": 36, "q": "Usted se encuentra atendiendo en un consultorio cuando recibe a Celeste de 4 meses que es traída por sus padres quienes les cuenta lo siguiente: “Hola doc, estamos preocupados porque vemos que Celeste vomita cada vez que toma el pecho. No nos parece que le moleste mucho porque no le duele, pero no sé porque vomita. ¿Puede tener reflujo? Ella solo toma teta” Usted evalúa y nota que tiene buen progreso de peso. ¿Cuál de las siguientes sería su conducta?", "o": ["Solicitar una serie esófago-gastro- duodenal.", "Indicar tratamiento con inhibidores de la bomba de protones.", "Solicitar estudios para descartar alergia a la proteína de leche de vaca.", "No solicitar estudios complementarios."]}, {"n": 37, "q": "Usted atiende a Jonás de 7 meses de edad que es traído a la consulta para un control de salud. Desde el mes de vida que no le realizaron controles. Al examen físico usted nota una asimetría en los pliegues glúteos y leve limitación de la abducción en miembro inferior derecho. ¿Cuál de las siguientes sería su conducta?", "o": ["Tranquilizar a los padres y controlar en la próxima consulta.", "Indicar ejercicios de abducción en el hogar.", "Solicitar radiografía de pelvis.", "Solicitar ecografía de ambas caderas."]}, {"n": 38, "q": "Marina, de 15 días de vida, es traída por su madre para realizar el primer control en salud. El embarazo fue controlado, sin complicaciones. Nació de 39 semanas con un peso de 3400 gr. Alta conjunta a las 48 horas y se alimenta con lactancia materna en forma exclusiva. Al examen físico usted obtiene la siguiente información: T. 36 °C, FC 145 x min, FR 50 x min. Observa tiraje subcostal y escucha buena entrada de aire bilateral con un soplo sistólico y pulsos periféricos presentes. SatO2 FiO2 0.21 96% en 4 miembros. Ante su consulta la madre le refiere lo siguiente: “cuando toma el pecho se cansa y transpira un poco, pero no tose. Me parece que es por el calor”. El peso actual es de 3200 gr. Ante este escenario clínico ¿Cuál es su conducta prioritaria?", "o": ["Indicar control ambulatorio en 72 horas.", "Explicar a la madre que son signos normales de adaptación.", "Solicitar evaluación por guardia y eventual internación.", "Solicitar radiografía de tórax para descartar patología pulmonar."]}, {"n": 39, "q": "Usted se encuentra atendiendo en la guardia de un hospital cuando recibe a Juana de 13 años que le relata lo siguiente: \"¡Hola! Vengo porque estoy con un dolor de cabeza que no puedo más, ya me tomé paracetamol y no me hizo efecto. Hace 2 días que vengo así y ya me molesta la luz. Ya tuve otras veces, pero se me pasaba con el remedio. Encima ayer tuve fiebre\". ¿Cuál es su conducta inicial?", "o": ["Tranquilizar a la paciente y enviarla a su casa con analgésicos más potentes.", "Indicar estudios de neuroimagen de forma ambulatoria.", "Indicar internación para manejo analgésico y reevaluar.", "Solicitar interconsulta con oftalmología por la molestia con la luz."]}, {"n": 40, "q": "Usted asiste a Thiago de 3 años que se encuentra internado por un cuadro de broncoespasmo e hipoxemia. Al examen físico nota que el paciente presenta talla y peso bajos para la edad. De la entrevista a la madre surge que el niño presenta episodios de broncoespasmos recurrentes y también de diarrea frecuentes con muy mal olor. Ya había consultado en diversas oportunidades por esto y las asumieron como cuadros de origen viral. De acuerdo con estos datos, ¿qué hipótesis diagnóstica podría explicar el cuadro de Thiago?", "o": ["Asma infantil de difícil control.", "Reflujo gastroesofágico severo con aspiraciones.", "Fibrosis quística del páncreas", "Inmunodeficiencia primaria."]}, {"n": 41, "q": "Usted se encuentra atendiendo en el consultorio de un hospital público cuando recibe a Martín de 5 años que es traído por su madre para control de salud. De sus antecedentes de vacunación usted nota que no presenta cicatriz de BCG y aunque se encuentra registrada en el carnet. De acuerdo con la información obtenida ¿Qué recomendación le haría a la madre?", "o": ["Revacunar inmediatamente con BCG.", "Solicitar una prueba de tuberculina (PPD) para evaluar la necesidad de vacunación.", "No tomar ninguna conducta.", "Explicar a la madre que la vacuna no siempre deja cicatriz y considerar la vacunación completa."]}, {"n": 42, "q": "Usted se encuentra atendiendo en la guardia de un hospital general cuando llega Martina de 3 años que es traída por su madre con el siguiente relato: “Hola, traigo a Martina porque está con fiebre hace 2 días, tuvo vómitos, pero solo al inicio. Ahora se queja de dolor de cabeza”. ¿Cuál de los siguientes datos categoriza como prioritario?", "o": ["La duración de la fiebre (2 días).", "La presencia de vómitos autolimitados.", "La inmunosupresión (si estuviera presente en la historia clínica).", "La queja de dolor de cabeza."]}, {"n": 43, "q": "Usted se encuentra atendiendo en un centro de atención comunitaria y recibe a Lucas de 4 años que es traído por su madre por presentar vómitos y diarrea de 48 hs de evolución. Le cuenta que al inicio del cuadro presentó fiebre y actualmente presenta un intenso dolor tipo retortijón. Al examen físico se encuentra vigil y reactivo, afebril, el abdomen es blando pero doloroso a la palpación profunda. ¿Cuál sería su conducta inicial?", "o": ["Indicar hidratación oral y control en 24 horas.", "Solicitar análisis de materia fecal para descartar infección bacteriana.", "Evaluar mucosas, nistagmo, signos vitales.", "Administrar analgésicos y antiespasmódicos."]}, {"n": 44, "q": "Está realizando la recorrida en la sala de internación donde se encuentran los recién nacidos junto con sus madres. En esta ocasión evalúa a Zoe que tiene 3hs de vida quien presenta un peso actual de 3050 gramos para un peso de nacimiento de 3200 gr. Se encuentra despierta, rosada, tuvo 4 deposiciones desde que nació. La madre le refiere que se prende bien al pecho, pero se siente algo cansada. ¿Cuál sería su conducta prioritaria?", "o": ["Indicar suplementación con fórmula láctea.", "Solicitar control de glucemia capilar.", "Evaluar la técnica de lactancia materna.", "Indicar continuar con lactancia materna exclusiva."]}, {"n": 45, "q": "¿Qué tipo de epitelio reviste la tráquea?", "o": ["Epitelio plano simple", "Epitelio cúbico simple", "Epitelio pseudoestratificado ciliado con células caliciformes", "Epitelio de transición"]}, {"n": 46, "q": "¿Cuál es la característica microscópica principal de un tejido en fase de inflamación crónica?", "o": ["Predominio de neutrófilos", "Infiltrado de linfocitos y macrófagos", "Abundancia de tejido de granulación", "Presencia de eosinófilos"]}, {"n": 47, "q": "En la biopsia de un paciente con enfermedad celíaca, ¿qué hallazgo histológico es característico en el intestino delgado?", "o": ["Aumento de las células caliciformes", "Presencia de granulomas", "Hiperplasia de las criptas y atrofia de las vellosidades", "Depósito de amiloide"]}, {"n": 48, "q": "Un paciente presenta adenopatía cervical única, indolora y de crecimiento progresivo. En la biopsia se observan células de Reed-Sternberg. ¿Cuál es el diagnóstico más probable?", "o": ["Linfoma de Hodgkin", "Linfoma no Hodgkin", "Carcinoma metastásico", "Tuberculosis ganglionar"]}, {"n": 49, "q": "Un neonato de 3 días presenta ictericia progresiva, coluria y acolia. La prueba de Coombs es negativa y la bilirrubina directa está elevada. ¿Cuál es la causa más probable?", "o": ["Enfermedad hemolítica", "Obstrucción de las vías biliares", "Ictericia fisiológica exacerbada", "Síndrome de Crigler-Najjar tipo I"]}, {"n": 50, "q": "¿Cuál de los siguientes fármacos inhibe irreversiblemente la enzima ciclooxigenasa1 (COX-1)?", "o": ["Ácido acetilsalicílico", "Ibuprofeno", "Celecoxib", "Paracetamol"]}, {"n": 51, "q": "Un paciente con fibrilación auricular es tratado con amiodarona. Seis meses después consulta por fatiga, intolerancia al frío y bradicardia. ¿Cuál es el mecanismo fisiopatológico responsable?", "o": ["Aumento de la recaptación de T3 y T4", "Alteración de la síntesis de hormonas tiroideas por el yodo contenido en la amiodarona", "Bloqueo de los receptores de TSH", "Disminución de la conversión periférica de T4 a T3"]}, {"n": 52, "q": "Un paciente consulta tras haber ingerido accidentalmente 10 gramos de paracetamol hace c horas. ¿Cuál es la mejor conducta para seguir?", "o": ["Inducir el vómito con jarabe de ipecacuana", "Solicitar niveles plasmáticos de paracetamol y administrar N- acetilcisteína si están elevados", "Administrar carbón activado", "Realizar lavado gástrico"]}, {"n": 53, "q": "Un agricultor de 45 años es hallado inconsciente en un invernadero. En la evaluación inicial se detecta bradicardia, miosis y sialorrea. ¿Cuál es el antídoto específico para su condición?", "o": ["Atropina", "Naloxona", "Flumazenil", "Pralidoxima"]}, {"n": 54, "q": "Un paciente de 32 años es traído a la guardia con diaforesis, hipertensión y midriasis bilateral tras ingerir una sustancia desconocida. Presenta hiperreflexia y clonus. ¿Cuál de los siguientes es el tratamiento de elección?", "o": ["Carbon activado", "Naloxona", "Diazepam", "Fisiostigmina"]}, {"n": 55, "q": "Un paciente de 60 años con antecedentes de hipertensión arterial consulta por fatiga y debilidad muscular. En el laboratorio se destaca hipopotasemia y alcalosis metabólica. ¿Cuál es el diagnóstico más probable?", "o": ["Hiperaldosteronismo primaria", "Estenosis de la arteria renal", "Síndrome de Cushing", "Feocromocitoma"]}, {"n": 56, "q": "Un paciente con cirrosis hepática presenta deterioro del sensorio y asterixis. Se realiza una punción lumbar con hallazgo de líquido claro, celularidad mononuclear y proteínas normales. ¿Cuál es la etiología más probable?", "o": ["Encefalopatia hepática", "Meningitis viral", "Encefalitis herpética", "Metástasis meníngeas"]}, {"n": 57, "q": "Paciente con EPOC GOLD III que presenta exacerbaciones frecuentes a pesar de tratamiento con LABA/LAMA. ¿Qué fármaco es el siguiente paso en la estrategia terapéutica?", "o": ["Aumentar la dosis de LABA/LAMA", "Agregar corticoide inhalado", "Agregar teofilina", "Considerar oxigenoterapia domiciliaria"]}, {"n": 58, "q": "Una mujer embarazada con diagnóstico confirmado de sífilis primaria mediante VDRL positivo. ¿Cuál es el tratamiento más adecuado?", "o": ["Penicilina G benzatina intramuscular", "Doxiciclina oral", "Azitromicina oral", "Ceftriaxona intramuscular"]}, {"n": 59, "q": "Un hombre joven acude por fiebre prolongada, sudoración nocturna y pérdida de peso. En la radiografía se observan adenopatías hiliares bilaterales. El Mantoux es positivo (15 mm). ¿Cuál prueba confirmaría tuberculosis activa?", "o": ["Serología para tuberculosis", "Biopsia ganglionar", "Cultivo para Mycobacteriun tuberculosis en esputo", "PCR para Mycobacteriun tuberculosis en sangre"]}, {"n": 60, "q": "Un hombre de 27 años acude a consulta por presentar lesiones en la piel desde hace dos semanas. Refiere una erupción no pruriginosa en el tronco, palmas y plantas, además de fiebre y malestar general. Niega antecedentes médicos de importancia. En la exploración física, se observa una erupción maculopapular generalizada, incluyendo las palmas y plantas, junto con adenopatías cervicales y axilares bilaterales no dolorosas. Se realiza una prueba de detección de sífilis, obteniendo VDRL 1:c4 y FTA-Abs positivo. Se realiza tratamiento con Penicilina Benzatina 2.400.000 UI en dosis única. ¿Qué prueba serológica se utiliza para seguimiento del tratamiento?", "o": ["FTA-Abs", "Prueba de Treponema pallidum por hemoaglutinación (TPHA)", "VDRL o RPR", "Western BLOT para sífilis"]}, {"n": 61, "q": "Un hombre de 55 años presenta dolor de pecho de inicio súbito con irradiación al miembro superior izquierdo. El ECG muestra elevación del segmento ST en DII, DIII y aVF. ¿Cuál es el diagnóstico más probable?", "o": ["Infarto de cara inferior de miocardio", "Angina inestable", "Pericarditis aguda", "Embolia pulmonar"]}, {"n": 62, "q": "Una mujer de 30 años con diagnóstico de lupus eritematoso sistémico acude a la consulta por cansancio extremo, hinchazón en las piernas y orina con apariencia espumosa. En el examen físico, se observa hipertensión arterial y edema en los tobillos. ¿Cuál de los siguientes hallazgos en la analítica de orina sería más sugestivo de nefritis lúpica?", "o": ["Hematuria y proteinuria", "Glucosuria", "Cetonuria", "Cilindros hialinos"]}, {"n": 63, "q": "Una mujer de 42 años acude a la consulta con quejas de fatiga, fiebre, pérdida de peso y una erupción malar en la cara. También refiere dolor en varias articulaciones y ha notado úlceras indoloras en la boca. En los análisis de laboratorio, se encuentra un título positivo de anticuerpos antinucleares (ANA) y anti-dsDNA. ¿Cuál de los siguientes criterios diagnósticos se cumplen para clasificarla como lupus eritematoso sistémico según los criterios EULAR/ACR (European League Against Rheumatism/American College of Rheumatology)?", "o": ["Presencia de erupción malar y artritis.", "Título positivo de ANA y anti-dsDNA.", "Al menos 4 criterios clínicos o 1 inmunológico.", "Cumplimiento de todos los criterios clínicos mayores."]}, {"n": 64, "q": "Un hombre alcohólico crónico acude a urgencias con confusión, ataxia y oftalmoplejía horizontal bilateral. ¿Cuál es el tratamiento inicial más importante?", "o": ["Naloxona intravenosa", "Tiamina (Vitamina B1) intravenosa", "Glucosa intravenosa", "Flumazenil intravenoso"]}, {"n": 65, "q": "Paciente de 56 años quien consulta por cuadro clínico de 1 mes de evolución consistente en astenia, polineuropatía, pérdida del sabor de los alimentos, deposiciones diarreicas y mareos. Al examen físico se encuentra una macrocitosis, glositis y leve ictericia conjuntival. Se solicitan marcadores tumorales primarios que resultan negativos. Se toman diferentes exámenes entre ellos un hemograma con HTO 30, Hb S, VCM > 100. Se observan macroovalocitos y neutrófilos hipersegmentados. Reticulocitos disminuidos (1%). Bilirrubina total y LDH levemente elevadas. ¿Qué estudio debería Ud. Pedir a este paciente para continuar con su estudio?", "o": ["Serología para virus de inmunodeficiencia humana (VIH)", "Punción lumbar", "Dosaje de vitamina B12 y ácido fólico", "Colonoscopia"]}, {"n": 66, "q": "Una mujer de 45 años consulta por dolor de pecho de aparición repentina que irradia al dorso, sin otros síntomas acompañantes. Tiene antecedentes de HTA y tiene ceguera parcial por subluxación del cristalino. La causa más probable es:", "o": ["Disección aórtica", "Infarto agudo de miocardio", "Embolia pulmonar", "Pericarditis aguda"]}, {"n": 67, "q": "El cáncer de tiroides con peor pronóstico es:", "o": ["Papilar", "Folicular", "Medular", "Anaplásico"]}, {"n": 68, "q": "¿Las nebulizaciones con salbutamol son usadas de manejo de cuál de estas enfermedades respiratorias?", "o": ["Neumonía", "Asma", "Tuberculosis", "Hiperkalemia"]}, {"n": 69, "q": "Un hombre de 20 años que presenta cuadro de una semana de evolución caracterizado por fiebre, mucho dolor muscular, agrega ictericia, náuseas y vómitos. Refiere antecedente de practicar canotaje recreativo luego de una larga natación en aguas abiertas. ¿Cuál de sus diagnósticos es más probable?", "o": ["Leptospirosis", "Hepatitis viral aguda", "Fiebre tifoidea", "Malaria"]}, {"n": 70, "q": "Un paciente de 65 años con insuficiencia cardíaca con fracción de eyección reducida (HFrEF) clase funcional III de la NYHA está recibiendo tratamiento médico óptimo. En el examen físico presenta ingurgitación yugular y estertores bibasales. ¿Cuál es el tratamiento apropiado para reducir la mortalidad en este paciente?", "o": ["Aumentar la dosis de diuréticos de asa", "Agregar digoxina", "Espironolactona", "Considerar trasplante cardíaco"]}, {"n": 71, "q": "Un hombre de 75 años acude a la consulta por disnea progresiva durante los últimos 2 meses. Tiene antecedentes de diabetes mellitus tipo 2 diagnosticada hace 10 años, hipertensión arterial mal controlada y obesidad. En el electrocardiograma se observa bloqueo AV de primer grado. ¿Cuál es el fármaco más adecuado que puede ofrecer beneficios en la insuficiencia cardíaca y en el control metabólico?", "o": ["Inhibidores de la enzima convertidora de angiotensina (IECA)", "Betabloqueantes", "Antagonistas del receptor de mineralocorticoides (ARM)", "Inhibidores del cotransportador de sodio-glucosa tipo 2 (iSGLT2)"]}, {"n": 72, "q": "Según la guía ADA 2024 de diabetes, el paciente con estadio Prediabetes ¿Debe iniciar tratamiento con metformina cuando cumple con los siguientes criterios?", "o": ["Glucosa en ayunas entre 100-125 mg/dL y HbA1c entre 5.7-6.4%.", "Solo si presenta síntomas de hiperglucemia.", "HbA1c ≥ 6.5%, glucosa en ayunas ≥ 126 mg/dL o glucosa postprandial ≥ 200 mg/dL", "Considerar metformina en pacientes con IMC ≥ 35 kg/m², edad < 60 años y mujeres con historia de diabetes gestacional"]}, {"n": 73, "q": "Una mujer de 42 años presenta múltiples lesiones purpúricas distribuidas en la mucosa oral y tronco. Tres semanas antes presentó un episodio de infección respiratoria para la cual recibió tratamiento con éxito parcial. También se observan telangiectasias periungueales. Tras consigo una imagen abdominal que informa múltiples lesiones tipo hemangioma en hígado. ¿Cuál es el diagnóstico del paciente?", "o": ["Púrpura trombocitopénica idiopática (PTI)", "Síndrome de Rendu – Osler – Weber (telangiectasia hemorrágica hereditaria – THH)", "Vasculitis sistémica", "Crioglobulinemia mixta"]}, {"n": 74, "q": "Viene a la consulta un paciente de 33 años por gonalgia unilateral asociada a rigidez en reposo, que mejora con la actividad física de más de dos meses de evolución. También refiere dolor lumbar infamatorio que alterna de lado. A la exploración directa presenta queratodermia blenorrágica en palmas y plantas asociada a onicodistrofia. Relata que ha tenido episodios de conjuntivitis que comenzaron antes del dolor articular y niega haber padecido un episodio de gastroenterocolitis. ¿Cuál es el diagnóstico del paciente?", "o": ["Artritis reumatoide", "Espondilitis anquilosante", "Artritis psoriásica", "Artritis reactiva"]}, {"n": 75, "q": "Teniendo en cuenta las recomendaciones de la American Diabetes Association 2024 en un paciente con diabetes mellitus tipo 2 ¿Cuál de las siguientes afirmaciones es INCORRECTA?", "o": ["El control glucémico debe ser individualizado.", "La metformina sigue siendo el fármaco de primera línea en la mayoría de los pacientes.", "Los iSGLT2 y los análogos del GLP-1 tienen beneficios cardiovasculares y renales demostrados.", "Un HbA1c menor a 8% siempre indica un control glucémico adecuado. →<7%"]}, {"n": 76, "q": "Un hombre de 62 años consulta por la aparición de una masa indolora en la región umbilical que ha crecido progresivamente durante los últimos tres meses. Refiere pérdida de peso no intencionada, fatiga y dolor abdominal leve. Luego agrega que la masa se ha vuelto más firme, de aproximadamente 5 cm, localizada en el ombligo, con superficie irregular y adherencia a planos profundos. ¿Cuál es el diagnóstico más probable?", "o": ["Lipoma", "Hernia umbilical incarcerada", "Nódulo de la hermana María José", "Absceso de pared Abdominal"]}, {"n": 77, "q": "Paciente de 68 años consulta a la guardia por presentar tenesmo rectal, diarrea sanguinolenta y dolor rectal de moderada intensidad. Refiere que los síntomas comenzaron hace aproximadamente dos semanas. En sus antecedentes médicos menciona una hemorroide interna de larga data que ha sangrado en el pasado, recibiendo radioterapia desde hace un mes. En el examen físico, el abdomen está blando, depresible y no doloroso. Al tacto rectal revela sensibilidad rectal difusa, presencia de sangre fresca, y se palpa una neoformación que ocupa casi toda la frialdad de la mucosa y pequeñas ulceraciones. La región rectal distal, sin hallazgos significativos en el resto del colon. ¿Cuál es el diagnóstico más probable?", "o": ["Enfermedad inflamatoria intestinal (colitis ulcerosa)", "Infección por Clostridioides difficile", "Proctitis por irradiación", "Cáncer de recto"]}, {"n": 78, "q": "Josefa de 58 años acude a la consulta por diabetes mellitus tipo 2 de 15 años de evolución. Se encuentra en tratamiento con metformina 850 mg cada 12 horas e insulina glargina 20 UI/día al acostar. A pesar del tratamiento, refiere cifras de glucosa capilar persistentes entre 180-220 mg/dL en ayunas y postprandiales de hasta 250 mg/dL. En los últimos 6 meses ha presentado aumento de peso (4 kg) y refiere fatiga persistente. Niega hipoglucemias. Es hipertensa para la cual utiliza enalapril 10mg/día sin buen control de las cifras tensionales. Tiene una IMC de 32. Los análisis recientes HbA1c 8.7%, creatinina 0.9 mg/dL, perfil lipídico: colesterol total 215 mg/dL, LDL 130 mg/dL, HDL 40 mg/dL, triglicéridos 160 mg/dL. ¿Cuál es la mejor estrategia para optimizar el tratamiento de esta paciente?", "o": ["Aumentar la dosis de insulina glargina", "Iniciar insulina prandial.", "Incluir liraglutida y empagliflozina.", "Cambiar a insulina Premezclada"]}, {"n": 79, "q": "Una adolescente de 16 años acude a la consulta por presentar episodios recurrentes de debilidad muscular, calambres y sensación de hormigueo en las extremidades. Refiere también pérdida progresiva de peso, diarrea intermitente y cansancio extremo durante los últimos c meses. Menciona haber tenido episodios de lesiones blanquecinas en la boca desde la infancia. Su hermano mayor tiene enfermedad de Addison. Al examen físico se observa hiperpigmentación en áreas expuestas al sol y lengua. Trae analítica reciente que muestra: calcio sérico 6.8 mg/dL, fósforo sérico 2.1 mg/dL, PTH indetectable, sodio sérico 128 mEq, potasio sérico 5,8 mEq, cortisol sérico 2,1 microgramos, ACTH elevada. ¿Cuál es el diagnóstico más probable?", "o": ["Enfermedad de Addison primaria.", "Sme poliglandular autoinmune tipo 1", "Enfermedad celíaca con deficiencias secundarias.", "Síndrome de Cushing.", "Hipertiroidismo primario."]}, {"n": 80, "q": "Roberto de 74 años consulta por un cuadro de anemia crónica, SOMF +, para la cual decidió practicar una videocolonoscopia diagnóstica. Roberto se encuentra en tto con clopidogrel ¿Cuándo se debe suspender el antiagregante antes del procedimiento?", "o": ["24 horas antes del procedimiento.", "12 horas antes del procedimiento.", "No debe suspender el antiagregante.", "48 horas antes del procedimiento."]}, {"n": 81, "q": "Silvina de 42 años viene a la consulta por un cuadro de disuria asociado a tenesmo vesical. Refiere que no es la primera vez que le pasa. Se realizó sedimento urinario que resultó con nitritos positivos y leucocitos 20-30 por campo, GR 5-7. Usted Sospecha una cistitis aguda, decide iniciar tratamiento con fluoroquinolonas. ¿Cuánto tiempo debe durar el tratamiento?", "o": ["1 día (dosis única).", "3 días.", "7 días.", "10 días. Pregunta 82: Ud. Recibe en su consultorio un paciente para control de HTA, DBT2 e insuficiencia cardíaca en tratamiento con metoprolol entre otros fármacos. ¿Cuál es la dosis máxima de este fármaco? A. 50 mg/día B. 100 mg/día C. 200 mg/día D. 400 mg/día"]}, {"n": 83, "q": "¿Cuál de los siguientes fármacos no pertenece al grupo de antiarrítmicos Clase II (=betabloquead
