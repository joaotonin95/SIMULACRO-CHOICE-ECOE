el tratamiento de primera línea para la hiperbilirrubinemia neonatal severa?", "o": ["Fototerapia", "Exanguinotransfusión", "Inmunoglobulina intravenosa", "Fenobarbital"]}, {"n": 152, "q": "¿Cuál de los siguientes es un factor de riesgo para el desarrollo del síndrome de muerte súbita del lactante (SMSL)?", "o": ["Dormir boca arriba", "Lactancia materna", "Dormir en la misma habitación que los padres", "Exposición al humo de tabaco"]}, {"n": 153, "q": "¿Cuál de los siguientes es el método de diagnóstico de primera línea para la neumonía en niños?", "o": ["Radiografía de tórax", "Cultivo de esputo", "Gasometría arterial", "Tomografía computarizada de tórax"]}, {"n": 154, "q": "¿Cuál de los siguientes es un hallazgo característico del crup viral en niños?", "o": ["Tos productiva", "Estridor inspiratorio", "Sibilancias", "Dolor de garganta intenso"]}, {"n": 155, "q": "¿Cuál de los siguientes es el tratamiento de primera línea para la bronquiolitis en lactantes?", "o": ["Antibióticos", "Broncodilatadores", "Oxígeno suplementario", "Corticoides"]}, {"n": 156, "q": "¿Cuál de los siguientes estudios confirmaría el diagnóstico de carcinoma renal?", "o": ["Ecografía abdominal", "Tomografía computarizada abdominal", "Resonancia magnética abdominal", "Urografía intravenosa"]}, {"n": 157, "q": "Una mujer embarazada en su tercer trimestre presenta hipertensión severa, proteinuria y edema facial. ¿Qué prueba confirmaría el diagnóstico de preeclampsia?", "o": ["Hipertensión arterial mayor a 140/90 mmHg", "Proteinuria mayor o igual a 300 mg en orina de 24 horas", "Edema generalizado", "Trombocitopenia"]}, {"n": 158, "q": "María de 32 años viene a la consulta por un cuadro de dolor en la mucosa oral asociado a presencia de múltiples lesiones ulcerosas. También presenta pseudofoliculitis y disminución de la agudeza visual. Para ello consultó previamente con oftalmología donde le diagnosticaron uveítis. ¿Cuál es el diagnóstico más probable?", "o": ["Síndrome de Stevens-Johnson", "Enfermedad de Behçet", "Lupus eritematoso sistémico", "Enfermedad de Crohn"]}, {"n": 159, "q": "Una mujer de 45 años consulta por fatiga crónica, piel seca y aumento de peso. En el examen físico se observa bocio difuso. Los análisis muestran TSH elevada y T4 libre baja. ¿Qué anticuerpo confirmaría el diagnóstico de tiroiditis autoinmune?", "o": ["Anticuerpos anti-tiroglobulina (Anti-Tg)", "Anticuerpos anti-peroxidasa tiroidea (Anti-TPO)", "Anticuerpos anti-receptor de TSH (TRAb)", "Anticuerpos anti-microsomales"]}, {"n": 160, "q": "¿Cuál es la función principal de los cuerpos de Nissl en las neuronas? Conducción del impulso nervioso", "o": ["Síntesis de proteínas", "Almacenamiento de neurotransmisores", "Aislamiento del axón"]}, {"n": 161, "q": "En un corte histológico de riñón, se observa un túbulo con epitelio cúbico simple con abundantes mitocondrias y un borde en cepillo prominente. ¿A qué estructura pertenece?", "o": ["Túbulo contorneado distal", "Túbulo colector", "Túbulo contorneado proximal", "Asa de Henle"]}, {"n": 162, "q": "El cáncer más frecuente en hombres en Argentina es:", "o": ["Cáncer de pulmón", "Cáncer de colon", "Cáncer de próstata", "Cáncer de piel"]}, {"n": 163, "q": "¿Cuál de los siguientes no es un síntoma común de la depresión?", "o": ["Pérdida de interés o placer en actividades", "Aumento del apetito", "Fatiga o pérdida de energía", "Sentimientos de culpa o inutilidad"]}]}, {"id": "diciembre-2025", "name": "Diciembre 2025", "year": 2025, "qs": [{"n": 1, "q": "Acude a la consulta Doralina Bazquez, de 86 años, por un cuadro de astenia marcada, calambres recurrentes y mareos. Tiene antecedentes de DBT tipo 2 de más de 30 años de evolución, en tratamiento con glibenclamida 10 mg/día y metformina 2 g/día. También se encuentra en tratamiento con losartán mg/día, betahistina 32 mg/día y fumarato ferroso 330 mg + vitamina B12 1000 mcg + ácido fólico 7,5 mg + ácido ascórbico 100 mg por comprimido desde hace 4 meses. Al momento de la consulta se presenta orientada en las 3 esferas, con palidez mucocutánea marcada y xerosis generalizada. FC 92 LPM, FR 20 RPM, R1 y R2 en 4 focos. Soplo sistólico funcional grado II en foco pulmonar, pulsos periféricos + y simétricos, sin edemas. Disnea leve de esfuerzo. Trae consigo analítica reciente que informa: HTO 26%, Hb 8,6 g/dl, GB 8900/mm³, glucemia 107 mg/dl. ¿Cuál es la etiología de la anemia más probable?", "o": ["Anemia ferropénica", "Déficit de vitamina B12", "Enfermedad renal crónica", "Anemia hemolítica"]}, {"n": 2, "q": "Jorge López, de 42 años, viene a la consulta por un cuadro de dolor sordo e insidioso en la región lumbar baja, con rigidez matutina que mejora con el ejercicio y reaparece con la inactividad. A este cuadro se suman ojo rojo unilateral y lesiones tipo placa eritematoescamosas en superficies extensoras de larga evolución. Se solicita Rx de columna lumbosacra frente y perfil, que informa columna en “caña de bambú”. Teniendo en cuenta el cuadro clínico completo, ¿cuál de los siguientes diagnósticos es el más probable?", "o": ["Artritis reumatoide", "Espondilitis anquilosante", "Lupus eritematoso sistémico", "Osteoartrosis"]}, {"n": 3, "q": "Acude a la consulta un varón de 17 años con un cuadro de otalgia, otorrea, hipoacusia y fiebre de 48 horas de evolución. A la otoscopía neumática se observa líquido en oído medio e inmovilidad de la membrana timpánica, que se encuentra abombada. Indique el esquema de tratamiento indicado para este cuadro.", "o": ["Ibuprofeno + observación", "Amoxicilina 500 mg cada 8 horas por 7–10 días", "Amoxicilina-clavulánico", "Amoxicilina-clavulánico 875/125 mg cada 12 horas por 10 días"]}, {"n": 4, "q": "Viene a la consulta un paciente por un cuadro de dolor, enrojecimiento y tumefacción del saco lagrimal, asociado a secreción purulenta por orificios lagrimales y conjuntivitis secundaria. Indique cuál de los siguientes es el diagnóstico del paciente.", "o": ["Conjuntivitis bacteriana", "Blefaritis", "Orzuelo", "Dacriocistitis"]}, {"n": 5, "q": "Viene a la consulta Cristina Rosa, de 67 años, con queja de prurito cutáneo intenso localizado en tronco posterior, brazos y piernas. Al examen físico se observan lesiones atróficas lineales blancas asociadas a máculas hiperpigmentadas circulares, junto con lesiones erosivas eritematosas brillantes circulares en las zonas afectadas. Se practica biopsia tipo punch que informa ampolla subepidérmica. En la inmunofluorescencia directa (IFD) se observa depósito de IgG + C3 en áreas de unión dermoepidérmica. ¿Cuál de los siguientes es el diagnóstico de la paciente?", "o": ["Pénfigo vulgar", "Dermatitis herpetiforme", "Penfigoide ampolloso", "Psoriasis"]}, {"n": 6, "q": "Viene a la consulta una paciente de 37 años por un cuadro de fiebre, astenia y lesión tipo ampolla de contenido purulento y base eritematosa en el brazo izquierdo. Homolateral a la lesión presenta adenomegalia tumefacta, dolorosa y eritematosa de 1 cm x 1 cm en la región submaxilar. En el cultivo microbiológico de la secreción se observan bacilos con tinción de plata. ¿Cuál es el tratamiento de elección?", "o": ["Amoxicilina", "Doxiciclina", "Ceftriaxona", "Clindamicina"]}, {"n": 7, "q": "Concurre a la consulta un paciente por un cuadro de cefalea unilateral y periocular, pulsátil, severa, que interfiere con las actividades cotidianas. Se asocia a inyección conjuntival, lagrimeo, miosis y ptosis palpebral ipsilaterales al dolor. ¿Cuál es el tratamiento de elección?", "o": ["Oxígeno al 100% durante 10 a 15 minutos asociado a sumatriptán subcutáneo", "Paracetamol 1 g cada 8 horas + reposo en ambiente oscuro", "Propranolol 40 mg cada 12 horas como profilaxis", "Amitriptilina 25 mg por la noche"]}, {"n": 8, "q": "Paciente masculino de 47 años, ex obeso (IMC 33 kg/m²), hipertenso, que niega consumo de alcohol, diagnosticado con cirrosis hepática no alcohólica desde hace 4 años. Medicación habitual: espironolactona 100 mg/día, furosemida 40 mg/día, propranolol 40 mg/día y lactulosa ocasional. En los últimos 5 días ha presentado distensión abdominal progresiva, diarrea escasa y constipación intermitente. Hace 48 horas se agrega cefalea leve, disminución del apetito y de la diuresis. Ayer la familia notó somnolencia y hoy desorientación (no reconoce el día ni dónde está). Niega hematemesis ni hematoquecia. Signos vitales: T° 38,1 °C, TA 100/60 mmHg, FC 96 lpm, Sat O₂ 97% aire ambiente. Laboratorio: glucemia capilar 110 mg/dl, Na⁺ 129 mmol/L, K⁺ 3,7 mmol/L, urea 58 mg/dl, creatinina 1,5 mg/dl, AST 78 U/L, ALT 46 U/L, GGT 90 U/L, RIN 1,9. Se realiza paracentesis que informa líquido ascítico transparente, con expulsión de 1,8 litros, 480 PMN/mm³ y proteínas 1,1 g/dl. ¿Cuál es la causa más probable del síndrome confusional agudo en este paciente?", "o": ["Sepsis", "Hiponatremia", "Hemorragia digestiva", "Encefalopatía hepática"]}, {"n": 9, "q": "¿Cuál de los siguientes fármacos es de elección para el tratamiento de las crisis de ausencia?", "o": ["Ácido valproico", "Etosuximida", "Carbamazepina", "Fenitoína"]}, {"n": 10, "q": "Viene a la consulta una paciente femenina de 27 años por un cuadro de sensación ilusoria de movimiento, de balanceo propio, que se asocia a náuseas, vómitos y diaforesis. Los síntomas son desencadenados al acostarse o tender la ropa. ¿Cuál de los siguientes es el diagnóstico de la paciente?", "o": ["Neuronitis vestibular", "Enfermedad de Ménière", "Vértigo posicional paroxístico benigno (VPPB)", "Migraña vestibular"]}, {"n": 11, "q": "Varón de 34 años, medico de emergencias, sin comorbilidades. Consulta por tos persistente de 18 días. Comenzó con un cuadro catarral leve (odinofagia, rinorrea escasa, febrícula) que duró 3-4 días; que evolucionó a tos intensa en accesos, especialmente nocturnos, que le provoca dificultad para dormir. Describe episodios de tos paroxística, seguidos de sensación de falta de aire y ocasional gasping respiratorio posterior. Niega fiebre, actualmente no expectora. Examen físico: TA 118/70 mmHg, FC 88 lpm, FR 20 rpm, Sat O₂ 98%, T° 36,8 °C. Auscultación: murmullo vesicular conservado, sin rales ni sibilancias. Tos desencadenada durante la entrevista. Rx de tórax normal. ¿Cuál es el diagnóstico más probable y el tratamiento adecuado para este paciente?", "o": ["Bronquitis aguda – iniciar amoxicilina", "Neumonía atípica – iniciar levofloxacina", "Tos ferina – iniciar azitromicina", "Asma – iniciar salbutamol"]}, {"n": 12, "q": "Ud. Asiste una odontóloga que acaba de tener un accidente cortopunzante durante una endodoncia de un paciente VIH positivo. Decide realizar profilaxis postexposición con:", "o": ["Tenofovir 300 mg/día + lamivudina 300 mg/día + dolutegravir 50 mg/día por 28 días", "Tenofovir 300 mg/día + lamivudina 300 mg/día + lopinavir 400 mg/12 hs + ritonavir 100 mg/12 hs por 28 días", "Zidovudina + lamivudina por 7 días", "No iniciar tratamiento y realizar solo seguimiento serológico"]}, {"n": 13, "q": "¿Cuál de las siguientes NO es una indicación de la difenhidramina?", "o": ["Reacciones alérgicas (urticaria, rinitis)", "Insomnio ocasional", "Cinestosis", "Vértigo periférico"]}, {"n": 14, "q": "Un adolescente de 15 años, jugador de handball, consulta por dolor en la región anterior de la rodilla derecha desde hace 3 semanas. Refiere que el dolor aumenta con la actividad (correr, saltar, subir escaleras) y mejora parcialmente en reposo. Niega traumatismo. Al examen físico se observa: aumento de volumen y sensibilidad en la tuberosidad tibial anterior; dolor a la palpación del tendón rotuliano en inserción tibial; dolor reproducido con extensión activa de la rodilla contra resistencia; no hay derrame articular ni limitación significativa del rango de movimiento. Rx lateral de rodilla: irregularidad y fragmentación de la tuberosidad anterior, sin otras alteraciones óseas. ¿Cuál es el diagnostico más probable?", "o": ["Condromalacia rotuliana", "Enfermedad de Osgood-Schlatter", "Tendinitis rotuliana (“rodilla del saltador”)", "Osteocondritis disecante"]}, {"n": 15, "q": "Un hombre de 52 años, nacido en Brasil y residente en Argentina, consulta por pérdida de peso de 8 kg en 3 meses, lesiones cutáneas pruriginosas en tronco y extremidades, y debilidad general. Refiere además episodios de hipercalcemia sintomática (constipación, poliuria y debilidad muscular). Al examen físico: múltiples lesiones cutáneas infiltradas, adenopatías cervicales y axilares, hepatoesplenomegalia leve. Laboratorio: Calcio 13,8 mg/dl; LDH elevada; linfocitosis marcada; frotis de sangre periférica Flower Cells; VIH negativo, HTLV-1 positivo. Biopsia de ganglio: infiltración difusa por linfocitos T maduros con marcadores CD4+. ¿Cuál es el diagnostico más probable?", "o": ["Linfoma de Hodgkin", "Leucemia linfocítica crónica", "Leucemia/Linfoma de células T del adulto asociado a HTLV-1 (ATLL)", "Micosis fungoide"]}, {"n": 16, "q": "Consulta una paciente de 37 años por cuadro de cervicalgia moderada que interfiere con las actividades cotidianas de la vida diaria. Niega enfermedades crónicas, niega medicación habitual, niega trauma. Al examen físico de la zona se palpa aumento del tono de los músculos paravertebrales, dolor a la palpación profunda, movilidad articular conservada, aunque limitada. Se realiza exploración neurológica que arroja: limitación en la flexión del codo y extensión de la mano derecha, hipoestesia de la cara dorsorradial del antebrazo y dedos pulgar, índice y medio homolateral. Se comprueba: reflejos bicipital y radial homolaterales afectados. Teniendo en cuenta el caso desarrollado indique cuál de las raíces cervicales se encuentra afectada.", "o": ["C6", "C5", "C7", "C8"]}, {"n": 17, "q": "Consulta un paciente de 27 años, oriundo del primer cordón del conurbano bonaerense, por cuadro de fiebre de 3 días de evolución asociado a malestar general, mioartralgias, diarrea y vómitos. Se realiza laboratorio que informa HTO 47%, GB 4000/mm3 con moderada linfocitosis, plaquetas 140.000/mm3. Ud sospecha:", "o": ["Gastroenteritis por norovirus", "Dengue", "Fiebre tifoidea", "Leptospirosis"]}, {"n": 18, "q": "Ud recibe una paciente de 42 años con diagnóstico de artritis reumatoidea en tratamiento con hidroxicloroquina con buena respuesta al tratamiento. ¿Cuál de los siguientes es el control que tiene mayor importancia teniendo en cuenta el fármaco mencionado?", "o": ["Hemograma", "Perfil hepático", "Fondo de ojo periódico", "Función renal"]}, {"n": 19, "q": "Recibe en la consulta por guardia un paciente de 63 años por epistaxis espontánea y equimosis cutáneas hace una semana. Refiere que el cuadro comenzó luego de un cambio de medicamento habitual. Tiene antecedentes de HTA, TVP y tendinitis. Utiliza Warfarina desde hace 3 años. ¿Qué fármaco puede estar interactuando y causando el sangrado?", "o": ["Amoxicilina", "Vitamina K", "Ibuprofeno", "Metronidazol"]}, {"n": 20, "q": "Si una mujer de 70 años tiene antecedentes de fracturas vertebrales múltiples, cuál de los siguientes grupos farmacológicos es de elección para su cuadro de osteoporosis:", "o": ["Calcio + vitamina D como monoterapia", "Denosumab", "Bifosfonatos (alendronato semanal)", "Teriparatida (análogo de PTH)"]}, {"n": 21, "q": "Mujer de 67 años, posmenopáusica desde los 50, acude para control. No tiene antecedentes de enfermedades previas, niega alcohol y TBQ. IMC 22. Laboratorio calcio, vitamina d y función renal normal. Densitometría ósea: columna lumbar T-score -2.3, cuello femoral T-score -1.9, cadera total T-score -1.8. FRAX riesgo de fractura osteoporótica mayor a 10 años: 22%, riesgo de fractura de cadera a 10 años: 4.5%. ¿En cuál de las siguientes situaciones está indicada el inicio del tratamiento farmacológico para osteoporosis?", "o": ["T-score menor o igual a -2.5 en cualquier sitio", "T-score entre -1.0 y -2.4 con FRAX ≥3% para fractura de cadera o ≥20% para fractura osteoporótica mayor", "T-score entre -1.0 y -2.4 con FRAX ≥3% solo para fractura de cadera", "Solo ante antecedente de fractura de cadera previa"]}, {"n": 22, "q": "Un hombre de 64 años, ex fumador de 40 paquetes/ año, consulta por tos persistente, pérdida de peso de 6 kg en 3 meses y disnea progresiva. Refiere hemoptisis escasa en dos oportunidades en la última semana. En el examen físico: estertores finos en hemitórax derecho y leve acropaquía. Rx tórax informa: opacidad en lóbulo superior derecho compatible con atelectasia parcial, elevación del surco menor con contorno convexo medial y cóncavo lateral (signo S Golden), tráquea discretamente desviada hacia la derecha, sin derrames. ¿Cuál es la causa más probable del hallazgo radiológico descrito?", "o": ["Tuberculosis pulmonar", "Neumonía lobar", "Obstrucción bronquial por tumor (carcinoma broncogénico)", "Derrame pleural"]}, {"n": 23, "q": "Concurre a la consulta un paciente masculino de 43 años por cuadro de lesiones cutáneas en áreas expuestas al sol. Refiere consumo problemático de alcohol crónico. Al examen físico se observan ampollas tensas y frágiles en dorso de manos y antebrazos, hiperpigmentación e hipertricosis facial leve. Ud decide solicitar un laboratorio que informa: aumento de la ferritina, aumento de las transaminasas, porfobilinogeno aumentado leve, uroporfirina aumento marcado, orina color rojo oscuro. ¿Cuál es el diagnostico más probable?", "o": ["Protoporfiria eritropoyética", "Porfiria cutánea tarda", "Porfiria aguda intermitente", "Lupus eritematoso sistémico"]}, {"n": 24, "q": "Un varón de 70 años con historia de hipertensión y diabetes-2 presenta dolor torácico opresivo de 30 min, sudoración profusa y náuseas. ECG: elevación del ST en la cara anterior. ¿Cuál es la mejor opción terapéutica inmediata?", "o": ["Administrar nitratos sublinguales y observar evolución", "Iniciar betabloqueantes y solicitar ecocardiograma", "Administrar fibrinolíticos o realizar angioplastia percutánea de urgencia", "Indicar antiagregación únicamente y control ambulatorio"]}, {"n": 25, "q": "Un paciente de 45 años con fiebre, escalofríos, disnea y esputo purulento de 48 h. Radiografía de tórax: infiltrado lobar derecho. ¿Cuál es la conducta más adecuada?", "o": ["Inicio de antibiótico empírico oral sin hospitalización", "Observación sin tratamiento antibiótico inicial", "Internación y antibióticos endovenosos de amplio espectro", "Inicio de antibiótico empírico ambulatorio si no presenta criterios de gravedad (evaluar CURB-65)"]}, {"n": 26, "q": "Una mujer de 26 años acude por disuria, polaquiuria y urgencia miccional. No fiebre. EGO: leucocitos y nitritos positivos. ¿Cuál es el diagnóstico y tratamiento más adecuado?", "o": ["Pielonefritis aguda → antibióticos endovenosos", "Cistitis aguda → antibiótico oral de elección (ej. nitrofurantoína o fosfomicina)", "Uretritis → tratamiento con ceftriaxona + azitromicina", "Vaginitis → tratamiento antifúngico"]}, {"n": 27, "q": "Un hombre de 55 años acude a la guardia con, dolor en hipocondrio derecho y fiebre. Ecografía: vesícula con pared de 1.5 mm, con cálculos múltiples el mayor de 4mm y colección sobre el hígado de 2 mm. ¿Cuál es el diagnóstico y conducta inicial adecuada?", "o": ["Cólico biliar → analgesia y alta ambulatoria", "Colecistitis aguda → hospitalización, antibióticos y colecistectomía temprana (urgente/ precoz)", "Colangitis → antibióticos y CPRE inmediata", "Colecistitis aguda → hospitalizar, antibiótico y colecistectomía electiva"]}, {"n": 28, "q": "Una mujer de 72 años con osteoporosis conocida presenta una caída de su propia altura y dolor lumbar intenso, sin traumatismo mayor. Se observa fractura vertebral por compresión en L2. ¿Qué es lo más adecuado?", "o": ["Analgesia, ortesis vertebral y evaluación/inicio de tratamiento para la osteoporosis", "Cirugía urgente con fijación vertebral", "Reposo absoluto prolongado sin analgesia", "Solo tratamiento con calcio y vitamina D"]}, {"n": 29, "q": "Paciente de 48 años, ingresa con dolor epigástrico irradiado a la espalda, náuseas y vómitos. Amilasa y lipasa 5 veces lo normal. ¿Cuál es la causa más probable y el paso inicial?", "o": ["Gastritis aguda → inhibidores de bomba de protones ambulatorios", "Pancreatitis aguda → ingreso, reposo intestinal y líquidos endovenosos", "Colecistitis aguda → antibióticos y cirugía diferida", "Úlcera péptica perforada → cirugía urgente"]}, {"n": 30, "q": "Una paciente de 38 años presenta debilidad progresiva en las extremidades inferiores, dificultad para subir escaleras, reflejos aumentados, signos de Babinski positivos. RM cerebral normal. ¿Cuál es la sospecha diagnóstica más probable?", "o": ["Esclerosis lateral amiotrófica (ELA)", "Miastenia gravis", "Neuropatía periférica desmielinizante", "Mielopatía cervical compresiva"]}, {"n": 31, "q": "Un varón de 64 años refiere hematuria macroscópica indolora, sin infección urinaria asociada, fumador. ¿Cuál es el diagnóstico más probable y el paso diagnóstico inicial?", "o": ["Hiperplasia prostática benigna → PSA y tacto rectal", "Litiasis urinaria → ecografía renal", "Cáncer de vejiga → cistoscopía y citología urinaria", "Infección urinaria → urocultivo"]}, {"n": 32, "q": "Una mujer de 28 años consulta por pérdida de peso, sudoración nocturna, fiebre de bajo grado y adenopatías generalizadas. La biopsia ganglionar muestra células de ReedSternberg. ¿Cuál es el tratamiento estándar inicial?", "o": ["Linfoma de Hodgkin → quimioterapia con esquema ABVD ± radioterapia según estadio", "Linfoma no Hodgkin → R-CHOP", "Observación y controles periódicos", "Corticoides como monoterapia"]}, {"n": 33, "q": "Paciente de 50 años con antecedente de hipertensión no tratada, acude con cefalea súbita, vómitos y rigidez de nuca. TAC: hemorragia subaracnoidea. ¿Cuál es la causa más probable?", "o": ["Hipertensión arterial", "Rotura de aneurisma sacular (berry)", "Malformación arteriovenosa", "Trombosis venosa cerebral"]}, {"n": 34, "q": "Una paciente de 35 años se queja de rigidez matinal articular en manos de más de 1 hora, simétrica, con factor reumatoide positivo. ¿Cuál es el diagnóstico y terapia de primera línea?", "o": ["Lupus erit r opción de manejo?", "o": ["Cistitis → antibiótico corto por 3 días", "Pielonefritis aguda sin criterios de gravedad → antibiótico oral ambulatorio (ej. fluoroquinolona o cefalosporina)", "Internación y antibióticos EV de amplio espectro en todos los casos", "Observación sin tratamiento antibiótico"]}, {"n": 44, "q": "Una mujer de 55 años con antecedentes de hipotiroidismo tratado consulta con fatiga, aumento de peso, intolerancia al frío, constipación. TSH elevada, T4 disminuida. ¿Cuál es la mejor acción?", "o": ["Disminuir la dosis de levotiroxina", "Suspender el tratamiento y reevaluar", "Aumentar la dosis de levotiroxina", "Iniciar tratamiento con corticoides"]}, {"n": 45, "q": "Paciente de 62 años con antecedentes de diabetes e hipertensión que acude a urgencias por dolor torácico opresivo de 1 hora de evolución. Se realiza un ECG de 12 derivaciones que muestra una elevación persistente del segmento ST de 3 mm en las derivaciones II, III y aVF, con depresión recíproca del ST en aVL. ¿Cuál es la localización probable del infarto y cuál es la arteria coronaria responsable más probable?", "o": ["Infarto anterior; arteria descendente anterior", "Infarto lateral; arteria circunfleja", "Infarto inferior; arteria coronaria derecha (ACD)", "Infarto posterior; arteria descendente posterior"]}, {"n": 46, "q": "Mujer de 47 años que consulta por fenómeno de Raynaud de larga evolución, que ha notado recientemente engrosamiento de la piel y dificultad para tragar alimentos sólidos. En la exploración física se observan pápulas eritematosas en los dedos y se aprecian calcificaciones subcutáneas en los antebrazos. Basado en los hallazgos clínicos presentados, ¿cuál es el diagnóstico más probable?", "o": ["Lupus eritematoso sistémico", "Dermatomiositis", "Esclerodermia sistémica difusa", "Esclerosis sistémica limitada (síndrome CREST)"]}, {"n": 47, "q": "Paciente de 37 años con historia de diarrea sanguinolenta intermitente, dolor abdominal tipo cólico y tenesmo rectal durante odactilia y telangiectasias?", "o": ["Hipertensión pulmonar secundaria a esclerodermia (enfermedad del tejido conectivo)", "Tromboembolismo pulmonar crónico", "Cardiopatía izquierda", "EPOC"]}, {"n": 52, "q": "Laciprofloxacina es una fluoroquinolona de segunda generación de uso común utilizada para tratar diversas infecciones. Su mecanismo de acción implica la inhibición de la ADN girasa y la topoisomerasa IV bacterianas. ¿Cuál de las siguientes opciones describe con mayor precisión el espectro antimicrobiano predominante?", "o": ["Amplio espectro con excelente cobertura de bacterias Gram negativas (incluyendo Pseudomonas aeruginosa) y patógenos atípicos, con actividad moderada contra Gram positivas", "Predomínio exclusivo sobre bacterias Gram positivas, especialmente Streptococcus pneumoniae", "Cobertura principal de anaerobios estrictos", "Actividad limitada a bacterias intracelulares sin acción sobre Gram negativas"]}, {"n": 53, "q": "Mujer de 45 años con antecedentes de tiroidectomía hace 2 años, acude con parestesias en manos, tetania, y calcio sérico de 6,5 mg/dL. ¿Cuál es la causa más probable y tratamiento?", "o": ["Hipoparatiroidismo posquirúrgico → calcio + vitamina D (calcitriol)", "Hipotiroidismo → levotiroxina", "Déficit de vitamina D → colecalciferol únicamente", "Hiperparatiroidismo → cirugía paratiroidea"]}, {"n": 54, "q": "Paciente varón de 65 años que acude a consulta por fatiga, prurito intenso que empeora tras el baño con agua caliente y sensación de plenitud abdominal. En la analítica de sangre destaca un hematocrito elevado (58%), hemoglobina de 19 g/dL, leucocitosis (12,000/uL) y trombocitosis (450,000/uL). La eritropoyetina sérica (EPO) está suprimida o muy baja. ¿Cuál es el diagnóstico más probable en este paciente?", "o": ["Policitemia secundaria por hipoxia", "Policitemia vera (neoplasia mieloproliferativa)", "Hemocromatosis", "Leucemia mieloide crónica"]}, {"n": 55, "q": "Mujer de 29 años con dolor pélvico cíclico, dismenorrea severa, inf a → metanefrinas plasmáticas"]}, {"n": 59, "q": "Un paciente de 68 años con disnea progresiva, antecedentes de fumador, espirometría que muestra FEV1/FVC < 70 % y FEV1 50 % del previsto, Rx con hiperinsuflación. ¿Cuál es el diagnóstico y cuál es la estrategia terapéutica principal?", "o": ["Asma bronquial → corticoides inhalados en monoterapia", "EPOC moderado-grave → broncodilatadores de acción prolongada (LABA/LAMA) + cesación tabáquica", "Insuficiencia cardíaca → diuréticos", "Neumonía crónica → antibióticos prolongados"]}, {"n": 60, "q": "Mujer de 39 años con HTA resistente, hipopotasemia y aldosterona elevada, renina baja. ¿Cuál es el diagnóstico y cuál es el tratamiento quirúrgico de elección?", "o": ["Feocromocitoma → adrenalectomía tras bloqueo alfa", "Síndrome de Cushing → resección de adenoma hipofisario", "Hiperaldosteronismo primario (adenoma suprarrenal) → adrenalectomía laparoscópica selectiva", "Estenosis de arteria renal → angioplastia"]}, {"n": 61, "q": "Varón de 60 años tras un infarto agudo empieza con disnea progresiva, fatiga, y ecocardiograma que muestra fracción de eyección del ventrículo izquierdo del 30 %. ¿Cuál es el diagnóstico y qué clase de fármaco mejora la supervivencia?", "o": ["Insuficiencia cardíaca con fracción de eyección reducida → IECA/ARA II + betabloqueantes + (eventual antagonista de aldosterona)", "Insuficiencia cardíaca con FE preservada → diuréticos como único tratamiento", "Pericarditis constrictiva → AINEs", "Cardiomiopatía hipertrófica → digoxina"]}, {"n": 62, "q": "Paciente de 29 años con diarrea sanguinolenta, dolor abdominal, fiebre y colonoscopia que muestra úlceras superficiales en colon y recto continuo. ¿Cuál es el diagnóstico más probable y tratamiento inicial?", "o": ["Enfermedad de Crohn → metotrexato", "Colitis ulcerosa → 5-ASA (mesalazina) ± corticoides según gravedad", "Colitis infecciosa → antibióticos empíricos", "Síndrome de intestino irritable → dieta y antiespasmódicos"]}, {"n": 63, "q": "Mujer de 48 años con palpitaciones, hipersudoración, presión arterial 180/110 mmHg y nivel elevado de metanefrinas plasmáticas. Se identifica masa adrenal izquierda de 3 cm. Diagnóstico y manejo:", "o": ["Hiperplasia suprarrenal congénita → corticoides", "Feocromocitoma → cirugía tras bloqueo alfa-adrenérgico preoperatorio (± betabloqueo posterior)", "Adenoma de Conn → espironolactona", "Síndrome de Cushing → resección hipofisaria"]}, {"n": 64, "q": "Varón de 55 años acude a urgencias refiriendo disnea súbita y dolor torácico pleurítico. No presenta antecedentes de enfermedad pulmonar o cardíaca previa. Los gases arteriales iniciales muestran hipoxemia significativa (PaO2 55 mmHg). Una tomografía axial computarizada (TAC) de tórax simple no muestra alteraciones parenquimatosas (neumonía, derrame o neumotórax). Ante la persistencia de la hipoxemia y la sospecha clínica, se realiza una angio-TAC pulmonar que revela la presencia de un trombo oclusivo en una arteria pulmonar segmentaria distal derecha. ¿Cuál es la conducta diagnóstica y terapéutica inicial más adecuada en este paciente?", "o": ["Monitorización en UCI e inicio de fibrinólisis sistémica", "Anticoagulación inmediata (heparina de bajo peso molecular o no fraccionada) y estratificación de riesgo hemodinámico", "Antibióticos de amplio espectro", "Broncodilatadores y corticoides inhalados"]}, {"n": 65, "q": "Paciente varón de 72 años, con antecedentes de hipertensión arterial y tabaquismo, que ingresa a urgencias con un cuadro de confusión y letargo progresivo. En la exploración física se encuentra normotenso, con mucosas secas, y se aprecian pliegues cutáneos persistentes, pero sin edema periférico evidente. Los análisis de laboratorio muestran un sodio sérico de 122 mEq/L, osmolaridad sérica de 260 mOsm/kg y osmolaridad urinaria de 110 mOsm/kg. ¿Cuál es la causa subyacente más probable de la hiponatremia de este paciente, basándose en los datos clínicos y de laboratorio?", "o": ["Síndrome de secreción inadecuada de ADH (SIADH)", "Hiponatremia hipovolémica por depleción de volumen (diuréticos o pérdidas GI)", "Hiponatremia hipovolémica con pérdidas extrarrenales (vómitos/diarrea)", "Hiponatremia hipovolémica con orina diluida por baja ADH secundaria a hipovolemia con ingesta reducida de solutos (hiponatremia hipovolémica no renal)"]}, {"n": 66, "q": "Varón de 52 años con ictericia (coluria, acolia, prurito), sin cálculos en ecografía, CA 19-9 elevado. ¿Cuál es el diagnóstico probable y qué estudio realizar para confirmar?", "o": ["Hepatitis viral aguda → serologías virales", "Coledocolitiasis → CPRE diagnóstica-terapéutica", "Pancreatitis crónica → TAC", "Cáncer de páncreas (adenocarcinoma de cabeza pancreática) → TAC contrastada o colangio-RM para estadificación y confirmación inicial"]}, {"n": 67, "q": "Mujer de 46 años con menopausia prematura (a los 40 años) que presenta sofocos, sudoración nocturna, y osteoporosis (T-score -2.5). ¿Cuál es la terapia más apropiada para los síntomas vasomotores y la prevención de la osteoporosis, si no hay contraindicación?", "o": ["Bisfosfonatos como única terapia", "Terapia de reemplazo hormonal (estrógenos ± progestágenos)", "Calcio y vitamina D únicamente", "SERMs (raloxifeno) como primera línea para síntomas vasomotores"]}, {"n": 68, "q": "Usted se encuentra en la consulta junto con Mateo de 15 días de vida y su mamá. La mamá está preocupada porque cree que su bebé, que se alimenta con pecho materno exclusivo, se queda con hambre. Mateo es un lactante producto de embarazo controlado, RN de 37.5 semanas/peso 3100 gr, alta conjunta a las 48 hs, con un progreso de peso de 27gr/d. ¿Cuál de las siguientes conductas usted debe tomar en primera instancia?", "o": ["Indicar fórmula complementaria inmediata", "Evaluar técnica de lactancia y continuar lactancia materna exclusiva", "Iniciar destete progresivo", "Indicar agua o té entre tomas"]}, {"n": 69, "q": "Indique la secuencia de desarrollo puberal considerada normal en la mujer:", "o": ["Vello pubiano → botón mamario → menarca → pico de crecimiento", "Botón mamario → vello pubiano → pico de crecimiento → menarca", "Pico de crecimiento → menarca → botón mamario → vello pubiano", "Menarca → botón mamario → vello pubiano → pico de crecimiento"]}, {"n": 70, "q": "¿Cómo se define obesidad en pacientes pediátricos mayores de 2 años?", "o": ["IMC > percentilo 85", "IMC > percentilo 90", "IMC > percentilo 97 (o ≥2 DE)", "IMC > percentilo 50"]}, {"n": 71, "q": "Concurre a control de salud Pablo de 7 años. Dentro de la antropometría, usted pesquisa una talla con score Z -2.3. Decide valorar talla de ambos padres y calcula un rango genético con score Z entre -2.5 y +1. ¿Cómo lo interpreta?", "o": ["Baja talla patológica siempre", "Talla normal para la edad", "Baja talla para la población, dentro del rango familiar (variación normal)", "Retraso de crecimiento severo"]}, {"n": 72, "q": "El score de TAL se utiliza para evaluar a los pacientes con bronquiolitis. Además de la frecuencia cardíaca y la frecuencia respiratoria, ¿qué otros parámetros se incluyen?", "o": ["Saturación de O₂ y fiebre", "Tiraje y cianosis", "Tiraje y cianosis (como signos de gravedad)", "Estridor y tos perruna"]}, {"n": 73, "q": "Paciente de 8 años, sano, con diagnóstico de neumonia aguda de la comunidad (NAC) realizado hace 36 horas, en tratamiento con amoxicilina a dosis correcta y adecuada adherencia, consulta nuevamente a la guardia por persistencia de clínica. Al examen físico e interrogatorio, no se evalúa cambio clínico. ¿Cuál es la conducta adecuada?", "o": ["Suspender antibiótico y cambiar esquema inmediatamente", "Continuar mismo tratamiento y reevaluar en 24 h si estable clínicamente", "Internación obligatoria", "Agregar corticoides"]}, {"n": 74, "q": "¿Hasta qué edad se puede aplicar la vacuna triple bacteriana celular?", "o": ["1 año", "2 años", "5 años, 11 meses y 29 días", "10 años"]}, {"n": 75, "q": "Ingresa a la guardia Victoria de 1 año 11 meses de edad, con un cuadro de diarrea acuosa de 7 días de evolución. Usted la valora con palidez cutáneo mucosa, irritable, débil, con edema bipalpebral leve. Observa el pañal con escasa orina y heces con estrías sanguinolentas. Decide solicitar un laboratorio con los siguientes resultados: GB 12130 (79% N, 21% L), Hb 6.9 g/dl, plaquetas 90.000/mm3, uremia 55 mg/dl, creatininemia 1.3 mg/dl, Orina completa (tomada por sondaje) con Hb + y proteinuria +, sin otros datos positivos. ¿Cuál es el diagnóstico más probable?", "o": ["Gastroenteritis bacteriana no complicada", "Síndrome urémico hemolítico (SUH)", "Púrpura de Henoch-Schönlein", "Insuficiencia renal crónica congénita"]}, {"n": 76, "q": "¿Cuál es la causa más frecuente de síndrome nefrótico en la edad pediátrica?", "o": ["Glomeruloesclerosis focal y segmentaria", "Nefropatía por IgA", "Glomerulonefritis con cambios mínimos (enfermedad de cambios mínimos)", "Lupus eritematoso sistémico"]}, {"n": 77, "q": "Indique cuál es la distribución habitual de las lesiones por dermatitis atópica en el lactante:", "o": ["Superficies extensoras exclusivamente", "Región perioral y manos", "Cara, cuero cabelludo y superficies extensoras", "Mejillas, cuero cabelludo y superficies extensoras (zonas expuestas y de roce)"]}, {"n": 78, "q": "Paciente de 10 años, es traído a la guardia por presentar dolor y eritema testicular de pocas horas de evolución. Sin antecedentes, niega traumatismos. Al examen físico usted detecta en polo superior, masa indurada y dolorosa a la palpación, con reflejo cremasteriano presente. Señale el diagnóstico correcto:", "o": ["Torsión testicular", "Epididimitis", "Hidrocele", "Torsión de apéndice testicular (hidátide de Morgagni)"]}, {"n": 79, "q": "Paciente de 12 meses de edad es traído a la guardia por presentar llanto inconsolable y dolor abdominal intermitente asociada a 1 vómito. Al realizar el examen físico, se encuentra irritable, pálido, sudoroso, con abdomen blando y flexión de las piernas. En el pañal se observa 1 deposición sanguinolenta. ¿Cuál es el diagnóstico presuntivo?", "o": ["Gastroenteritis aguda", "Apendicitis aguda", "Invaginación intestinal (intususcepción)", "Estreñimiento severo"]}, {"n": 80, "q": "Paciente de 67 años, con EPOC y diabetes, consulta por fiebre, tos productiva y un CURB-65 = 2. ¿Cuál es la terapia antibiótica inicial más adecuada para una neumonía adquirida en la comunidad (NAC)?", "o": ["Ceftriaxona en monoterapia", "Amoxicilina ambulatoria", "Levofloxacina o beta-lactámico + macrólido (manejo hospitalario según guías)", "Azitromicina sola"]}, {"n": 81, "q": "Según guías actuales, ¿cuál de las siguientes drogas reduce mortalidad en insuficiencia cardíaca con fracción de eyección reducida (HFrEF)?", "o": ["Furosemida", "Digoxina", "Sacubitril/valsartán (ARNI) y otros fármacos modificadores de pronóstico (IECA, beta bloqueantes, antagonistas de aldosterona)", "Nitratos"]}, {"n": 82, "q": "Mujer de 36 años con probabilidad clínica ALTA de tromboembolismo pulmonar según Wells, taquicardia y disnea intensa. ¿Qué estudio debe realizarse primero?", "o": ["Dímero D", "Angiotomografía de tórax (angio-TAC pulmonar)", "Radiografía de tórax", "Ecocardiograma transtorácico"]}, {"n": 83, "q": "¿Cuál es el objetivo de presión arterial recomendado en un paciente con enfermedad renal crónica estadio 3 y proteinuria según KDIGO 2021?", "o": ["<140/90 mmHg", "<130/80 mmHg", "<125/75 mmHg", "<120/70 mmHg (si tolera) o en general <130/80 con enfoque individualizado según KDIGO actualización (especial énfasis en proteinuria)"]}, {"n": 84, "q": "En un paciente cirrótico con ascitis sometido a una paracentesis evacuadora, ¿cuándo está indicada la administración de albúmina intravenosa?", "o": ["Siempre, independientemente del volumen extraído", "Solo si se extraen >5 litros de ascitis (paracentesis de gran volumen)", "Solo si hay infección del líquido ascítico", "Nunca está indicada"]}, {"n": 85, "q": "Paciente con hipercalcemia severa (calcio corregido 13,8 mg/dL). ¿Cuál es la medida terapéutica inicial más importante?", "o": ["Furosemida inmediata", "Bisfosfonatos como primera medida", "Hidratación vigorosa con solución salina isotónica", "Restricción hídrica"]}, {"n": 86, "q": "En el diagnóstico de anemia ferropénica, ¿cuál de los siguientes parámetros es más sensible y específico para confirmar déficit de hierro?", "o": ["Hemoglobina baja", "VCM bajo", "Ferritina sérica baja", "Transferrina baja"]}, {"n": 87, "q": "En el contexto de una exacerbación aguda de EPOC, ¿en qué situación están indicados los corticoides sistémicos según GOLD 2024?", "o": ["Solo en exacerbaciones leves sin disnea", "En todas las exacerbaciones independientemente de la gravedad", "Ante aumento de disnea, volumen y/o purulencia del esputo (criterios de Anthonisen) o necesidad de hospitalización", "Solo si hay neumonía asociada"]}, {"n": 88, "q": "Paciente que ingiere 15 g de paracetamol hace 6 horas. El valor de paracetamol sérico es 180 µg/mL en la sexta hora. Según el nomograma de Rumack-Matthew, ¿qué corresponde hacer?", "o": ["Observación y control de laboratorio en 24 h", "Iniciar N-acetilcisteína (NAC) inmediatamente", "Hemodiálisis urgente", "Carbón activado solamente"]}, {"n": 89, "q": "Paciente de 45 años con episodio depresivo mayor sin antecedentes de tratamiento previo. Tiene factores de riesgo cardiometabólico (HTA, dislipemia). ¿Cuál antidepresivo es considerado de primera línea y con mejor perfil de seguridad cardiovascular?", "o": ["Amitriptilina", "Fluoxetina (ISRS)", "Clomipramina", "Imipramina"]}, {"n": 90, "q": "Mujer joven sexualmente activa con dolor abdominal bajo, flujo vaginal y dolor a la movilización cervical. Diagnóstico de enfermedad pélvica inflamatoria (EPI). ¿Cuál es el tratamiento ambulatorio recomendado?", "o": ["Azitromicina VO en monoterapia durante 5 días", "Ceftriaxona intramuscular en monodosis", "Ceftriaxona intramuscular + doxiciclina", "Ceftriaxona intramuscular + ampicilina"]}, {"n": 91, "q": "¿Cuál es el hallazgo clínico más característico en las etapas iniciales de la isquemia mesentérica aguda?", "o": ["Dolor abdominal desproporcionado al examen físico", "Defensa abdominal marcada desde el inicio", "Fiebre alta como signo inicial predominante", "Rigidez abdominal generalizada precoz"]}, {"n": 92, "q": "Niño de 3 años con fiebre, rigidez de nuca y signos meníngeos. LCR: glucosa disminuida, proteínas elevadas, 2.500 leucocitos/µL (90% polimorfonucleares). ¿Cuál es el esquema antibiótico empírico inicial recomendado en Argentina para meningitis bacteriana?", "o": ["Ampicilina + gentamicina", "Ceftriaxona + ampicilina", "Cefotaxima + metronidazol", "Ceftriaxona + vancomicina"]}, {"n": 93, "q": "Paciente de 78 años con fibrilación auricular en tratamiento con digoxina presenta náuseas, visión amarilla y arritmia ventricular. Potasio sérico: 5,8 mEq/L. ¿Cuál es la conducta inicial más apropiada?", "o": ["Administrar gluconato de calcio en bolo", "Administrar anticuerpos anti-digoxina", "Iniciar lidocaína IV", "Administrar amiodarona IV"]}, {"n": 94, "q": "En la intoxicación aguda por cocaína, ¿cuál de las siguientes complicaciones cardiovasculares que amenazan la vida es más frecuente?", "o": ["Infarto agudo de miocardio", "Arritmias ventriculares", "Tromboembolismo pulmonar masivo", "Disección aórtica aguda"]}, {"n": 95, "q": "En la intoxicación por organofosforados, ¿cuál de los siguientes parámetros se utiliza como marcador de severidad?", "o": ["Niveles séricos de amilasa pancreática", "Gasometría arterial con PaO₂ disminuida", "Actividad de pseudocolinesterasa hepática exclusivamente", "Actividad de colinesterasa (acetilcolinesterasa) plasmática o eritrocitaria"]}, {"n": 96, "q": "Paciente de 30 años llega a la guardia luego de inhalar monóxido de carbono accidentalmente en su cochera. Presenta cefalea, vómitos y confusión. SatO₂ por oximetría: 98%. ¿Cuál es la medida diagnóstica más útil?", "o": ["Medición de carboxihemoglobina", "Dosaje de lactato sérico", "Gasometría arterial con oxígeno disuelto", "Electrocardiograma seriado"]}, {"n": 97, "q": "Cuál es el signo / síntoma más frecuente en la miocardiopatía dilatada?", "o": ["Edema agudo de pulmón como presentación inicial", "Dolor torácico atípico persistente", "Disnea de esfuerzo progresiva", "Palpitaciones aisladas en reposo"]}, {"n": 98, "q": "Puede observarse esplenomegalia en las siguientes afecciones, EXCEPTO:", "o": ["Mononucleosis infecciosa", "Rubéola", "Leishmaniasis visceral", "Leucemia mieloide crónica"]}, {"n": 99, "q": "¿Cuál es la mayor utilidad del antígeno carcinoembrionario (CEA) con respecto al cáncer de colon?", "o": ["Diagnóstico precoz en población asintomática", "Screening poblacional de cáncer colorrectal", "Diferenciación histológica del tipo tumoral", "Seguimiento para detectar recurrencias luego de la resección"]}, {"n": 100, "q": "Un paciente ha sufrido un accidente de tránsito y como consecuencia una contusión cerrada sobre el tórax. Al ingresar a la guardia usted lo encuentra con compromiso respiratorio, desviación de la tráquea, ausencia de ruidos respiratorios, regurgitación de las venas del cuello e hipertimpanismo ipsilateral en dicho hemitórax. ¿Cuál es su diagnóstico presuntivo?", "o": ["Neumotórax a tensión", "Hemotórax masivo", "Neumonía aspirativa aguda", "Contusión pulmonar bilateral"]}]}]</script>

  ys.forEach(y=>h+='<button class="chip'+(y==S.year?' on':'')+'" data-y="'+y+'">'+y+'</button>');
  h+='</div><div class="exams">';
  EX.filter(e=>e.year==S.year).forEach(e=>{const st=load(e.id),n=Object.keys(st).length,k=Object.values(st).filter(v=>v.c).length;
    h+='<button class="ex" data-e="'+e.id+'"><b>'+e.name+'</b><span>'+e.qs.length+' preguntas · '+k+' verificadas</span><div class="bar"><i style="width:'+(100*k/e.qs.length)+'%"></i></div></button>'});
  app.innerHTML=h+'</div>';
  app.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{S.year=+b.dataset.y;home()});
  app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{S.ex=EX.find(e=>e.id==b.dataset.e);S.st=load(S.ex.id);S.i=0;quiz()});
}
function quiz(){
  S.cf=0;
  const e=S.ex,q=e.qs[S.i],st=S.st[q.n]||{},k=(KEY[e.id]||{})[q.n];
  const done=Object.values(S.st).filter(v=>v.c).length;
  const graded=Object.values(S.st).filter(v=>v.c&&v.ok!==undefined);
  let h='<div class="top"><button class="link" id="back">← Simulacros</button><span class="stats">'+done+' / '+e.qs.length+' verificadas'+(graded.length?' · '+graded.filter(v=>v.ok).length+' correctas':'')+'</span></div>';
  h+='<div class="card"><div class="qn">'+e.name+' · pregunta '+q.n+'</div><p class="qt">'+esc(q.q)+'</p>';
  if(q.o.length<2)h+='<div class="fb warn">El PDF original trae esta pregunta incompleta (sin opciones legibles). Usá el texto como consigna abierta.</div>';
  q.o.forEach((t,j)=>{let c='opt';if(st.a===L[j])c+=' sel';
    if(st.c&&k&&k.a){if(L[j]===k.a)c+=' ok';else if(st.a===L[j])c+=' ko'}
    h+='<button class="'+c+'" data-o="'+L[j]+'"'+(st.c?' disabled':'')+'><b>'+L[j]+'.</b><span>'+esc(t)+'</span></button>'});
  if(q.o.length&&q.o.length<4)h+='<div class="note" style="margin-top:4px">Nota: el PDF muestra solo '+q.o.length+' opciones para esta pregunta.</div>';
  if(st.c){
    if(k&&k.a){const ok=st.a===k.a;h+='<div class="fb '+(ok?'ok':'ko')+'"><b>'+(ok?'Correcto.':'Incorrecto.')+' Respuesta correcta: '+k.a+'.</b><br>'+esc(k.why||'')+(k.src?'<br><i>Fuente: '+esc(k.src)+'</i>':'')+'</div>'}
    else h+='<div class="fb warn">'+(k?'<b>Pregunta anulable.</b> '+esc(k.why)+(k.src?'<br><i>Fuente: '+esc(k.src)+'</i>':''):'Tu respuesta quedó registrada ('+(st.a||'—')+'). El gabarito con fundamento científico de esta pregunta todavía no está cargado.')+'</div>'}
  h+='<div class="btns"><button class="btn" id="prev"'+(S.i?'':' disabled')+'>← Anterior</button>'+
   '<button class="btn p" id="chk"'+(st.c||!st.a?' disabled':'')+'>Verificar</button>'+
   '<button class="btn" id="next"'+(S.i<e.qs.length-1?'':' disabled')+'>Siguiente →</button></div></div><div class="grid">';
  e.qs.forEach((x,j)=>{const s=S.st[x.n]||{},kk=(KEY[e.id]||{})[x.n];let c='g';
    if(s.c&&kk&&kk.a)c+=s.a===kk.a?' ok':' ko';else if(s.a)c+=' a';if(j==S.i)c+=' cur';
    h+='<button class="'+c+'" data-j="'+j+'">'+x.n+'</button>'});
  h+='</div><div class="btns"><button class="link" id="reset">Reiniciar este simulacro</button></div>';
  app.innerHTML=h;window.scrollTo(0,0);
  document.getElementById('back').onclick=home;
  document.getElementById('prev').onclick=()=>{S.i--;quiz()};
  document.getElementById('next').onclick=()=>{S.i++;quiz()};
  document.getElementById('chk').onclick=()=>{const s=S.st[q.n];s.c=1;if(k&&k.a)s.ok=s.a===k.a;save();quiz()};
  document.getElementById('reset').onclick=function(){if(!S.cf){S.cf=1;this.textContent='¿Seguro? Tocá de nuevo para borrar tus respuestas';return}S.cf=0;S.st={};save();S.i=0;quiz()};
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{S.st[q.n]={a:b.dataset.o};save();quiz()});
  app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{S.i=+b.dataset.j;quiz()});
}
home();
</script></body></html>
