a antirrábica, vacuna antitetánica", "Cefalexina, vacuna antitetánica"]}, {"n": 85, "q": "Paciente varón de 67 años ingresa por guardia. Presenta un cuadro de tos etalidad. húmeda no productiva, fiebre de 48hs y disnea clase funcional IV. En el examen físico se encuentra parcialmente orientado en tiempo y espacio, roncus y sibilancias bilaterales a predominio derecho y rales crepitantes en base derecha, PA 100/60 mmHg, FC 110 lpm, FR 32/min, saturación de oxígeno 90% respirando al aire ambiente. Se realiza una radiografía simple de tórax que muestra un infiltrado en base derecha compatible con NAC. El laboratorio presenta: recuento de GB 17200/mm3, hematocrito 42%, glucemia 113 mg/Dl creatinina de 1.85 mg/dL. Usted calcula el CURB-65 y obtiene un valor de 4. ¿Cuál considera que es la conducta correcta en este caso?", "o": ["Nebulizaciones, antibiótico por vía oral, reposo y control en 24hs", "Observación en guardia y tratamiento ATB", "Internación en sala general y tratamiento ATB endovenoso", "Internación en UTI por riesgo aumentado de morbimortalidad"]}]}, {"id": "febrero-2024", "name": "Febrero 2024", "year": 2024, "qs": [{"n": 1, "q": "¿Cuál es el período de evicción escolar de una parotiditis?", "o": ["7 días", "9 días", "5 días", "40 días"]}, {"n": 2, "q": "Un paciente de 65 años lo consulta trayendo una radiografía de tórax que evidencia ensanchamiento mediastinal. Ud. le solicita una TAC de tórax en la que observa imágenes con densidad de partes blandas con calcificaciones en \"cáscaras de cebolla\" a nivel subcarinal y retrocavo-pretraqueal. Su diagnóstico presuntivo es:", "o": ["Timoma calcificado.", "Silicosis.", "Tuberculosis.", "Sarcoidosis."]}, {"n": 3, "q": "Pablo de 51 años sufre de DBT2. Concurre a la consulta manifestándole su preocupación por presentar DSE (disfunción sexual eréctil). Ud. decide indicarle Tadalafilo por lo que previamente se asegura que el enfermo no está medicado actualmente ni consumirá una de las siguientes drogas (que puede producir interacciones medicamentosas potencialmente fatales):", "o": ["Nitratos.", "Losartan.", "Antidepresivos tricíclicos.", "Beta-bloqueantes."]}, {"n": 4, "q": "Los padres traen a la consulta a su hijo para el control en salud. La madre lo coloca con suavidad sobre la camilla y el lactante ríe a carcajadas, silabea, se sienta y lo mira fijamente. Cuando usted se acerca al niño, éste grita y tiende los brazos hacia el padre. ¿En cuál de las siguientes edades es MÁS típico observar estos hitos del desarrollo?", "o": ["Entre 7 y 8 meses.", "Entre 5 y 6 meses.", "Entre 3 y 4 meses.", "Entre 9 y 10 meses."]}, {"n": 5, "q": "Un hombre de 35 años acude a urgencias con dolor perianal intenso y fiebre de 38°C de dos días de evolución. En la exploración presenta una masa dolorosa en fosa isquiorectal izquierda. ¿Cuál es la actitud más adecuada?", "o": ["Drenaje bajo anestesia regional.", "Realizar una TC y así valorar la vía de abordaje para su correcto tratamiento.", "Antibióticos de amplio espectro y controlar evolución.", "Realizar ecendoscopía y PAAF coagulada."]}, {"n": 6, "q": "Un varón de 54 años, con antecedentes de tabaquismo (40 paq/año) y dislipemia con mala adherencia al tratamiento, recibe atención en su domicilio por el servicio de emergencias. Presenta clínica presincopal y síntomas vegetativos asociados. En el ECG se observan ondas P cercanas al QRS, inscriptas en él y sobre la Onda T; los intervalos PP y RR son regulares, la frecuencia auricular es de 60/min y la frecuencia ventricular de 40/min, los intervalos PR variables, el QRS 0,05 seg y no presenta alteraciones en el STT. ¿Cuál es el diagnóstico más probable?", "o": ["Bloqueo AV de primer grado.", "Bloqueo AV de 2do grado Mobitz tipo 1.", "Bloqueo AV completo.", "Hemibloqueo anterior izquierdo y bloqueo AV de 2do grado Mobitz tipo 2."]}, {"n": 15, "q": "Mujer de 60 años, ex tabaquista severa y con diagnóstico de EPOC sin tratamiento habitual. Concurre a la consulta por presentar hace varios meses disnea que no le permite caminar más de 100 metros. Trae espirometría en la que presenta una relación VEF1/FVC de 65% y VEF1 de 36%. ¿Qué tratamiento inhalatorio indicaría?", "o": ["Salbutamol a demanda.", "Tiotropio cada 24 horas.", "Combinación de salmeterol con formoterol.", "Combinación de budesonide con formoterol y tiotropio."]}, {"n": 16, "q": "Una paciente de 32 años consulta por un cuadro de diarrea de 6 meses de evolución con mucorrexia y hematoquecia. ¿Cuál sería tu primer diagnóstico presuntivo?", "o": ["Colitis Ulcerosa.", "Síndrome de Intestino Irritable.", "Amebiasis.", "Colitis seudomembranosa."]}, {"n": 17, "q": "Usted le ha realizado una punción pleural a un paciente que evolucionando de una neumonía desarrolló un derrame pleural. En el líquido ha solicitado recuento de polimorfonucleares, pH y dosaje de Glucosa y LDH. ¿Para qué servirán estos resultados?", "o": ["Para diferenciar entre exudado y trasudado.", "Para descartar Insuficiencia cardíaca agregada.", "Para diagnosticar empiema e indicar el drenaje pleural.", "Para evaluar la necesidad de prolongar el tratamiento antibiótico por 21 días."]}, {"n": 18, "q": "¿Cuál es el marcador más sensible del carcinoma hepatocelular?", "o": ["Antígeno Carcinoembrionario (CEA).", "Alfa fetoproteína.", "Ca 19-9.", "Ca 125."]}, {"n": 19, "q": "En un paciente sometido a una operación proctológica que desarrolla una necrosis cutánea fulminante de los tegumentos genitales y periné. El diagnóstico más probable es:", "o": ["Gangrena parietal por bacteriodes.", "Celulitis subcutánea estreptocócica.", "Enfermedad de Fournier.", "Tétanos quirúrgico."]}, {"n": 20, "q": "Ante un paciente que presenta hiponatremia de 122mg%, Ud. tiene que corregirla. Una corrección acelerada de Sodio podría generarle al paciente:", "o": ["Accidente cerebro vascular.", "Encefalopatía hiponatrémica Aguda.", "Mielinolisis central pontina.", "Síndrome de hiponatremia refractaria."]}, {"n": 21, "q": "Una embarazada de 16 semanas de edad gestacional se presenta a la consulta de control prenatal con un urocultivo positivo para Escherichia coli, al interrogar a la paciente no manifiesta síntomas compatibles con infección urinaria. ¿Cuál es su conducta?", "o": ["Tranquiliza a la paciente y no indica tratamiento por no presentar sintomatología.", "Indica tratamiento con norfloxacina 500 mg cada 12 horas por 3 días y seguimiento con urocultivo mensual.", "Indica tratamiento con cefalexina 500 mg cada 6 horas por 7 días y repite urocultivo postratamiento.", "Repite el urocultivo y en caso de positividad indica tratamiento con nitrofurantoína 100 mg cada 6 horas por 7 días."]}, {"n": 22, "q": "Una paciente de 36 años, G1 C1, que utiliza como método anticonceptivo DIU, consulta en la guardia por presentar fiebre y dolor abdominal de 12 horas de evolución. Al examen se evidencia abdomen distendido, doloroso a la palpación superficial y profunda en forma difusa, con defensa y reacción peritoneal predominantemente en hemiabdomen inferior. Tacto vaginal: signo de Frentl positivo. Laboratorio: GB 16.200/mm³, eritrosedimentación 53 mm/hora, subunidad beta HCG negativa. Ecografía transvaginal: DIU intracavitario y abundante líquido libre en fondo de saco de Douglas. En base a su diagnóstico presuntivo, ¿cuál es la conducta más adecuada?", "o": ["Toma de cultivos, antibioticoterapia vía oral y control ambulatorio en 72 horas.", "Internación, antibioticoterapia endovenosa y cirugía de urgencia.", "Completar la evaluación con Culdocentesis (punción transvaginal de fondo de saco de Douglas).", "Internación, toma de cultivos, antibioticoterapia endovenosa y control evolutivo."]}, {"n": 23, "q": "Observa en la vía pública una persona de edad avanzada que pierde la conciencia, a los testigos que lo rodean, presumen que no se despertará y no recuerdan haberlo visto moverse. Su conducta más correcta al pasar por el lugar sería:", "o": ["Identificarse como médico, preguntar a quién está haciendo RCP para a todos los presentes que llamen al 107.", "Acercarse a ayudar, sin necesidad de identificarse como médico, continuando con RCP y activando el 107.", "Continuar con su recorrido habitual ya que el individuo está siendo asistido.", "Identificarse como médico, activar el 107, solicitar la proximidad de un DEA y abordar rápido con compresiones."]}, {"n": 24, "q": "¿A qué se refiere el término \"mortalidad materna\"?", "o": ["La mortalidad de las mujeres en edad fértil.", "La mortalidad de las embarazadas.", "La mortalidad de las mujeres durante el embarazo, parto o en los 42 días después del parto.", "La mortalidad de las mujeres en el parto."]}, {"n": 25, "q": "Un paciente de 41 años consulta a la guardia por presentar dolor intenso en la hemicara izquierda, que aumenta al probar alimentos calientes y se acompaña de mal olor y mal sabor en la boca. El paciente refiere la aparición del cuadro en la última semana y niega haber tenido fiebre. Al examen físico se presenta inflamación a nivel de la hemicara izquierda con dolor a la palpación de la región geniana. ¿Cuál es el diagnóstico más probable?", "o": ["Sialolitasis.", "Parotiditis aguda.", "Sialoadenitis aguda.", "Quiste perimaxilar."]}, {"n": 26, "q": "Lo consulta un paciente con diagnóstico reciente de carcinoma de pulmón de células pequeñas. El tumor está localizado en el lóbulo superior izquierdo y tiene un diámetro de 2 cm. En la tomografía de tórax se informan adenopatías subcarinales ipsilaterales y los demás estudios de extensión no muestran metástasis a distancia. ¿En qué estadio de la enfermedad se encuentra el paciente?", "o": ["Estadio IIB.", "Estadio I.", "Estadio IIB.", "Estadio IIIA."]}, {"n": 27, "q": "¿En relación a la clasificación postparto de Diabetes Gestacional, según el cuál es el método diagnóstico y en qué momento debe realizarse?", "o": ["Glucemia en ayunas en la 6ta semana post parto.", "Prueba de tolerancia oral a la glucosa a la 8va semana post parto.", "Hemoglobina glicosilada a los 6 meses post parto.", "Prueba de tolerancia oral a la glucosa a la 6ta semana post parto."]}, {"n": 28, "q": "Un paciente de 36 años es traído a la guardia porque sufrió un incidente de tránsito y presenta una contusión cerrada sobre el tórax. Al examen físico se encuentra lúcido, TA: 160-100 mmHg, FC: 120 lpm, FR: 36 rpm y se constata ausencia de ruidos respiratorios, ingurgitación de las venas del cuello y timpanismo en el hemitórax derecho. ¿Cuál es la conducta más adecuada?", "o": ["Videotoracoscopia.", "Radiografía de tórax.", "Punción torácica.", "Ecografía Pleural."]}, {"n": 29, "q": "Un paciente de 18 años consulta a la guardia porque presenta dolor intenso en el testículo derecho que irradia al hipogastrio y a la ingle. Refiere que comenzó en forma aguda luego de despertarse. En el examen físico se constata el testículo derecho aumentado de tamaño, doloroso al tacto y el Signo de Prehn es negativo. ¿Cuál es el diagnóstico más probable?", "o": ["Varicocele trombosado.", "Hernia Inguinal.", "Orquiepididimitis aguda.", "Torsión testicular."]}, {"n": 30, "q": "Un paciente de 72 años lo consulta por haber presentado un episodio de rectorragia hace 5 días. No tiene antecedentes patológicos relevantes. Se realiza una videocolonoscopía que informa: presencia de un pólipo único pediculado en el sigmoides, de unos 25 mm de diámetro, que tiene una ulceración en su cúspide. ¿Cuál es la conducta más adecuada?", "o": ["Polipectomía endoscópica y estudio anatomopatológico.", "Videocolonoscopía a los 3 meses y cirugía si aumenta de tamaño.", "Seguimiento clínico.", "Fotocoagulación del pólipo."]}, {"n": 31, "q": "Un paciente de 70 años lo consulta porque presenta ictericia de piel y mucosas de comienzo insidioso. La ecografía abdominal informa: dilatación de la vesícula biliar con microlitiasis; vía biliar intra y extrahepática dilatada sin observarse cálculos en su interior y el páncreas presenta ecogenicidad heterogénea sin evidenciarse una masa dominante. En un laboratorio de hace 3 días presenta patrón de colestasis. ¿Cuál de los siguientes estudios solicitaría en primer lugar para estudiar la vía biliar?", "o": ["Colangiografía por resonancia nuclear magnética.", "Colangiopancreatografía retrógrada endoscópica.", "Colangiografía transparietal.", "Tomografía de abdomen con contraste oral y endovenoso."]}, {"n": 32, "q": "Una paciente de 53 años operada por un cáncer de mama hace 6 años concurre a la consulta presentando disnea clase funcional III. En la radiografía de tórax se observa derrame pleural en la base del hemitórax derecho. Se realiza punción pleural guiada por ecografía y en el estudio no se logró demostrar infección activa ni presencia de células neoplásicas. ¿Qué estudio solicitaría para continuar evaluando a la paciente?", "o": ["Videotoracoscopia.", "Toracotomía.", "Punción biopsia pleural.", "TAC de tórax con contraste endovenoso."]}, {"n": 33, "q": "Un paciente de 41 años sin antecedentes psiquiátricos, casado con 3 hijos, empresario, concurre a la consulta quejándose de padecer desde hace 3 meses insomnio todas las noches. Refiere falta de interés en su trabajo y en la gente y poco deseo sexual. Presenta un aumento de peso del 15% y expresa algunas ideas de sin sentido de la vida, aunque sin plan suicida. ¿Cuál es el diagnóstico más probable?", "o": ["Trastorno bipolar.", "Desorden esquizoafectivo.", "Esquizofrenia.", "Episodio depresivo mayor."]}, {"n": 34, "q": "Una paciente de 45 años concurre al centro de salud a realizar un control de salud. No tiene antecedentes personales ni familiares de relevancia. Al momento de la consulta se encuentra asintomática. Trae un laboratorio solicitado por otro colega que se hizo hace un mes que informa: Hb: 12.5 g/dl Hto: 42% GB 7500/mm³ Glucemia: 138 mg/dl Urea: 40 mg/dl Creatinina: 1 mg/dl Colesterol total 200 mg/dl LDL 100 mg/dl TG 190 mg/dl HDL 58 mg/dl. En el examen físico presenta TA: 130-80 mmHg Peso: 78 kg Talla: 156 cm IMC: 32 kg/m². ¿Cuál es la conducta más adecuada?", "o": ["Comunicar diagnóstico de diabetes y comenzar con cambios en el estilo de vida.", "Solicitar una prueba de tolerancia oral a la glucosa.", "Solicitar una nueva glucemia en ayunas.", "Comunicar diagnóstico de diabetes e iniciar tratamiento con Metformina."]}, {"n": 35, "q": "Los estudios epidemiológicos observacionales son una adecuada fuente de información clínica. De ellos, ¿cuál es el que establece con más fuerza la asociación entre factores de riesgo y el evento en estudio?", "o": ["Los estudios de caso control siempre y cuando no haya sesgos de selección o información.", "Los estudios de cohortes porque la exposición se asigna al azar.", "Los estudios de cohortes prospectivos porque la exposición siempre precede al evento.", "Los estudios de corte transversal siempre y cuando se hayan ajustado todas las posibles variables confusioras."]}, {"n": 36, "q": "Un paciente de 40 años asintomático tiene antecedentes familiares de poliposis colónica familiar. Su médico decide realizarle una videocolonoscopía para detectar en forma temprana el cáncer de colon. ¿Qué tipo de práctica preventiva se está realizando?", "o": ["Prevención terciaria.", "Prevención secundaria.", "Prevención cuaternaria.", "Prevención primaria."]}, {"n": 37, "q": "Un paciente de 35 años lo consultó para realizar un apto físico para el trabajo. Fuma 11 paq/año. No tiene ningún otro antecedente personal de relevancia. Refiere que sabe que el cigarrillo le hace mal, pero que por el momento no quiere dejar de fumar porque está con mucho trabajo y necesita estar concentrado. ¿En qué etapa de Prochaska se encuentra y cuál sería la mejor intervención para él en esa etapa?", "o": ["Precontemplativo - Consejo breve antitabáquico y parches de nicotina 3 de 20 cm² por día.", "Contemplativo - Consejo breve antitabáquico.", "Precontemplativo - Consejo breve antitabáquico.", "Precontemplativo - Parches de nicotina 1 de 20 cm² por día."]}, {"n": 38, "q": "Consulta a la guardia un paciente de 68 años por fiebre de una semana de evolución, asociada a anorexia y cefalea retroocular. Refiere 2 episodios de gingivorragia en los últimos 3 días. Tiene antecedentes de DBT insulinorrequiriente y estuvo de viaje hace 2 semanas en Misiones. Al examen físico no presenta alteraciones. En el laboratorio se observa: Hto 38%, GB 4400/mm³ y plaquetas 160000/mm³. ¿Cuál es la conducta más adecuada?", "o": ["Tratamiento sintomático ambulatorio y control a las 48hs si continúa con fiebre.", "Internación en terapia intensiva.", "Solicitar test serológico para confirmar Dengue, alta y control ambulatorio en 24hs.", "Internación en sala general."]}, {"n": 39, "q": "Un paciente de 32 años consulta a la guardia por fiebre y disnea progresiva CF II-III de 20 días de evolución, asociada a tos seca. Tiene diagnóstico de HIV positivo hace 2 años sin tratamiento actualmente por intolerancia. Al examen físico se encuentra en buen estado general, afebril y presenta a la auscultación pulmonar crepitantes escasos en campo medio bilaterales. Se realiza laboratorio que informa: Hto 40%, GB 2500/mm³, LDH 1300 UI/L y EAB: pH 7.45 pCO2 32 mmHg pO2 67 mmHg. La radiografía de tórax muestra un Infiltrado Intersticial perihiliar bilateral. ¿Cuál es el tratamiento más adecuado?", "o": ["Trimetoprima-Sulfametoxazol.", "Amoxicilina Ácido Clavulánico.", "Amoxicilina más ciprofloxacina.", "Levofloxacina."]}, {"n": 40, "q": "Un paciente de 65 años consulta para control de salud. Refiere antecedentes de hipertensión arterial sin tratamiento. Trae los siguientes estudios complementarios: orina de 24 hs microalbuminuria 600 mg/24 hs y un ecocardiograma que informa hipertrofia del ventrículo izquierdo. Al examen físico: TA 160-90 mmHg e IMC 28 kg/m². ¿Cuál es el fármaco más adecuado para este paciente?", "o": ["Beta Bloqueantes.", "Bloqueantes de los receptores de angiotensina II.", "Bloqueantes cálcicos.", "IECA."]}, {"n": 41, "q": "Concurre a control una mujer de 31 años, G1, cursando embarazo de 36 semanas, con diagnóstico de hipertensión inducida por el embarazo en tratamiento. Se constata un registro tensional de 140/90 mmHg. Se encuentra asintomática. Se le solicita proteinuria al acecho cuyo resultado es 2 cruces y se decide su internación. ¿Cuál es la conducta más adecuada?", "o": ["Observación, Ecografía obstétrica con Doppler fetal y laboratorio completo con proteinuria de 24 horas.", "Cesárea abdominal y sulfato de magnesio.", "Observación, Sulfato de Magnesio, Ecografía obstétrica con Doppler fetal y laboratorio completo con proteinuria de 24 horas.", "Inducción del trabajo de parto."]}, {"n": 42, "q": "Un paciente de 45 años es traído a la guardia por haber sufrido un incidente de tránsito. Al examen físico se encuentra hemodinámicamente estable y presenta dolor abdominal localizado en el hipocondrio izquierdo sin signos de irritación peritoneal. Se realiza ecografía abdominal hallándose un hematoma esplénico subcapsular con parénquima y vasos hiliares indemnes. ¿Cuál es la conducta más adecuada?", "o": ["Drenaje percutáneo del hematoma esplénico.", "Esplenectomía de urgencia.", "Realizar tomografía computada con contraste endovenoso y luego laparotomía para drenaje del hematoma.", "Control hemodinámico y seguimiento por tomografía y/o ecografía."]}, {"n": 43, "q": "Un paciente de 76 años ingresa con hematemesis, melena, sin descompensación hemodinámica. Se realiza videoendoscopía digestiva alta que informa úlcera con coágulo adherente sin vaso visible. ¿A qué clasificación de Forrest pertenece?", "o": ["IIC.", "III.", "IIb.", "IA."]}, {"n": 44, "q": "Paciente de 35 años residente de Buenos Aires, Argentina. Ingresa con una lesión con placa necrótica con bordes elevados dolorosa en mano secundaria a, según refiere, picadura de una araña. Según la descripción, ¿de qué araña sospecha?", "o": ["Phoneutria.", "Loxosceles Laeta.", "Latrodectus Mactans.", "Steatoda Grossa."]}, {"n": 45, "q": "Mujer de 90 años con antecedentes de enfermedad de Alzheimer, dependencia para todas las actividades básicas de la vida diaria y disfagia ocasional a líquidos. Es llevada a la guardia por presentar en las últimas horas delírium hipoactivo, taquipnea, taquicardia y temperatura axilar de 37.3°C. La exploración física es dificultosa y no aporta más datos destacables. Ante la radiografía de tórax que se muestra, ¿Cuál es el diagnóstico más probable?", "o": ["Neumonía broncoalveolar aguda.", "Tromboembolismo pulmonar.", "Neumonía intersticial aguda.", "Edema agudo de pulmón."]}, {"n": 46, "q": "Niño de 5 años diagnosticado de insuficiencia renal crónica. Acude a urgencias por vómitos, malestar general y palpitaciones. Se realiza un electrocardiograma donde detecta elevación de ondas T y análisis sanguíneo con niveles de potasio de 6.0 mEq/L. Se decide la administración inmediata de gluconato cálcico. ¿Cuál es el objetivo de este tratamiento?", "o": ["Favorecer el desplazamiento de potasio desde el espacio plasmático al espacio intracelular.", "Quelar el potasio circulante para favorecer su eliminación hepática.", "Antagonizar la acción del potasio sobre la membrana de la célula miocárdica.", "Quelar el potasio circulante para favorecer su eliminación renal. 47) Mujer de 67 años, obesa, que acude a urgencias por dolor abdominal en cuadrante superior derecho del abdomen, fiebre de 39.5°C y orinas muy oscuras. Ante este cuadro se debería sospechar en primer lugar: A. Colecistitis aguda litiásica. B. Colecistitis aguda alitiásica. C. Colangitis ascendente. D. Coledocolitiasis."]}, {"n": 48, "q": "Un hombre de 70 años consulta por dolor lumbar no irradiado de 1 semana de duración, de intensidad progresiva, acompañado de marcada limitación de la movilidad del raquis y febrícula. La radiografía de columna lumbar no muestra alteraciones. ¿Qué diagnóstico deberíamos descartar en primer lugar y con qué técnica?", "o": ["Espondilodiscitis piógena con resonancia magnética (RM).", "Aplastamiento vertebral con tomografía computarizada (TC).", "Metástasis óseas con gammagrafía ósea con tecnecio.", "Hiperostosis anquilosante vertebral con radiografía de columna dorsolumbar."]}, {"n": 49, "q": "Mujer de 67 años con antecedentes de dislipemia, que acude a urgencias por un cuadro de disuria y polaquiuria seguido de fiebre, escalofríos y deterioro del estado general. A su llegada impresiona de gravedad y está taquicárdica, taquipneica, con tensión arterial 60/40 mmHg y temperatura de 39°C. ¿Qué medida entre las siguientes NO estaría incluida en el manejo INICIAL?", "o": ["Extracción de hemocultivos.", "Administración de fluidos.", "Perfusión intravenosa de dobutamina.", "Medición de lactato sérico."]}, {"n": 50, "q": "Paciente con insuficiencia cardíaca crónica en quien detectamos unas ondas “v” prominentes en el pulso venoso yugular y en la auscultación cardíaca un soplo holosistólico en el área del apéndice xifoides que se acentúa con la inspiración profunda. ¿Cuál es la valvulopatía que sugiere esta exploración física?", "o": ["Estenosis aórtica.", "Insuficiencia pulmonar.", "Insuficiencia mitral.", "Insuficiencia tricuspídea."]}, {"n": 51, "q": "Mujer de 26 años que consulta por sensación de debilidad generalizada que se ha instaurado progresivamente en el curso de tres semanas, haciéndose especialmente intensa en los últimos dos días. Refiere desde hace un par de años episodios de dolor articular en las manos que han precisado de la toma de antiinflamatorios, así como la aparición de alguna lesión eritematosa de causa no aclarada en la zona del escote, principalmente en verano. En la exploración física destaca únicamente una palidez cutáneomucosa evidente y una frecuencia cardíaca de 100 lpm. En el hemograma destaca: Hb 6 g/dl, Hto 22%, VCM 105 fl., 3.420 leucocitos/mm³ (2300 neutrófilos/mm³, 800 linfocitos/mm³, 250 monocitos/mm³, 50 eosinófilos/mm³, 20 basófilos/mm³), plaquetas 170.000/mm³. En la bioquímica: AST 30 UI/L, ALT 35 UI/L, GGT 59 UI/L, fosfatasa alcalina 105 UI/L, LDH 490 UI/L, urea 20 mg/dL, creatinina 0.8 mg/dL. Teniendo en cuenta la información disponible, indique cuál de los siguientes parámetros analíticos adicionales necesitaría conocer para poder tomar la decisión inmediata más apropiada:", "o": ["Anticuerpos anti-DNA.", "Vitamina B12.", "Anticuerpos antinucleares.", "Test de Coombs directa."]}, {"n": 52, "q": "Un paciente es traído a urgencias desde un incendio producido dentro de una nave cerrada donde había espumas de poliuretano. Está consciente, pero presenta creciente torpeza mental, cefalea e intensa disnea. La saturación de oxígeno mediante oximetría es del 92% y el ácido láctico capilar es de 8 mEq/L. ¿Qué tratamiento específico considera más adecuado?", "o": ["Ventilación con cámara hiperbárica.", "Administración de oxígeno mediante mascarilla tipo Venturi al 50%.", "Fluidoterapia con infusión de solución salina fisiológica a 21 ml/h.", "Administración de hidroxicobalamina intravenosa."]}, {"n": 53, "q": "Una mujer de 22 años presenta una parada cardíaca súbita con un ritmo que se considera susceptible de desfibrilación. Se están realizando compresiones torácicas y ventilaciones, se ha dado una descarga con el desfibrilador y se ha canalizado una vía venosa periférica. ¿Cuál de las siguientes actuaciones será correcta a continuación?", "o": ["Administrar 300 mg de amiodarona intravenosa.", "Administrar 150 mg de amiodarona intravenosa.", "Administrar 1 mg de adrenalina intravenosa.", "Administrar 7 mg de atropina intravenosa."]}, {"n": 54, "q": "Hombre de 52 años que consulta por dolor centrotorácico desgarrador de 30 minutos de duración. A la exploración está inquieto y sudoroso. La tensión arterial es de 190/110 mmHg en ambos brazos. A la auscultación no hay soplos cardíacos ni estertores crepitantes. El electrocardiograma está en ritmo sinusal a 90 latidos por minuto sin alteraciones de la repolarización. En la angioTC torácica se observa la imagen que se adjunta. ¿Cuál es el diagnóstico más probable?", "o": ["Pseudoaneurisma de aorta.", "Disección de aorta tipo A de Stanford.", "Úlcera penetrante arteriosclerótica.", "Hematoma intramural maligno."]}, {"n": 55, "q": "Un paciente de 22 años sin antecedentes patológicos significativos, pescador. Vive en zona de islas en el delta del Río Paraná. Fumador de 10 paquetes/año. Consulta por cuadro de 3 días de evolución de fiebre de 39 grados y mialgias. Al examen físico presenta inyección conjuntival. El resto del examen físico no tiene alteraciones de jerarquía. En el laboratorio presenta 22000 GB con 80% de neutrófilos, Hto 40% y 180000 plaquetas, uremia y creatinina discretamente elevada, eritrosedimentación 50 mm en la primera hora, CPK elevada y orina con hematuria microscópica. En base al cuadro clínico deberíamos sospechar:", "o": ["Paludismo.", "Dengue Hemorrágico.", "Leptospirosis.", "Fiebre Hemorrágica Argentina."]}, {"n": 56, "q": "Un paciente de 30 años, sin antecedentes médicos de jerarquía. Trabaja como repositor en un supermercado. Niega viajes o consumo de sustancias tóxicas. Ha estado de campamento y refiere haber tomado agua no potable. Consulta por cuadro de 3 semanas de deposiciones diarreicas, acuosas, abundantes y fétidas sin moco ni sangre. El estudio de la materia fecal revela abundantes quistes de Giardia Lamblia. ¿Cuál es el tratamiento que debería indicarle?", "o": ["Vancomicina parenteral.", "Ciprofloxacina vía oral.", "Metronidazol vía oral.", "Vancomicina vía oral."]}, {"n": 57, "q": "Una paciente mujer de 41 años adicta a drogas parenterales, con diagnóstico de infección por VIH desde hace 20 años, con mala adherencia al tratamiento antirretroviral. Últimos CD4 50 mm³. Ingresó a la guardia por convulsiones tónicoclónicas generalizadas. La TAC de cráneo revela múltiples lesiones en ambos hemisferios cerebrales subcorticales y en ganglios basales con refuerzo en anillo a la administración de contraste y edema perilesional. ¿Cuál es el diagnóstico más probable?", "o": ["Toxoplasmosis cerebral.", "Meningococcemia.", "Pneumocistis Jiroveci en Sistema Nervioso.", "Meningoencefalitis por Herpes simplex."]}, {"n": 58, "q": "¿Cuál de los siguientes antibióticos utilizaría para el tratamiento de una pielonefritis aguda en una mujer que está cursando 14 semanas de gestación?", "o": ["Doxiciclina oral.", "Amikacina IM.", "Ceftriaxona EV.", "Ciprofloxacina endovenosa."]}, {"n": 59, "q": "Una mujer de 65 años, diabética tipo 2. En tratamiento con gliclazida y metformina. Presenta un cuadro de 7 días de evolución de fiebre y otalgia. Presenta secreción purulenta en el conducto auditivo externo. Se encuentra medicada con amoxicilina clavulánico desde hace 3 días sin mejoría. En las últimas horas presentó episodio de convulsión tónico clónica generalizada. Al examen físico se constata parálisis facial central. NO presenta antecedentes de convulsiones previamente. ¿Cuál es la conducta correcta?", "o": ["Agregar corticoides al tratamiento antibiótico.", "Derivar para consulta con otorrinolaringología en forma ambulatoria.", "Agregar Vancomicina al esquema antibiótico por sospecha de Neumococo resistente a la penicilina.", "Solicitar TAC de Cráneo de urgencia por la posibilidad de Absceso cerebral."]}, {"n": 60, "q": "Paciente de 25 años, sin antecedentes de importancia, ingresa a la guardia del hospital con una herida de arma blanca en el hemitórax derecho. Usted le realiza una radiografía de tórax y constata que tiene un hemoneumotórax. El cirujano de guardia le coloca un tubo de tórax. Durante las primeras 4 horas, usted observa que el tubo de tórax tiene un débito de 400 ml por hora de sangre roja rutilante.", "o": ["Se solicita un hematocrito.", "Le clampa el tubo de tórax.", "Le transfunde una unidad de glóbulos rojos.", "Llama al cirujano urgente."]}, {"n": 61, "q": "El cáncer de colon es una de las formas más comunes de cáncer en todo el mundo. En general, este cáncer tiene un desarrollo lento y presenta diferentes formas de manifestación según su ubicación. ¿En qué ubicación del cáncer de colon se relaciona con la anemia ferropriva?", "o": ["Colon izquierdo.", "Colon derecho.", "Colon transverso.", "Recto."]}, {"n": 62, "q": "Paciente de 32 años sin antecedentes relevantes que ingresa a la guardia del hospital por un cuadro de 12 horas de evolución, caracterizado por dolor en la fosa ilíaca derecha de intensidad 8/10. ¿Cuál de los siguientes signos le indicaría a usted que debe comunicarse con el cirujano de urgencia?", "o": ["Vómitos a repetición.", "Descompresión positiva.", "Leucocitosis.", "Fiebre."]}, {"n": 63, "q": "En el embarazo de bajo riesgo y sin antecedentes patológicos, el tamizaje para diabetes gestacional con prueba de tolerancia oral a la glucosa (PTOG) debe realizarse entre las:", "o": ["18 y 22 semanas de gestación.", "12 y 16 semanas de gestación.", "24 y 28 semanas de gestación.", "30 y 36 semanas de gestación."]}, {"n": 64, "q": "La aplicación de Gammaglobulina anti-D a puérperas Rh negativas con hijo Rh positivo debe realizarse dentro de las primeras:", "o": ["Dentro de las primeras 48 horas del parto.", "Dentro de las primeras 72 horas del parto.", "Dentro de las primeras 2 horas del parto.", "Dentro de las primeras 24 horas del parto."]}, {"n": 65, "q": "¿Cuál de las siguientes inmunizaciones se halla contraindicada durante el embarazo?", "o": ["Influenza.", "Hepatitis A.", "Rubéola y sarampión (doble viral).", "Hepatitis B."]}, {"n": 66, "q": "Paciente trabajador rural del sur de la provincia de Santa Fe, que presenta un síndrome febril. Examen físico como datos relevantes: inyección conjuntival, eritema facial, adenomegalias latero cervicales indoloras. Laboratorio que informa: Glóbulos blancos 2400; VES 2 mm/h y plaquetas 80.000. ¿En qué patología podría estar pensando, considerando datos clínicos, de laboratorio y epidemiológicos?", "o": ["Fiebre hemorrágica argentina.", "Leptospirosis.", "Fiebre amarilla.", "Dengue."]}, {"n": 67, "q": "¿Cuál de los siguientes AINES se encuentra fuera del mercado en varios países del mundo por el considerarse el riesgo potencialmente alto de aparición de agranulocitosis?", "o": ["Ketorolac.", "Ibuprofeno.", "Dipirona.", "Celecoxib."]}, {"n": 68, "q": "Una niña de 3 años y medio ha padecido dos neumonías bacterianas. Es llevada ahora a la consulta por presentar fiebre y tos matinal. La radiografía de tórax muestra infiltrados difusos y la de senos paranasales opacificación de ambos senos maxilares. ¿Cuál es el examen complementario más apropiado para esta paciente?", "o": ["Test del sudor.", "Cultivo de secreción de senos paranasales.", "Hemograma completo y dosaje de gammaglobulinas.", "Tomografía computada de senos paranasales."]}, {"n": 69, "q": "La droga de elección para el tratamiento de la otitis media aguda en pediatría es:", "o": ["Amoxicilina.", "Cefuroxima.", "Amoxicilina-clavulánico.", "Ceftriaxona."]}, {"n": 70, "q": "Paciente mujer de 55 años, consulta por cuadro de 72 horas de dolor abdominal en hipocondrio derecho, vómitos alimenticios y sensación subjetiva de fiebre. Al examen físico: TA 125/85 mmHg, FC 100 lpm, FR 15 rpm, T: 37.5°C. Abdomen: ruidos hidroaéreos positivos, blando, depresible, doloroso en hipocondrio derecho. Sin defensa ni contractura. Puño percusión negativa bilateral. No se palpan organomegalias. ¿Qué estudio/s complementario/s solicitaría en primera instancia?", "o": ["Laboratorio con hemograma completo, glicemia, ionograma, función renal, bilirrubina total y fraccionada, TGO, TGP, FAL, GGT, tiempos de coagulación.", "Laboratorio con hemograma completo, glicemia, ionograma, función renal, bilirrubina total y fraccionada, TGO, TGP, FAL, GGT, tiempos de coagulación y ecografía abdominal.", "Tomografía computarizada de abdomen y pelvis con contraste oral y mismo laboratorio.", "Colangiopancreatografía retrógrada endoscópica."]}, {"n": 71, "q": "Paciente presenta ecografía compatible con colecistitis aguda. ¿Qué parámetro ecográfico orienta a este diagnóstico?", "o": ["La presencia de litiasis múltiple.", "Un lito con tamaño de 5 mm o más.", "El engrosamiento de la pared de la vesícula.", "Presencia de barro biliar."]}, {"n": 72, "q": "Usted sospecha cuadro de diverticulitis aguda. ¿Qué estudio/s complementario/s solicitaría en primera instancia?", "o": ["Tomografía computarizada de abdomen y pelvis con contraste oral y endovenoso y laboratorio con hemograma completo, glicemia, ionograma, función renal, bilirrubina total y fraccionada y tiempos de coagulación.", "Tomografía computarizada de abdomen y pelvis sin contraste por sospecha de falla renal aguda.", "Colonoscopía de urgencia.", "Ecografía abdómino-renal."]}, {"n": 73, "q": "Paciente varón de 60 años con diagnóstico reciente de adenocarcinoma moderadamente diferenciado de colon, localizado en colon descendente, sin diseminación de proceso neoplásico. ¿Qué tratamiento de primera línea realizaría?", "o": ["Radioterapia combinada con quimioterapia y posterior resección quirúrgica.", "Resección quirúrgica solo en caso de haber signos clínicos de oclusión intestinal.", "Resección quirúrgica y tratamiento quimioterápico según resultado del estudio.", "Quimioterapia."]}, {"n": 74, "q": "Un estudio de diseño observacional analítico en el cual los sujetos son seleccionados sobre la base de la presencia de una enfermedad o efecto y, posteriormente, se compara la exposición de cada uno de estos grupos a uno o más factores o características de interés es un estudio de…", "o": ["Estudio de corte transversal.", "Estudio ecológico.", "Estudio de casos y controles.", "Estudio de cohorte."]}, {"n": 75, "q": "Usted se encuentra realizando tareas de medicina rural en el norte de la provincia de Santa Fe. Los habitantes de la región carecen de agua potable y se ha instalado desde hace una semana un brote de Vibrio cholerae. ¿Qué manifestación clínica es la más frecuente en un paciente que presenta cuadro infeccioso por este germen?", "o": ["Diarrea acuosa abundante.", "Diarrea mucosanguinolenta abundante.", "Cefalea y mialgias.", "Síndrome meníngeo de início súbito."]}, {"n": 76, "q": "¿De qué estrategia/s depende el control del contagio de brucelosis en los seres humanos?", "o": ["La eliminación de la enfermedad en los animales.", "Del correcto aislamiento respiratorio de los pacientes con sospecha de brucelosis.", "Del tratamiento específico de los casos con ceftriaxona endovenosa durante 14 días.", "De la colocación de la vacuna antibrucelosis a los trabajadores vinculados al ganado."]}, {"n": 77, "q": "¿Cuál es la norma más importante y necesaria para prevenir las infecciones cruzadas en una Unidad de Cuidados Intensivos?", "o": ["El lavado de manos entre cada paciente.", "El uso de detergente y lavandina para limpiar las superficies.", "La limpieza de las superficies cada 4 horas.", "La utilización de guantes estériles al examinar a cada paciente."]}, {"n": 78, "q": "¿Qué comorbilidades hacen a un paciente con dengue un paciente de riesgo?", "o": ["Pacientes embarazadas, menores de 3 meses o más de 65 años, obesos, diabéticos, cardiopatía congénitas o adquiridas, riesgo social.", "Pacientes con embarazo gemelar en cualquier trimestre, mayores de 65 años, obesos.", "Pacientes que viven a más de 10 cuadras de su centro de salud de referencia.", "Pacientes embarazadas en segundo trimestre, menores de 3 meses de vida, obesos."]}, {"n": 79, "q": "¿Qué signo/s y síntomas de alarma debemos buscar en un paciente con dengue?", "o": ["Dolor abdominal intenso y continuo, vómitos persistentes, compromiso de serosas, alteración del sensorio, hepatomegalia.", "Fiebre persistente más allá del quinto día, compromiso de serosas, alteración del sensorio.", "Alteración del hepatograma, dolor abdominal en hipocondrio derecho, sangrado gingival.", "Exantema con compromiso de mucosas, fiebre persistente más allá del décimo día."]}, {"n": 80, "q": "¿Cuál de los siguientes procedimientos demostró disminuir la mortalidad en un paciente con sepsis/shock séptico?", "o": ["Toma de hemocultivos.", "La indicación de antibioticoterapia empírica dentro de la primera hora desde el arribo al hospital.", "Uso de inotrópicos antes del inicio de la reanimación con fluidoterapia.", "Definir el foco de infección dentro de la primera hora de la atención."]}, {"n": 81, "q": "¿Cuál sería una contraindicación para el uso de betabloqueantes?", "o": ["Vasculopatía periférica en paciente diabético.", "Infarto agudo de miocardio reciente.", "Bradicardia sinusal con frecuencia cardíaca de 40 latidos por minuto.", "Bloqueo completo de rama derecha."]}, {"n": 82, "q": "¿Cuál de las siguientes arritmias se relaciona con el riesgo de muerte súbita?", "o": ["Taquicardia sinusal.", "Bloqueo auriculoventricular de segundo grado.", "Extrasístoles supraventriculares.", "Fibrilación ventricular."]}, {"n": 83, "q": "Paciente de 23 años. Ingresa por accidente en vía pública moto-auto. Presenta al examen físico otorragia. ¿Qué lesión debemos sospechar en este paciente?", "o": ["Hematoma subdural.", "Fractura de base de cráneo.", "Fractura de macizo facial.", "Hematoma extradural."]}, {"n": 84, "q": "En un paciente con shock hipovolémico, ¿Cuál es la vía de elección para la reposición de volumen?", "o": ["Catéter largo y fino en vía periférica.", "Catéter corto y grueso en una vía periférica.", "Catéter central en vena subclavia.", "Catéter central en vena femoral."]}, {"n": 85, "q": "¿Cuál de las siguientes alteraciones en el ECG puede presentar un paciente con tromboembolismo de pulmón?", "o": ["Ritmo Idioventricular.", "Ritmo Idioventricular.", "Bradicardia sinusal.", "Bloqueo de rama derecha."]}, {"n": 86, "q": "Paciente ingresa a guardia por intoxicación por opioides en contexto de intento autolítico. ¿Qué fármaco contrarresta sus efectos?", "o": ["Deferoxamina.", "D-penicilamina.", "Naloxona.", "Flumazenil."]}, {"n": 87, "q": "¿Cuál sería la primera línea de tratamiento en un paciente con convulsiones?", "o": ["Benzodiazepinas.", "Fenitoína.", "Fenobarbital.", "Tiopental."]}, {"n": 88, "q": "Usted recibe en la guardia a Joaquín de 10 años; quien presentó un accidente vehicular. El niño articula sonidos inespecíficos, sólo abre los ojos ante estímulos dolorosos y se encuentra en postura de decorticación. ¿Cuál sería la conducta inicial con este paciente?", "o": ["Tener una conducta expectante durante 4 horas.", "Trasladarlo hasta tomografía para hacer un escaneo completo.", "Colocarle una vía periférica y administrarle analgésicos.", "Realización de intubación endotraqueal y ventilación mecánica."]}, {"n": 89, "q": "Usted atiende en el control de rutina a un bebé de 10 días de vida nacido a término y con peso adecuado para la edad gestacional. El embarazo fue controlado y, en el examen físico, se observa ictericia generalizada. Del interrogatorio surge que presenta acolia desde el nacimiento. El laboratorio demuestra alteración de los niveles de bilirrubina con elevación de la fracción directa. ¿Cuál es el diagnóstico más probable?", "o": ["Hepatitis neonatal.", "Incompatibilidad de grupo sanguíneo.", "Deficiencia de glucosa 6 fosfato deshidrogenasa.", "Atresia biliar."]}, {"n": 90, "q": "Paciente de 5 años presenta disuria, dolor abdominal y 2 registros febriles. Al examen físico se encuentra afebril y en buen estado general. Se decide realizar urocultivo e iniciar tratamiento antibiótico. ¿Qué droga debe administrársele?", "o": ["Trimetoprim sulfametoxazol.", "Claritromicina.", "Ciprofloxacina.", "Penicilina."]}, {"n": 91, "q": "Concurre al consultorio paciente de 13 meses, que es traído por su madre por presentar diarrea de 3 meses de evolución. Refiere que son heces pastosas, malolientes, y que presenta las mismas 5 a 6 veces por día. Le indicaron en varias ocasiones antiparasitarios y dieta hipofermentativa, pero no resolvieron el problema. Se alimenta con pecho materno y alimentación complementaria. Como antecedentes manifiesta que presentó bronquiolitis en 3 ocasiones y una vez neumonía que requirieron internación. Actualmente presenta peso y talla en Pc 3-10. De acuerdo a la sospecha diagnóstica, ¿qué estudio complementario debería solicitar?", "o": ["Orina completa.", "Ecografía abdominal.", "Endoscopía con biopsiaintestinal.", "Test del sudor."]}, {"n": 92, "q": "¿Qué significa que el percentilo 75 de longitud corporal para niñas de 6 meses es de 67 cm?", "o": ["25% de las niñas de 6 meses de edad miden menos de 67 cm.", "10% de las niñas de 6 meses de edad miden más de 67 cm.", "75% de las niñas de 6 meses de edad miden más de 67 cm.", "25% de las niñas de 6 meses de edad miden menos de 67 cm."]}, {"n": 93, "q": "Se atiende por guardia a un paciente de 3 años, que ingirió comprimidos de clonazepam que encontró en una mesa. El examen de orina fue positivo para benzodiacepinas, se realizó lavado gástrico y se indica plan de hidratación parenteral. Sin embargo, la mejoría es escasa y cursa en depresión respiratoria. ¿Cuál es el antídoto recomendado en este caso?", "o": ["Flumazenil.", "Atropina.", "N-acetilcisteína.", "Naloxona."]}, {"n": 94, "q": "Paciente de 4 meses es traído por su madre a la guardia porque presenta tos y dificultad respiratoria desde hace 24 horas. Antecedentes: nacido con 35 semanas de edad gestacional, no acudió a control de salud desde su alta, se alimenta con fórmula de inicio y es miembro de una familia numerosa. Se diagnostica bronquiolitis grave. ¿ Cuál es considerado un factor de riesgo para este diagnóstico?", "o": ["Vacunación incompleta.", "Ausencia de lactancia materna.", "Hacinamiento.", "Prematurez."]}, {"n": 95, "q": "Paciente nacido a término con peso adecuado para la edad gestacional. Presenta neurodesarrollo acorde a la edad y no tiene antecedentes patológicos de relevancia. En la evaluación actual logra caminar de la mano y da algunos pasos, dice “mamá”, ”papá” y “agua”, es capaz de tomar objetos con la mano con movimiento de pinza de índice y pulgar. ¿Qué edad tiene el paciente?", "o": ["12 meses.", "9 meses.", "8 meses.", "8 meses."]}, {"n": 96, "q": "¿Cuál es la prevalencia de Hipertensión Arterial en Argentina?", "o": ["36%.", "28%.", s?", "o": ["Escala de Ranson al ingreso y a las 48 horas", "Niveles de amilasa sérica", "Ecografía abdominal seriada", "Hemograma completo"]}, {"n": 51, "q": "Paciente fumador crónico con dolor epigástrico irradiado a la espalda, pérdida de peso, masa palpable y CA 19-9 elevado. TC: masa en la cabeza del páncreas. ¿Cuál es el factor más importante para determinar la elegibilidad para cirugía de Whipple?", "o": ["Tamaño del tumor", "Niveles de CA 19-9", "Estado de resecabilidad en la TC", "Presencia de dolor abdominal"]}, {"n": 52, "q": "Un paciente de 56 años acude a la consulta por dolor anal de comienzo súbito tras un episodio de estreñimiento. No tiene conductas sexuales de riesgo, no presenta fiebre y se queja de que cuando va a hacer deposiciones el dolor es \"lo peor\". A la exploración, no se observan alteraciones externas, pero la intentar hacer un tacto rectal es imposible hacer progresa el dedo por las quejas del paciente. De entre los siguientes, el diagnóstico más probable y la opción terapéutica correcta son:", "o": ["Fisura anal aguda – tratamiento conservador con baños de asiento, analgésicos y fibra", "Absceso perianal – drenaje quirúrgico urgente", "Hemorroides internas – ligadura con bandas elásticas", "Proctitis infecciosa – tratamiento antibiótico"]}, {"n": 53, "q": "Una paciente de 43 años consulta por disfagia, regurgitación, adelgazamiento y tos de varios meses de evolución. Se le solicita una serie esófago gastroduodenal que evidencia una ausencia de la cámara aérea gástrica, nivel hidroaéreo en el esófago distal. ¿Cuál es el diagnóstico más probable y la conducta más adecuada?", "o": ["Acalasia – solicitar manometría esofágica y endoscopia digestiva alta; tratamiento endoscópico", "Cáncer de esófago – biopsia y esofagectomía", "Reflujo gastroesofágico – tratamiento con inhibidores de bomba de protones", "Espasmo esofágico difuso – tratamiento con calcioantagonistas"]}, {"n": 54, "q": "Si tiene que administrar a un paciente 1200 cc de solució na", "Hemograma completo"]}, {"n": 68, "q": "Una persona llega a urgencias con síntomas de envenenamiento por cianuro. ¿Cuál es el antídoto recomendado en esta situación?", "o": ["Pralidoxima", "Hidroxocobalamina", "Naloxona", "Atropina"]}, {"n": 69, "q": "En la intoxicación por metanol, ¿cuál es el mecanismo principal por el cual se produce la acidosis metabólica grave?", "o": ["Acumulación de formaldehído y ácido fórmico", "Aumento de cuerpos cetónicos", "Disminución de la producción de bicarbonato renal", "Acumulación de ácido láctico por hipoxia tisular primaria"]}, {"n": 70, "q": "Abril, una niña de 3 años, es traída al servicio de emergencias tras presentar un episodio de apróx 1 minuto de duración, consistente en aumento de tono muscular junto con contracciones y relajaciones clónicas generalizadas y breves. La madre refiere que Abril es una niña sana y niega antecedentes médicos importantes. Comenta que la niña estaba en brazos de ella mientras recibía un antifebril cuando de forma súbita, comenzó con el episodio descrito. Al examen físico, Abril se encuentra en buen estado general, vigil, sin signos de foco neurológico, y cursando la exploración dentro de límites normales. De acuerdo con un diagnóstico presuntivo, ¿cuál es la conducta terapéutica más adecuada?", "o": ["Administrar antipiréticos por vía oral, tranquilizar y educar a los padres", "Iniciar anticonvulsivantes de mantenimiento", "Solicitar TAC cerebral urgente", "Internación en UCI y punción lumbar inmediata"]}, {"n": 71, "q": "Lucas, un lactante de 2 meses de edad previamente sano, es traído al servicio de urgencias por su madre debido a fiebre de 37.8 °C, retracción costal, abundantes secreciones nasales y dificultad para alimentarse (toma pecho). La madre menciona que estos síntomas comenzaron hace 48 horas. Lucas ha estado más irritable y ha demostrado dificultad para respirar debido a la congestión nasal. El control de signos vitales: FR: 60 FC: 160, Saturometria de O2: 94% en aire ambiente s afirmaciones es correcta?", "o": ["Se puede excluir estenosis coronaria porque el test es negativo", "No se puede excluir estenosis coronaria porque el valor predictivo positivo de la prueba es alto", "La prueba confirma el diagnóstico por la alta sensibilidad", "El resultado no es interpretable por falta de especificidad"]}, {"n": 83, "q": "Varón de 50 años pendiente de cirugía de hernia inguinal. En el preoperatorio, la gasometría basal muestra los siguientes resultados: pH 7.37, PO2 41 mmHg, PCO2 46 mmHg, saturación de O2 74%. La radiografía de tórax es normal, y el paciente se encuentra asintomático. ¿Cuál de las siguientes situaciones es la más probable?", "o": ["Insuficiencia respiratoria hipercápnica aguda", "Tromboembolismo pulmonar asintomático", "Muestra venosa (error preanalítico)", "Enfermedad pulmonar obstructiva crónica severa descompensada"]}, {"n": 84, "q": "Un paciente de 62 años con antecedentes de diabetes tipo 2 de 15 años de evolución concurre a la consulta con estudios realizados hace 3 años que mostraban proteinuria de 0.5 g/24 hs y creatinina sérica de 1.1 mg/dl. Actualmente presenta excreción urinaria de proteínas de 2.8 g/24 hs, creatinina sérica de 5 mg/dl, con una tasa de filtrado glomerular de 21 ml/min/1.73 m² y tensión arterial de 152/90 mmHg. ¿Cuál es el diagnóstico más probable y la conducta inicial más adecuada?", "o": ["Enfermedad renal crónica estadio 5, iniciar terapia renal sustitutiva", "Enfermedad renal crónica estadio 2, control ambulatorio", "Nefropatía diabética inicial, iniciar solo dieta hipoproteica", "Insuficiencia renal aguda prerrenal, hidratación y control"]}, {"n": 85, "q": "Usted está como médico en una ambulancia de emergencias y lo llaman para atender a un joven de 16 años que recibió unas puñaladas y fue golpeado en un estadio deportivo. El paciente está inconsciente. Presenta 3 heridas por las que entra aire en el hemotórax izquierdo y 2 heridas incisas en la cara anterior y medial del muslo derecho por las que sangra de forma pulsátil. ¿Cuál es la actitud a adoptar de forma inmediata antes de la llegada al hospital?", "o": ["Intubación orotraqueal inmediata en el lugar y luego traslado", "Exploración quirúrgica de las heridas en el sitio del evento", "Observación en escena hasta estabilización completa", "Taponamiento parcial de las heridas torácicas seguido de compresión de las heridas de extremidades y traslado"]}, {"n": 86, "q": "Paciente de 65 años, EPOC, sexo femenino, que consulta por fiebre, tos y expectoración purulenta de 2 días de evolución. Examen físico: paciente confusa, TA 90/60 mmHg, TO axilar 39°C, frecuencia respiratoria 36 por min, frecuencia cardíaca 130 por min; matidez, crepitantes y soplo tubario en base derecha. Laboratorio: Gases en sangre: pH 7.34, PCO2 50 mmHg, leucocitos: 25,000/mm³, urea 60 mg%. Infiltrado con broncograma aéreo en base derecha. Ud. decide:", "o": ["Manejo ambulatorio con amoxicilina", "Alta con tratamiento sintomático", "Internación en terapia intensiva y tratamiento con ceftriaxona y macrólidos", "Observación en guardia sin antibióticos"]}, {"n": 87, "q": "Una mujer de 45 años, que se encuentra realizando un tratamiento \"natural\" para adelgazar, es traída por su esposo a urgencias. Presenta parestesias peribucales y calambres intensos. En el envase de las \"píldoras naturales\" se lee: Diazepam 0.5 mg, Furosemida 40 mg, Mentopeptol 5 mg, Bisacodilo 5 mg. Se realiza un ECG en el que se aprecian ondas T aplanadas y prolongación del intervalo QT. Estos hallazgos probablemente se correlacionen con:", "o": ["Hiperkalemia", "Hipopotasemia", "Hipercalcemia", "Acidosis metabólica"]}, {"n": 88, "q": "Un paciente de 48 años, tabaquista de 10 cigarrillos/día, lo consulta pues, luego de la toma de clindamicina que le indicaron por una infección de piel y partes blandas, presenta diarrea profusa con algo de moco y de color verdoso, dolor abdominal difuso y astenia. Su presunción diagnóstica es:", "o": ["Colitis por Clostridioides difficile", "Gastroenteritis viral aguda", "Síndrome de intestino irritable", "Intolerancia a la lactosa"]}, {"n": 89, "q": "Un operario de una estación de servicios sufre una quemadura con agua hirviendo al abrir la tapa de un radiador. Usted trata las lesiones que presenta el paciente en la cara, la porción anterior del tronco y la porción anterior del miembro inferior derecho. Al derivarlo, su aseguradora de riesgo de trabajo le pide que informe, para el cálculo del pronóstico, la extensión de la superficie corporal quemada. Usted informa que es:", "o": ["18%", "27%", "36%", "45%"]}, {"n": 90, "q": "La anatomía patológica de un varón de 45 años, apendicectomizado, es informada como: Tumor carcinoide apendicular de 1 cm de diámetro, que llega hasta la submucosa, localizado a nivel de la punta del apéndice. ¿Cuál es la actitud a seguir ante este enfermo?", "o": ["Hemicolectomía derecha", "Quimioterapia adyuvante", "Conducta expectante", "Radioterapia local"]}, {"n": 91, "q": "Un paciente de 32 años, que cursa el tercer día de posoperatorio de una peritonitis apendicular, presentó un acceso de tos muy intenso. El abdomen se había abordado mediante una incisión mediana infraumbilical, encontrándose un apéndice perforado en su extremo con la base conservada y peritonitis purulenta difusa. Se realizó apendicectomía con jareta invaginante y colocación de dos drenajes. En el examen físico presenta dolor abdominal, distensión y secreción de material serohemático por la herida. ¿Cuál sería el diagnóstico más probable?", "o": ["Íleo paralítico posoperatorio", "Dehiscencia laparotómica incompleta", "Absceso intraabdominal", "Infección superficial de herida quirúrgica"]}, {"n": 92, "q": "Un hombre de 32 años con antecedentes de colitis ulcerosa de 3 meses de evolución, tratado con\\prednisona (40 mg/día) y mesalazina (4 g/día), acude al servicio de urgencias por empeoramiento de su estado general, acompañado de un aumento en el número de deposiciones (hasta 10 diarias, todas con n el examen físico presenta dolor abdominal, distensión y secreción de material serohemático por la herida. ¿Cuál sería el diagnóstico más probable?", "o": ["Íleo postoperatorio", "Dehiscencia laparotomía incompleta", "Dehiscencia laparotomía completa", "Dehiscencia de la jareta invaginante"]}, {"n": 4, "q": "Una paciente de 43 años consulta disfagia, regurgitación, adelgazamiento y tos de varios meses de evolución. Se le solicita una seriada esofagogastroduodenal que evidencia una ausencia de la cámara aérea gástrica, nivel bario-aéreo en el esófago y signo de la cola de ratón en el esófago distal. ¿Cuál el diagnóstico más probable conducta más adecuada?", "o": ["Espasmo difuso del esófago e indicación de miotomía longitudinal extensa extra mucosa", "Divertículo verdadero (por tracción) secundario a tuberculosis ganglionar subcarinal e indicación de tratamiento médico de la enfermedad de base", "Acalasia y solicitud de manometría esofágica y endoscopia digestiva alta antes de indicar cualquier tratamiento", "Hernia hiatal e indicación de cirugía de reparación"]}, {"n": 5, "q": "Paciente femenina de 45 años, sin antecedentes médicos significativos, presenta dolor en el epigastrio desde hace 24 horas, acompañado de vómitos. El dolor es constante, no se alivia con la ingesta de alimentos y se irradia hacia la espalda. En el examen físico, el abdomen está distendido, con dolor a la palpación profunda en el epigastrio y sin reacción peritoneal. Los análisis de laboratorio muestran elevación de la amilasa y lipasa. Se realiza una ecografía abdominal que muestra a un páncreas agrandado e hipoecogénico. Dada la presunción diagnostica de pancreatitis aguda, ¿qué factor sería más importante para predecir la severidad y guiar el tratamiento en las primeras 48 horas?", "o": ["Niveles iniciales de amilasa y lipasa", "Hallazgos de necrosis en la tomografía computarizada inicial", "Escala de Ranson al ingreso las 48 horas", "Marcadores inflamatorios como la proteína C reactiva"]}, {"n": 6, "q": "Una paciente de 63 años presenta úlcera de pierna ubicada en la región maleolar externa, sus bordes son geográficos y presenta escaso dolor. El origen más probable es:", "o": ["Venoso", "Hipertensivo", "Vasculitico", "Arterial"]}, {"n": 7, "q": "Concurre al consultorio un paciente de 66 años, derivado por el clínico que presenta en un hallazgo de una tomografía abdominal, un tumor en porción cefálica del páncreas. No presenta compromiso de la vena y arteria mesentérica, con ausencia de secundarismo. ¿Qué tratamiento se considera de criterio oncológico curativo para esta patología¿", "o": ["Colocación de stent biliar y gastroyeyunoanastomosis", "Tumorectomía más derivación biliodigestiva", "Bloqueo del plexo solar y pancreatectomía total", "Duodeno pancreatectomía cefálica"]}, {"n": 8, "q": "Ingresa a la guardia un joven de 32 años que presenta una herida penetrante en el abdomen por violencia interpersonal. Al ingreso se encuentra somnoliento, GCS: 10/15; SatO2: 95%, FR: 18, FC: 82, TA: 110/70. Los familiares refieren abuso de sustancia. Presenta una herida en hipocondrio Izquierdo con salida de epiplón a través de esta. ¿Caul es la práctica por realizar?", "o": ["Sutura de la lesión y control", "Tomografía de abdomen y pelvis", "Radiografía de tórax y pie", "Laparotomía exploradora"]}, {"n": 9, "q": "Varón de 75 años, HTA, DBT, consulta por fiebre, dolor torácico, tos y expectoración. En la radiografía de tórax consolidación en base derecha. Se comienza esquema antibiótico con Amoxicilina/Ac. Clavulanico. Evoluciona con empeoramiento de síntomas, se realiza toracocentesis donde se evidencia derrame pleural que se punza y se objetiva PH de 6,95 con consumo de glucosa y LDH de 2000. La tinción de Gram es negativa. ¿Qué conducta tomaría¿", "o": ["Colocar drenaje pleural", "Es un trasudado por lo cual realizo toracocentesis contralateral", "Conducta expectante", "Rotas antibioticoterapia a tazo-vancomicina"]}, {"n": 10, "q": "Alberto de 65 años, se realiza una ecografía abdominal por haber presentado un cólico biliar. El resultado muestra vesícula de paredes delgadas, sin cas en su interior. Ambos riñones de forma y estructura conservada. Se identifica dilatación de aorta abdominal en la porción infrarrenal con un diámetro de 40 mm. En virtud de ese hallazgo ¿Cuál sería la conducta por seguir?", "o": ["Control con ecografía cada 6 meses y control de factores de riesgo", "Llevarlo a quirófano de urgencia porque puede ser la causa de lo que se interpretó como cólico biliar", "Realización de TAC con y sin contraste en forma urgente", "Derivar al cirujano vascular realice cirugía del aneurisma"]}, {"n": 11, "q": "Un adolescente de 17 años es llevado a urgencias por dolor abdominal en el cuadrante inferior derecho. A la exploración presente fiebre, dolor a la palpación profunde en la fosa iliaca derecha, y signo de rebote positivo. ¿Cuál es el diagnostico más probable?", "o": ["Apendicitis aguda", "Obstrucción intestinal", "Colecistitis aguda", "Diverticulitis"]}, {"n": 12, "q": "Un hombre de 60 años acude con dolor abdominal intenso en cuadrante inferior izquierdo, fiebre y leucocitosis. La tomografía computadorizada muestra divertículos inflamados en el colon sigmoides. ¿Cuál es el diagnóstico y tratamiento más adecuado?", "o": ["Diverticulitis aguda; iniciar antibióticos y dieta líquida", "Obstrucción intestinal; colocar sonda nasogástrica", "Apendicitis aguda; apendicectomia", "Cáncer de colon, cirugía urgente"]}, {"n": 13, "q": "Un paciente 40 años consulta por presentar días atrás pérdida de la conciencia durante el ejercicio. En la lectura de su ECG se observa una falla intermitente en la conducción de la onda P sin cambios en los intervalos PR precedentes. ¿ Cual el el diagnóstico?", "o": ["Bloqueo AV completo", "Bloqueo AV de 2do grado tipo Mobitz 2", "Bloqueo AV de 1er grado", "Bloqueo AV de 2do grado tipo Mobitz 1"]}, {"n": 14, "q": "Paciente masculino de 72 años es traído a la consulta por cambios conductuales y alucinaciones visuales desde hace 6 meses. Tiene antecedentes de HTA mal controlada y DBT 2. Examen físico signos vitales normales, neurológico: bradicinesia, rigidez leve de los miembros superiores, inestabilidad postural, cognitivo: orientación fluctuante en tiempo y lugar, dificultad en la atención y la memoria reciente, alteración de la percepción visual. RMN: cambios leves de la sustancia blanca, sin atrofia significativa, ¿Cuál es el diagnostico más probable?", "o": ["Demencia frontotemporal", "Demencia por cuerpos de Lewy", "Enfermedad de Alzheimer", "Enfermedad de Parkinson"]}, {"n": 15, "q": "Paciente femenina de 21 años que acude a la consulta por presentar un nódulo en la mama derecha con dolor intenso hace 1 mes. Fue remitida a cirugía donde le realizaron una biopsia con aguja gruesa, cuyo resultado indico la presencia de un carcinoma ductal invasivo en estadio III. ¿Cuál de las siguientes opciones corresponde a dicho estadio?", "o": ["El tumor mide menos de 5 cm y se ha diseminado a los ganglios linfáticos axilares de forma palpable o a los ganglios situados detrás del esternón.", "El tumor mide más de 5 cm y se ha diseminado a los ganglios linfáticos axilares o a los ganglios situados detrás del esternón.", "Tumor de cualquier tamaño que afecta la pared del tórax a la piel de la mama.", "El tumor mide de 2 a 5 cm (con o sin diseminación ganglionar axilar)."]}, {"n": 16, "q": "Paciente de 75 años que acude a la consulta por sintomatología de obstrucción urinaria, PSA 8.1 ng/ml, sin otra clínica acompañante. El tacto rectal y la ecografía abdominopélvica evidencian una próstata pétrea. Se realiza resección transuretral desobstrutiva y la anatomía patológica revela carcinoma grado ISUP 3, ¿Cuál de las siguientes opciones corresponde a dicho grado de diferenciación?", "o": ["Predominantemente glándulas cribiformes, fusionadas y mal formadas con un menor componente de glándulas bien formadas.", "Infiltración de estroma que se extiende entre las glándulas normales. Existe una fusión entre las glándulas.", "Predominantemente glándulas bien formadas con un menor componente de glándulas cribiformes, fusionadas o pobremente formadas.", "Ausencia de diferenciación glandular o necrosis con o sin glándulas cribiformes, mal formadas o fusionadas."]}, {"n": 17, "q": "Paciente masculino de 36 años, pintor de profesión, sin antecedentes personales ni familiares de interés. Acude a la consulta por un cuadro de 2 meses de evolución que consiste en tumefacción intensamente dolorosa de rodilla, tobillo y dorso del pie izquierdo de perfil inflamatorio, y que ocasiona importante limitación funcional. Refería, además, aparición espontanea de lesiones cutáneas pápulo-pustulosas de tipo acneiforme distribuidas en miembros inferiores, así como sequedad ocular bilateral con enrojecimiento del ojo derecho, sugerente de epiescleritis. En la anamnesis dirigida por aparatos revela la aparición reiterada de aftosis oral (nunca genital), con aftas muy profundas y dolorosas, de evolución tórpida y lenta resolución. Analítica: PCR 186 mg/l. VSG 99 mm/h, Hemocultivos seriados y cultivo de pústulas negativos. También se solicitaron múltiples serologías, así como estudio de autoinmunidad, siendo negativos con excepción de HLAB 51 positivo. ¿Cuál es el diagnostico de este paciente?", "o": ["Síndrome de Sjögren", "Artritis Reumatoide", "Enfermedad de Behcet", "Lupus eritematoso sistémico"]}, {"n": 18, "q": "Paciente femenina de 50 años acude a la consulta por presentar sensación de arenilla en los ojos y sequedad en la boca de varios meses de evolución. Refiere que necesita beber agua frecuentemente durante las comidas y que, por las noches, suele despertarse con sed. En los últimos meses ha notado además dolor y rigidez en las articulaciones de manos y rodillas, especialmente en las mañanas. Tiene como antecedentes personales hipotiroidismo tratado con levotiroxina y dice que su madre tiene artritis reumatoide. Al examen físico presenta mucosa oral seca con fisuras, conjuntivas ligeramente hiperémicas, articulaciones dolorosas sin signos de inflamación evidentes. ¿Cuál es el diagnostico más probable?", "o": ["Síndrome poliglandular autoinmune tipo II", "Artritis reumatoide", "Lupus eritematosos sistémico", "Síndrome de Sjögren"]}, {"n": 19, "q": "Paciente masculino de 54 años es llevado a sala de emergencias por un cuadro de dolor súbito de 3 horas de evolución, localizado en flanco derecho y que irradia hacia ingle homolateral que asocia a náuseas y un episodio de vómitos. Refiere haber realizado actividad física intensa la mañana. Tiene como antecedentes HTA controlada con enalapril. Al examen físico presenta Temperatura 36.8 ºC TA 135/85/mmHg, FC 80 lpm. Abdomen blando, depresible, doloroso a la palpación en flanco derecho, Signo de Giordano positivo, ¿cuál es el diagnostico más probable?", "o": ["Apendicitis aguda", "Ulcera gástrica perforada", "Litiasis renal", "Colecistitis aguda"]}, {"n": 20, "q": "Paciente masculino de 67 años llega a la sala de emergencias por un cuadro de epigastralgia de 2 hs de evolución asociada a nauseas, diaforesis y lumbalgia. Refiere que esa mañana estuvo realizando obras de reparación en su casa por varias horas y que el dolor inició en ese momento. Tiene antecedentes de hipertensión en tratamiento con captopril y bisoprolol, dislipemia en tratamiento con atorvastatina, litiasis biliar. Al examen físico presenta Temperatura 37 °C, TA 110/70 mmHg y FC. 70 lpm. Abdomen blando, depresible, doloroso en epigastrio, sin defensa ni reacción peritoneal. ¿Cuál es el diagnostico más probable?", "o": ["Litiasis renal", "Úlcera gástrica", "Colecistitis Aguda", "IAM de cara inferior"]}, {"n": 21, "q": "Paciente femenina de 35 años viene a la consulta para control de sus enfermedades de base. La misma tiene antecedentes de baja desarrollo puberal, vitíligo segmentario, queratoconjuntivitis a repetición desde la infancia, hipoplasia del esmalte dentario, distrofia ungueal , avidez por la sal de larga data, Síndrome poliglandular autoinmune tipo 1. ¿Cuál de los siguientes cuadros clínicos NO acompaña a este síndrome?", "o": ["Diabetes mellitus tipo 1", "Tiroiditis autoinmune", "Miastenia gravis", "Candidiasis mucocutánea desde la infancia"]}, {"n": 22, "q": "Paciente femenina de 42 años con antecedentes de enfermedad de Addison diagnosticada hace 10 años en tratamiento con hidrocortisona 30 mg/día intercurre con alopecia areta universal en 2020 que remitió completamente luego de tratamiento. Refiere haber comenzado hace unas semanas con hipersomnia y astenia constante que por momentos se asocia con cuadro de hipoextensión y vómitos, cuadro que requiere intervención por guardia. Se le realizo laboratorio de rutina: cortisol sérico basal menor 3 mcg/dl, ACTH elevada, glucemia 70 mg/dl, colesterol total 210, triglicéridos 177, T3 2,3; T4 0,6 ng/dl, ATPO 28.6 U/ml (+), ATG 110 u/ml. Indique a tipo de síndrome poliglandular autoinmune podría pertenecer ese paciente.", "o": ["Tipo I", "Tipo IV", "Tipo III", "Tipo II"]}, {"n": 23, "q": "Paciente femenina de 32 años viene a la consulta por 110 días de amenorrea. Niega relaciones sexuales, niega posibilidad de embarazo. Del interrogatorio se desprende que tenía ciclos menstruales irregulares para ello se le indicaron anticonceptivos hormonales vía oral, los cuales abandono diciembre pasado. Refiere imposibilidad para bajar de peso y aumento del vello corporal. Hace dos años fue intervenida por una torsión de ovario. Trae consigo analítica reciente que arroja los siguientes resultados: LH 12 mUI/ml (VN: fase folicular 2-10 m UI/ml); FSH 4 m UI/ ML (VN: fase folicular 2- 12); relación LH/FSH 3:1; Testosterona total 80 ng/dl (VN: 20 a 70); androstenediona 3,6 ng/ml (VN: 0.5-2,7); 17-Hidroxiprogesterona 2 ng/mi; hormona antimulleriana 5 ng/ml (VN: mujeres fértiles 1-4); prolactina 15 ng/ml (VN: 5-25); TSH 1.8 mUI/L; T4L 1,2 ng/dl; glucosa en ayunas 101 mg/dl; insulina en ayunas 28 U/ml; Índice HOMA-IR 4,5 (v referencia mayor 2,5); colesterol total 210 mg/dl; Trigliceridos 180 mg/dl; HDL 40 mg/dl; LDL 140 mg/dl. Ecografía transvaginal: Ovarios aumentados de tamaño con múltiples quistes de 2 a 9 mm dispuestos en collar de perlas. Usted sospecha SOP. ¿Cuál es la conducta terapéutica por tomar?", "o": ["Levonorgestrel 0.1 mg asociado a etinilestradiol 0,20 mg, espironolactona, metformina y cambios en el estilo de vida.", "Etinilestradiol 3 mg asociado con drospirenona 0,03 mg, espironolactona, metformina y cambios en el estilo de vida.", "Enantato de noretisterona 50 mg asociado a valerato de estradiol 5 mg IM, espironolactona, metformina y cambios en el estilo de vida.", "Medroxiprogesterona acetato 150 mg/ml IM trimestral, espironolactona, metformina y cambios en el estilo de vida."]}, {"n": 24, "q": "Paciente masculino de 60 años es traído a la guardia por un cuadro agudo de malestar general acompañado de eritema rojo brillante generalizado que ocupa el 90% de la superficie cutánea. Este asociado edema facial, purpura, dolor cutáneo, hipotermia y escalofrios. Tiene como antecedentes personales Hipertensión Arterial recientemente diagnosticada para lo que le indicaron captopril, hiperplasia benigna de próstata para la cual utiliza tamsulosina 0,4 mg/día. Se realiza laboratorio por guardia que arroja: leucocitosis 11.000/mm3, PCR aumentada, VSG aumentada y eosinofilia. Se sospecha eritrodermia inducida por fármacos. Usted decide:", "o": ["Internación en UTI, tratamiento con meprednisona 1 mg/kg/día asociado a betametasona valerato 0.1 g tópica.", "Internación en UTI, suspensión de la tamsulosina y tratamiento con meprednisona 1 mg/kg/día asociado a betametasona valerato 0,1 g tópica.", "Internación en UTI, suspensión del tratamiento antihipertensivo y tratamiento con meprednisona 1 mg/kg/día asociado a betametasona valerato 0,1 g tópica.", "Internación en clínica médica, suspensión del tratamiento antihipertensivo y tratamiento tópico con hidrocortisona tópica 2 x al día por periodos cortos de tiempo."]}, {"n": 25, "q": "Paciente femenina de 42 años en tratamiento con Bupropión para dejar de fumar es traída a la guardia presentando malestar general asociado a odinofagia, dificultad para deglución y pequeñas vesículas diseminadas por la piel que no superan el 10% de la superficie cutánea y evolucionan a lesiones diana atípicas, localizadas sobre todo en torso con signo de Nikolsky positivo. Asimismo, presenta erosiones y costras serohemáticas en bermellón de labios y ulceras en mucosa bucal y paladar. Se sospeche síndrome de Stevens Johnson. Usted decide", "o": ["Internación en UTI, suspensión del fármaco y tratamiento con ciclosporina en dosis 3-6 mg/kg/día repartido en dosis diarias.", "Manejo ambulatorio, suspensión del fármaco, tratamiento con GCC tópicos sobre las lesiones y control en 72 hs.", "Internación en clínica médica, suspensión del fármaco y tratamiento con GCC meprednisona 1g/día .", "Manejo ambulatorio, suspensión del fármaco, tratamiento con GCC meprednisona 80 mg/día VO y control en 72 hs."]}, {"n": 26, "q": "Paciente masculino de 60 años que viene a la consulta por parálisis facial de hemicara derecha .En el interrogatorio tiene como antecedente síndrome gripal hace 7 días que fue seguido de otodinia intensa. Al examen físico se constata temperatura axilar de 37 ºC, erupción vesiculosa transparente de base eritematosa en pabellón auricular homolateral a la parálisis. ¿Cuál el diagnostico de este paciente?", "o": ["Síndrome de Sicard", "Enfermedad de Lyme", "Síndrome de Ramsay Hunt", "Neurosarcoidosis"]}, {"n": 27, "q": "Paciente masculino de 70 años que viene a la consulta por presentar disminución de la agudeza visual asociada a múltiples maculas eritematodescamativa en palmas y plantas compatibles con signo de Biett. En la oftalmoscopia se observa retinitis con áreas de isquemia que se ven como manchas blancas. ¿Cuál es el tratamiento apropiado para este paciente?", "o": ["Penicilina G benzatínica 2.400.000 Ul por s ales arrojan TSH 0.02 microunidades/ml, T3 8.7 pg/ml, T4 3.1 pg/ml, ATPO menor 10 UI/ml, Antitiroglobulina menor 20 UI/ml. Se decide realizar prueba de captación de I-131 cual arroja captación heterogénea de yodo. Indique diagnostico más probable.", "o": ["Enfermedad-de-Graves", "Socio nodular toxico", "Tiroiditis subaguda", "Adenoma toxico"]}, {"n": 30, "q": "Paciente masculino de 82 años que viene a control de enfermedades de base. El mismo tiene antecedentes de diabetes mellitus tipo 2 en tratamiento con metformina 2 gr/día, glibenclamida 10 mg/día, obesidad 33 kg/m2, hipertensión arterial tratada con losartán 100 mg/día, amlodipina 10 mg/día y carvedilol 25 mg/dia. Refiere disminución de la agudeza visual progresiva desde hace unos meses. Trae consigo fondo de ojo solicitado en la consulta anterior. En él se informa: Irregularidades del calibre arteriolar difusas; signos de cruce arteriovenosos; exudades duros, mínimas hemorragias y trombosis venosas. ¿A qué grado retinopatía hipertensiva pertenece ese informe?", "o": ["Retinopatía hipertensiva de grado 2", "Retinopatía hipertensiva de grado 1", "Retinopatía hipertensiva de grado 4", "Retinopatía hipertensiva de grado 3"]}, {"n": 31, "q": "Paciente femenina de 57 años consulta por un cuadro de artralgias en manos, muñecas y rodillas asociadas a rigidez matinal, nódulos subcutáneos en áreas de presión y ojos secos desde hace 15 años. Actualmente realiza tratamiento con metotrexato 15 mg/sem. ¿Cuál de siguientes fármacos NO corresponde al grupo de Fármacos Antirreumáticos Modificadores de la Enfermedad (FAMES) convencionales?", "o": ["Sulfasalazina", "etanercept", "Leflunomida", "Hidroxicloroquina"]}, {"n": 32, "q": "Paciente femenina de 72 años con diagnóstico de artritis reumatoide de mucho tiempo de evolución presenta deformidad en cuello de cisne. ¿Con cuáles alteraciones articulares se correlaciona este signo?", "o": ["Articulaciones interfalángica proximal y distal ambas en hiperextensión", "Articulaciones interfalángicas proximal y distal ambas en flexión", "Articulación interfalángica proximal en hiperextensión e interfalángica distal en flexión", "Articulación interfalángica proximal en flexión e interfalángica distal en hiperextensión"]}, {"n": 33, "q": "Paciente masculino de 50 años acude a la consulta refiriendo cirrosis intensa, especialmente después de las ingestas y al acostarse. También presenta dificultad para tragar en ocasiones. Menciona que estos síntomas han empeorado en los últimos 6 meses y que a veces no lo dejan dormir. Niega pérdida de peso y cambios en el apetito. Se realiza una pH-MII cuyo resultado arroja: impedancia basal menor 1500 ohmios, TAE mayor 0.6%, episodios totales de reflujo mayor 80/día. ¿Cuál es el diagnostico más probable?", "o": ["Enfermedad por reflujo gastroesofágico", "Colelitiasis", "Ulcera péptica", "Gastritis crónica"]}, {"n": 34, "q": "Paciente masculino de 43 años con antecedentes de asma grave, con múltiples hospitalizaciones en el último año. La disnea empeora luego de consumir aspirina. Además , menciona obstrucción nasal persistente y perdida del olfato. En el examen físico se observa. ¿Cuál el diagnostico más probable?", "o": ["Síndrome de Samter", "Asma asociada a rinosinusitis crónica", "Granulomatosis puede ser poliangeítis", "Rinosinusitis crónica com poliposis"]}, {"n": 35, "q": "Mujer de 30 años con antecedente de parto hace 48hs complicado con atonía uterina que astenia. ¿Cuál es su presunción diagnostica?", "o": ["Síndrome de Chiari", "Síndrome de Argonz del Castillo", "Síndrome de Sheehan", "Síndrome de Asherman"]}, {"n": 36, "q": "Una mujer de 22 años acude a consulta por poliuria, polidipsia y pérdida de peso. En el examen físico se encuentra delgada y deshidratada. Los análisis de sangre revelan hiperglucemia significativa. ¿Cuál es el diagnóstico, el método de diagnóstico más adecuado y el tratamiento inicial?", "o": ["Diabetes mellitus tipo 1, niveles séricos de glucosa y hemoglobina A1c, y tratamiento con insulina.", "Síndrome metabólico, perfil lipídico y prueba de tolerancia a glucosa, y tratamiento con dieta y ejercicio.", "Hipoglucemia reactiva, prueba de tolerancia a la glucosa, y tratamiento con suplementos de glucosa.", "Diabetes mellitus tipo 2, niveles séricos de glucosa y hemoglobina A1c, y tratamiento con metformina."]}, {"n": 37, "q": "Una mujer de 58 años, con antecedentes de cáncer de mama tratado hace cinco años y actualmente en remisión, llega al servicio de urgencias con dolor abdominal de inicio súbito y severo en la fosa iliaca derecha, acompañado de náuseas y vómitos. La paciente menciona pérdida de de peso de aproximadamente aproximadamente 5 kg en los últimos dos meses y comenta que he tenido episodios de diarrea intermitente. En la exploración física, se observa fiebre de 38.3 °C, sensibilidad marcada en la fosa iliaca derecha y reacción peritoneal. Los análisis de laboratorio muestran leucocitosis (21.000/mm3), hemoglobina de 11 g/dl, proteína C reactiva elevada (150 mg/L) y un incremento de CA 19-9 (125 U/mL). Una tomografía computarizada de abdomen revela una masa de 5 cm en el intestino delgado, con engrosamiento de las paredes circundantes x signos de obstrucción intestinal parcial. ¿Cuál es el diagnóstico más probable en este caso?", "o": ["Linfoma e intestino delgado", "Apendicitis complicada com abcesso", "Tumor neuroendócrino de intestino delgado", "Recurrencia de cáncer de mama con metástasis peritoneal"]}, {"n": 38, "q": "Hombre de 65 años, antecedentes de hipertensión y diabetes tipo 2, acude a urgencias por dolor abdominal intenso en el hipocondrio derecho y fiebre de 38.5 °C desde hace 48 horas. Refiere que el dolor comenzó de forma gradual y ha empeorado progresivamente, acompañado de náuseas y un episodio de vomito. En la exploración física se observa ictericia leve, sensibilidad en el hipocondrio derecho y signo de Murphy positivo. Los exámenes de laboratorio muestran leucocitosis (18,000/mm2), elevación de bilirrubina total
